s.","a":"True"},{"id":"16-TF-9","t":"TF","q":"Federally-supervised banks in the U.S. must make an “affirmative effort” to provide loans and other services to all credit-worthy borrowers in their chosen service area.","a":"True"},{"id":"16-TF-10","t":"TF","q":"Loans to minors are not legally enforceable contracts in most states.","a":"True"},{"id":"16-TF-11","t":"TF","q":"The letter “C” in the CAMELS rating system for banks in the U.S. refers to the “condition” of a bank.","a":"False"},{"id":"16-TF-12","t":"TF","q":"The letter “M” in the CAMELS rating system for banks in the U.S. refers to the “management quality” of a bank.","a":"True"},{"id":"16-TF-13","t":"TF","q":"The process of loan review means that a loan committee must generally approve a loan before the borrower is told the loan is approved.","a":"False"},{"id":"16-TF-14","t":"TF","q":"Troubled loans normally are subject to more frequent review than are sound loans.","a":"True"},{"id":"16-TF-15","t":"TF","q":"Credit card loans are generally more profitable for small and medium-size banks than for the largest banks.","a":"False"},{"id":"16-TF-16","t":"TF","q":"Banks should concentrate their lending on those loans in which they have the greatest cost advantage.","a":"True"},{"id":"16-TF-17","t":"TF","q":"The type of bank loan experiencing the largest losses per dollar of loan is credit card loans.","a":"True"},{"id":"16-TF-18","t":"TF","q":"Construction loans by a bank fit under the loan category known as commercial and industrial loans.","a":"False"},{"id":"16-TF-19","t":"TF","q":"If the economy slows down a bank should review its outstanding loans more frequently.","a":"True"},{"id":"16-TF-20","t":"TF","q":"Foreclosure on property pledged behind a bank loan does not subject a bank to liability to clean up any environmental damage the borrower may have caused to happen.","a":"False"},{"id":"16-TF-21","t":"TF","q":"Loans granted to businesses appear to convey positive information to the market place about a borrower’s credit quality, enabling a borrower to obtain more and cheaper funds from other sources.","a":"True"},{"id":"16-TF-22","t":"TF","q":"Financial institutions that disagree with examiner classifications of their loans can appeal these examiner ratings.","a":"True"},{"id":"16-TF-23","t":"TF","q":"A rating of “5”* *is the highest and best rating that a U.S. bank can receive under the CAMEL rating system.","a":"False"},{"id":"16-TF-24","t":"TF","q":"Accounts receivable financing means that a bank actually takes over ownership of receivables, whereas factoring means that a bank merely lends money on a borrowing customer’s receivables and the customer still has ownership of the receivables.","a":"False"},{"id":"16-TF-25","t":"TF","q":"A restriction against a borrower taking on new debt is an affirmative covenant in a loan contract.","a":"False"},{"id":"16-TF-26","t":"TF","q":"Loan review is considered to be a luxury, not a necessity for most banks, especially those with sound lending policies.","a":"False"},{"id":"16-TF-27","t":"TF","q":"Cash is one of the 6 C’s of lending and refers to the fact that the lender wants to make sure the borrower has the ability to generate enough cash to repay the loan.","a":"True"},{"id":"16-TF-28","t":"TF","q":"There are three principal sources of cash to repay a loan. These are cash flows generated from sales or income, funds generated from the liquidation of assets and funds raised by selling debt or equity securities.","a":"True"},{"id":"16-TF-29","t":"TF","q":"Negative covenants require the borrower to take certain actions.","a":"False"},{"id":"16-TF-30","t":"TF","q":"Affirmative covenants restrict a borrower from doing certain things.","a":"False"},{"id":"16-TF-31","t":"TF","q":"For ease and convenience most banks have the loan review conducted by the same person who makes the loan. This is particularly true of large banks.","a":"False"},{"id":"16-TF-32","t":"TF","q":"A loan workout is when the bank and the customer initially negotiate the terms of the loan.","a":"False"},{"id":"16-TF-33","t":"TF","q":"A written loan policy gives loan officers and the bank’s management specific guidelines in making individual loan decisions and in forming the bank’s loan portfolio.","a":"True"},{"id":"16-TF-34","t":"TF","q":"Commercial and industrial loans are loans to businesses to cover such things as purchasing inventory, paying taxes and meeting payroll expenses.","a":"True"},{"id":"16-TF-35","t":"TF","q":"Agriculture loans are loans that are made to individuals to finance vacations, purchase durable goods and other retail goods.","a":"False"},{"id":"16-TF-36","t":"TF","q":"The A in the CAMELS rating system stands for asset quality.","a":"True"},{"id":"16-TF-37","t":"TF","q":"Net cash flow from operations is the borrower’s net income expressed in cash rather than on an accrual basis.","a":"True"},{"id":"16-TF-38","t":"TF","q":"The “direct cash flow” method and “cash flow by origin” are two very different ways of assessing the cash flows of a potential borrower.","a":"False"},{"id":"16-TF-39","t":"TF","q":"Commercial banks are the largest originator of household loans.","a":"True"},{"id":"16-TF-40","t":"TF","q":"Following the recent global credit crisis, regulators have begun to emphasize the need for loan originators to know their borrowers better and retain some of the risk on loans that they sell.","a":"True"},{"id":"16-MC-1","t":"MC","q":"The principal economic function of banks is to:","a":"B","o":[["A","Take deposits"],["B","Make loans"],["C","Sell financial services"],["D","Encourage spending"],["E","None of the above"]]},{"id":"16-MC-2","t":"MC","q":"Loans extended to finance the purchase of automobiles, mobile homes, home appliances, and vacations are classified as:","a":"E","o":[["A","Real estate loans"],["B","Financial institutions"],["C","Agricultural loans"],["D","Commercial and industrial loans"],["E","None of the above"]]},{"id":"16-MC-3","t":"MC","q":"According to the textbook the largest category (by dollar volume) of loans extended by U.S. banks is:","a":"A","o":[["A","Real estate loans"],["B","Financial institutions"],["C","Agricultural loans"],["D","Commercial and industrial loans"],["E","None of the above"]]},{"id":"16-MC-4","t":"MC","q":"Banks that emphasize lending to commercial customers are labeled:","a":"A","o":[["A","Wholesale banks"],["B","Retail banks"],["C","Personal banks"],["D","Nonbank banks"],["E","Regional banks"]]},{"id":"16-MC-5","t":"MC","q":"The vast majority of FDIC-insured institutions are classified as:","a":"D","o":[["A","Credit card banks"],["B","Agricultural banks"],["C","Consumer lenders"],["D","Commercial lenders"],["E","Mortgage lenders"]]},{"id":"16-MC-6","t":"MC","q":"Real estate loans made by national banks in the U.S. cannot exceed:","a":"B","o":[["A","15 percent of a national bank’s total assets or 25 percent of its total capital."],["B","A national bank’s total capital and surplus or 70 percent of time and savings deposits, whichever is greater."],["C","20 percent of a national bank’s capital and surplus or 80 percent of its savings deposits, whichever is smaller in amount."],["D","25 percent of capital or 10 percent of the core deposits of a national bank, whichever gives the largest amount."],["E","None of the above."]]},{"id":"16-MC-7","t":"MC","q":"Loans to finance one-to-four family homes fall under which loan category?","a":"B","o":[["A","Commercial and industrial loans"],["B","Real estate loans"],["C","Loans to individuals"],["D","Single-payment loans"],["E","None of the above."]]},{"id":"16-MC-8","t":"MC","q":"The loan category experiencing the largest losses (loan defaults) is usually:","a":"A","o":[["A","Credit card loans"],["B","Real estate loans"],["C","Agricultural loans"],["D","Commercial and industrial loans"],["E","None of the above"]]},{"id":"16-MC-9","t":"MC","q":"The most costly type of loan to make (measured by the cost per dollar of loan) for a bank is usually:","a":"E","o":[["A","Real estate loans"],["B","Agricultural loans"],["C","Commercial and industrial loans"],["D","Loans to financial institutions"],["E","None of the above."]]},{"id":"16-MC-10","t":"MC","q":"Loans providing credit to finance the purchase of automobiles, mobile homes, appliances, and other retail goods to repair and modernize homes are classified under the category:","a":"C","o":[["A","Financial institution loans"],["B","Commercial industrial"],["C","Loans to individuals"],["D","Miscellaneous loans"],["E","None of the above"]]},{"id":"16-MC-11","t":"MC","q":"Loans extended to farm and ranch operations to assist in planting and harvesting crops and to support the feeding and care of livestock are known as:","a":"D","o":[["A","Real estate loans"],["B","Commercial and industrial loans"],["C","Land loans"],["D","Agricultural loans"],["E","None of the above."]]},{"id":"16-MC-12","t":"MC","q":"Loans granted to businesses to cover such expenses as purchasing inventories, paying taxes, and meeting payrolls are known as:","a":"A","o":[["A","Commercial and industrial loans"],["B","Agricultural loans"],["C","Real estate loans"],["D","Loans to individuals"],["E","None of the above."]]},{"id":"16-MC-13","t":"MC","q":"A lender that makes a loan to a minor would be violating which of the 6 C’s of lending?","a":"B","o":[["A","Character"],["B","Capacity"],["C","Cash"],["D","Control"],["E","Collateral"]]},{"id":"16-MC-14","t":"MC","q":"A lender that makes a loan that violates its written loan policy would be violating which of the 6 C’s of lending?","a":"D","o":[["A","Character"],["B","Capacity"],["C","Cash"],["D","Control"],["E","Collateral"]]},{"id":"16-MC-15","t":"MC","q":"Which of the following is a factor in determining the mix of loans that a bank has?","a":"E","o":[["A","The location of the bank"],["B","The size of the bank"],["C","The written loan policy of the bank"],["D","The experience and expertise of the management"],["E","All of the above are factors in determining the mix of loans"]]},{"id":"16-MC-16","t":"MC","q":"A loan to a local business to purchase a new machine would be categorized as:","a":"C","o":[["A","A consumer loan"],["B","An agriculture loan"],["C","A commercial and industrial loan"],["D","A real estate loan"],["E","None of the above"]]},{"id":"16-MC-17","t":"MC","q":"The lender's secondary source of repayment in case of default is:","a":"B","o":[["A","Capacity."],["B","Collateral."],["C","Character."],["D","Capital."],["E","Credit."]]},{"id":"16-MC-18","t":"MC","q":"A lender that makes a loan to an individual whose only income is commission based and who hasn’t made a sale in six weeks may be violating which of the 6 C’s of lending?","a":"C","o":[["A","Character"],["B","Capacity"],["C","Cash"],["D","Control"],["E","Collateral"]]},{"id":"16-MC-19","t":"MC","q":"Sean Carter has an excellent credit rating. Which of the 6 C’s of lending would this piece of information belong to?","a":"A","o":[["A","Character"],["B","Capacity"],["C","Cash"],["D","Collateral"],["E","Conditions"]]},{"id":"16-MC-20","t":"MC","q":"First National Bank of Edmond asks a prospective customer for her driver’s license. Which of the 6 C’s of lending would this piece of information belong to?","a":"B","o":[["A","Character"],["B","Capacity"],["C","Cash"],["D","Collateral"],["E","Conditions"]]},{"id":"16-MC-21","t":"MC","q":"The loan officer of Second National Bank of Laramie decides to review the insurance coverage of one of its business customers. Which of the 6 C’s of lending would this piece of information belong to?","a":"D","o":[["A","Character"],["B","Capacity"],["C","Cash"],["D","Collateral"],["E","Conditions"]]},{"id":"16-MC-22","t":"MC","q":"The TRC Company is required by its bank to pay no dividend over $3 per share. What is this?","a":"B","o":[["A","An affirmative covenant"],["B","A negative covenant"],["C","A Special covenant"],["D","A horizontal covenant"],["E","None of the above"]]},{"id":"16-MC-23","t":"MC","q":"A bank that primarily makes its loans to individuals, families and small businesses is:","a":"A","o":[["A","A retail bank"],["B","A wholesale lender"],["C","A money center bank"],["D","A money market bank"],["E","None of the above"]]},{"id":"16-MC-24","t":"MC","q":"The process of resolving a troubled loan so the lender can recover its funds is called the:","a":"C","o":[["A","Loan Review"],["B","Written Loan Policy"],["C","Loan Workout"],["D","Loan Commitment Agreement"],["E","None of the above"]]},{"id":"16-MC-25","t":"MC","q":"Which of the following is a sign of a potential loan problem?","a":"D","o":[["A","Timely receipt of financial statements from the company with a loan"],["B","Increases in the stock price of the company that has a loan"],["C","Increases in earnings for each of the last three years of a company"],["D","Changes in the methods used to account for inventory, depreciation and other items"],["E","All of the above are signs of problems with the loan"]]},{"id":"16-MC-26","t":"MC","q":"Which of the following should be part of the written loan policy?","a":"E","o":[["A","Lending authority of each loan officer and loan committee"],["B","Lines of responsibility for finding and reporting information within the loan department"],["C","A statement of quality standards for all loans"],["D","A statement for the preferred upper limit for total loans outstanding"],["E","All of the above should be part of the written loan policy"]]},{"id":"16-MC-27","t":"MC","q":"A lender reviews the partnership agreement of one of its small business customers. Which of the 6 C’s of lending would this piece of information belong to?","a":"B","o":[["A","Character"],["B","Capacity"],["C","Cash"],["D","Collateral"],["E","Conditions"]]},{"id":"16-MC-28","t":"MC","q":"A method whereby the loan officer focuses on how the borrower cash flows may change over time is known as:","a":"B","o":[["A","Indirect cash flow"],["B","Direct cash flow"],["C","Pervasive cash flow"],["D","Variable cash flow"],["E","Total cash flow"]]},{"id":"16-MC-29","t":"MC","q":"The South Carolina National Bank makes a loan to the Heritage Credit Union. What type of loan did this bank make?","a":"A","o":[["A","Financial institution loan"],["B","Commercial and industrial loan"],["C","Loans to individuals"],["D","Miscellaneous loans"],["E","Lease financing receivables"]]},{"id":"16-MC-30","t":"MC","q":"A loan for Colin Beverly to purchase a new Mazda Miata would fit into which of the following categories of bank loans?","a":"C","o":[["A","Financial institution loan"],["B","Commercial and industrial loan"],["C","Loan to an Individual"],["D","Miscellaneous loan"],["E","Lease financing receivables"]]},{"id":"16-MC-31","t":"MC","q":"The Price Bank of Edmond makes a loan to Home Depot. What type of loan has this bank made?","a":"B","o":[["A","Financial institution loan"],["B","Commercial and industrial loan"],["C","Loan to an individual"],["D","Miscellaneous loan"],["E","Lease financing receivables"]]},{"id":"16-MC-32","t":"MC","q":"The First State Bank of Duncan buys railroad cars and rents them to the Santa Fe Railroad Company. What type of loan has this bank made?","a":"E","o":[["A","Financial institution loan"],["B","Commercial and industrial loan"],["C","Loan to an individual"],["D","Miscellaneous loan"],["E","Lease financing receivables"]]},{"id":"16-MC-33","t":"MC","q":"The Third National Bank of Wichita makes a loan so that Tim Bridges can buy 1000 shares of Coca Cola stock. Which category of loans would this loan fit in best?","a":"D","o":[["A","Financial institution loan"],["B","Commercial and industrial loan"],["C","Loan to an individual"],["D","Miscellaneous loan"],["E","Lease financing receivables"]]},{"id":"16-MC-34","t":"MC","q":"The First State Bank is located in Guyman, Oklahoma which is in the middle of the wheat country of Oklahoma and as a result many of its loans are agriculture loans. What factor determining the growth and mixture of loans does this fact reflect?","a":"A","o":[["A","Characteristics of the market area"],["B","Lender size"],["C","The experience and expertise of management"],["D","The written loan policy of the bank"],["E","Bank regulations"]]},{"id":"16-MC-35","t":"MC","q":"The Second State Bank has less than $100 million in assets and as a result primarily makes real estate loans, other consumer loans and loans to very small businesses. What factor determining the growth and mixture of loans does this fact reflect?","a":"B","o":[["A","Characteristics of the market area"],["B","Lender size"],["C","The experience and expertise of management"],["D","The written loan policy of the bank"],["E","Bank regulations"]]},{"id":"16-MC-36","t":"MC","q":"Geoff Willis and Mary Williams the president and CEO of the First National Bank of Edmond both come from a background of retail banking. As a result they have decided to focus their lending activities on consumer loans and loans to small business. What factor determining the growth and mixture of loans does this fact reflect?","a":"C","o":[["A","Characteristics of the market area"],["B","Lender size"],["C","The experience and expertise of management"],["D","The written loan policy of the bank"],["E","Bank regulations"]]},{"id":"16-MC-37","t":"MC","q":"First State Bank’s loan policy manual states ‘that the goal of the bank is to make high quality loans for home mortgages, the purchase of automobiles and small business accounts receivables’. What factor determining the growth and mixture of loans does this fact reflect?","a":"D","o":[["A","Characteristics of the market area"],["B","Lender Size"],["C","The experience and expertise of management"],["D","The written loan policy of the bank"],["E","Bank regulations"]]},{"id":"16-MC-38","t":"MC","q":"The Second National Bank has capital and surplus of $100 million. The bank has decided that the most that it can loan to the Krumlova Manufacturing Company is $15 million. What factor determining the growth and mixture of loans does this most likely reflect for this bank?","a":"E","o":[["A","Characteristics of the market area"],["B","Lender size"],["C","The experience and expertise of management"],["D","The written loan policy of the bank"],["E","Bank regulations"]]},{"id":"16-MC-39","t":"MC","q":"A loan that appears to examiners to contain significant weaknesses or that represent a dangerous concentration of credit in one borrower or industry are called:","a":"B","o":[["A","Criticized loans"],["B","Scheduled loans"],["C","Substandard loans"],["D","Doubtful loans"],["E","Loss loans"]]},{"id":"16-MC-40","t":"MC","q":"A loan that examiners regard as uncollectible and unsuitable to be called a bank asset is called a:","a":"E","o":[["A","Criticized loan"],["B","Scheduled loan"],["C","Substandard loan"],["D","Doubtful loan"],["E","Loss loan"]]},{"id":"16-MC-41","t":"MC","q":"Dan Cross is a junior loan officer with First State Bank of Durant. He has been busy visiting local businesses to see of any of them need credit. Which step in the lending process is Dan performing?","a":"A","o":[["A","Finding prospective customers"],["B","Evaluating a customer’s character and sincerity"],["C","Making a site visit and evaluating a customer’s credit history"],["D","Evaluating a prospective customer’s financial condition"],["E","Assessing possible collateral and signing the loan agreement"]]},{"id":"16-MC-42","t":"MC","q":"Shelby Mann is a loan officer with the First National Bank. She interviews a potential loan customer to find out exactly why the person needs the loan and whether they would be serious about repaying the loan. Which step in the lending process is Shelby performing?","a":"B","o":[["A","Finding prospective customers"],["B","Evaluating a customer’s character and sincerity"],["C","Making a site visit and evaluating a customer’s credit history"],["D","Evaluating a prospective customer’s financial condition"],["E","Assessing possible collateral and signing the loan agreement"]]},{"id":"16-MC-43","t":"MC","q":"Jessica Simpson, a loan officer with First National Bank, visits the Tate Manufacturing Company and talks to other lenders to see their experience with Tate Manufacturing. What step in the lending process is Jessica performing?","a":"C","o":[["A","Finding prospective customers"],["B","Evaluating a customer’s character and sincerity"],["C","Making a site visit and evaluating a customer’s credit history"],["D","Evaluating a prospective customer’s financial condition"],["E","Assessing possible collateral and signing the loan agreement"]]},{"id":"16-MC-44","t":"MC","q":"Terry May, a loan officer with First National Bank, calculates liquidity and debt ratios for the Lava Lamp Company and also examines their cash flow statement. What step in the lending process is Terry performing?","a":"D","o":[["A","Finding prospective customers"],["B","Evaluating a customer’s character and sincerity"],["C","Making a site visit and evaluating a customer’s credit history"],["D","Evaluating a prospective customer’s financial condition"],["E","Assessing possible collateral and signing the loan agreement"]]},{"id":"16-MC-45","t":"MC","q":"Jerry LeGere, a loan officer with First National Bank, checks to see if the house pledged to back up a home mortgage has a clear title and proper insurance. What step in the lending process is Jerry performing?","a":"E","o":[["A","Finding prospective customers"],["B","Evaluating a customer’s character and sincerity"],["C","Making a site visit and evaluating a customer’s credit history"],["D","Evaluating a prospective customer’s financial condition"],["E","Assessing possible collateral and signing the loan agreement"]]}]},{"ch":17,"title":"Lending to Business Firms and Pricing Business Loans","items":[{"id":"17-TF-1","t":"TF","q":"Foreclosure on property pledged behind a bank loan does not subject a bank to liability to clean up any environmental damage the borrower may have caused to happen.","a":"False"},{"id":"17-TF-2","t":"TF","q":"In the United States about 25 percent of banks' total loans consist of commercial and industrial loans.","a":"True"},{"id":"17-TF-3","t":"TF","q":"Self-liquidating business loans are designed to take advantage of the normal cash cycle in a business firm.","a":"True"},{"id":"17-TF-4","t":"TF","q":"Short-term (under one year) loans to business firms account for over half of all bank loans to businesses in the United States.","a":"True"},{"id":"17-TF-5","t":"TF","q":"Working-capital loans are normally secured by a business firm's plant and equipment.","a":"False"},{"id":"17-TF-6","t":"TF","q":"Working-capital loans, unlike most other types of business loans, usually do not require the customer to keep a compensating deposit balance with the lending bank.","a":"True"},{"id":"17-TF-7","t":"TF","q":"Leveraged buyouts (LBOs) involve the purchase of businesses or of selected assets from business firms with at least 75 percent of the cost of the purchase funded by current earnings and sales of stock.","a":"False"},{"id":"17-TF-8","t":"TF","q":"A project loan secured by the credit of the company or companies sponsoring the project is called a project loan granted on a recourse basis.","a":"True"},{"id":"17-TF-9","t":"TF","q":"Term loans normally are secured by accounts receivable and inventory.","a":"False"},{"id":"17-TF-10","t":"TF","q":"Term loans look primarily to the flow of future earnings of the borrowing business firm to amortize and retire its loan.","a":"True"},{"id":"17-TF-11","t":"TF","q":"Under recent EPA guidelines if a lender forecloses on environmentally damaged property, the lender must post that property for sale within 12 months after securing marketable title.","a":"True"},{"id":"17-TF-12","t":"TF","q":"To avoid environmental liability under recent EPA guidelines a lender must accept any bona fide offer for property foreclosed upon if the offer would fully repay the remaining amounts owed.","a":"True"},{"id":"17-TF-13","t":"TF","q":"Floorplanning agreements typically include a loan-loss reserve, built up from interest earned as borrowers repay their installment loans.","a":"True"},{"id":"17-TF-14","t":"TF","q":"If a bank's agent visits a dealer using floorplanning and finds any inventory items sold for which the bank providing financing has not received payment, the loan will be immediately foreclosed upon.","a":"False"},{"id":"17-TF-15","t":"TF","q":"When a bank examines a borrower's operating efficiency they are looking at the protection afforded creditors from the borrower's earnings.","a":"False"},{"id":"17-TF-16","t":"TF","q":"The firm's coverage ratios measure how carefully the firm's management monitor and control its expenses.","a":"False"},{"id":"17-TF-17","t":"TF","q":"Liquidity measure a business firm's ability to raise cash in a timely fashion at a reasonable cost.","a":"True"},{"id":"17-TF-18","t":"TF","q":"The ultimate standard of performance in a market-oriented economy is how much net income remains after all expenses have been charged against revenues.","a":"True"},{"id":"17-TF-19","t":"TF","q":"The business loan pricing method that relies upon banks knowing what their costs are is the price leadership model.","a":"False"},{"id":"17-TF-20","t":"TF","q":"The price leadership method of loan pricing includes a markup for default risk, but not for term risk.","a":"False"},{"id":"17-TF-21","t":"TF","q":"The sum of the default-risk premium plus the term risk premium on a business loan is one of the elements of the cost-plus loan pricing method.","a":"False"},{"id":"17-TF-22","t":"TF","q":"In order to control the risk exposure on their business loans most banks use both price and credit rationing to regulate the size and composition of their loan portfolios.","a":"True"},{"id":"17-TF-23","t":"TF","q":"In a period of rising interest rates the times-prime method causes the customer's loan rate to rise faster than the prime-plus method.","a":"True"},{"id":"17-TF-24","t":"TF","q":"If interest rates fall, a customer's loan rate will decline more rapidly under the times-prime method than under the prime-plus method of business loan pricing.","a":"True"},{"id":"17-TF-25","t":"TF","q":"Banks attempting to compete with the growing commercial paper market developed the cost-plus business loan pricing method.","a":"False"},{"id":"17-TF-26","t":"TF","q":"The loan-pricing method that takes the whole customer relationship into account when pricing each loan request is known as the cost-benefit loan pricing method.","a":"False"},{"id":"17-TF-27","t":"TF","q":"The loan-pricing technique known as CPA can be used to identify the most profitable types of bank customers and loans and also who are the most successful loan officers.","a":"True"},{"id":"17-TF-28","t":"TF","q":"The basic strength of the cost plus loan pricing method is that it considers the competition from other lenders.","a":"False"},{"id":"17-TF-29","t":"TF","q":"The basic weakness of the cost plus loan pricing method is that it does not consider the competition from other lenders when setting the loan price.","a":"True"},{"id":"17-TF-30","t":"TF","q":"The basic strength of the below prime market pricing model is that it allows the bank to compete with the commercial paper market.","a":"True"},{"id":"17-TF-31","t":"TF","q":"The basic weakness of the below prime market pricing model is that there are narrow margins or markups on loans.","a":"True"},{"id":"17-TF-32","t":"TF","q":"The majority of syndicated loans are held by banks.","a":"False"},{"id":"17-TF-33","t":"TF","q":"Syndicated loans are a type of working capital loan.","a":"False"},{"id":"17-TF-34","t":"TF","q":"According to the textbook, small business lending by banks is on the decline.","a":"True"},{"id":"17-TF-35","t":"TF","q":"The amount of business lending tends to rise during periods of expansion.","a":"True"},{"id":"17-TF-36","t":"TF","q":"The amount of business lending tends to fall during recessionary periods.","a":"True"},{"id":"17-TF-37","t":"TF","q":"Financial institutions generally use internal credit rating systems to evaluate credit quality.","a":"True"},{"id":"17-MC-1","t":"MC","q":"Short-term lending to support the construction of homes, apartments, office buildings, shopping centers, and other permanent structures is known as a (or an):","a":"C","o":[["A","Self-liquidating"],["B","Working capital loan"],["C","Interim construction loan"],["D","Asset-based loan"],["E","None of the above"]]},{"id":"17-MC-2","t":"MC","q":"Business loans designed to fund long- and medium-term business investments, such as the purchase of equipment or the construction of physical facilities, covering a period longer than one year are known as:","a":"B","o":[["A","Working capital loans"],["B","Term loans"],["C","Interim construction financing"],["D","Durable goods loan"],["E","None of the above"]]},{"id":"17-MC-3","t":"MC","q":"A loan whose principal is not due to be paid back until the loan's term ends and in which only interest is paid periodically during the life of the loan is called a (or an):","a":"C","o":[["A","Working capital loan"],["B","Project loan"],["C","Bullet loan"],["D","Interim construction loan"],["E","None of the above"]]},{"id":"17-MC-4","t":"MC","q":"A credit agreement in which a business customer may borrow up to a pre-specified limit, repay all or a portion of the borrowing, and reborrow as necessary until the credit line matures is known as a (an):","a":"D","o":[["A","Interim construction"],["B","Project loan"],["C","Working-capital loan"],["D","Revolving line of credit"],["E","None of the above"]]},{"id":"17-MC-5","t":"MC","q":"When analyzing a commercial loan credit request, which of the following statements is (are) correct?","a":"E","o":[["A","The lender should evaluate the potential income available to service the loan."],["B","The lender should evaluate the potential cash flow available to service the loan."],["C","The lender should be certain that the loan is adequate to meet the needs of the borrower."],["D","A and B"],["E","B and C"]]},{"id":"17-MC-6","t":"MC","q":"Banks oftentimes bid on the opportunity to finance the entire inventory of an automobile dealer through a ___________ arrangement.","a":"B","o":[["A","Factoring"],["B","Floorplanning"],["C","Project loan"],["D","Revolving line of credit"],["E","None of the above"]]},{"id":"17-MC-7","t":"MC","q":"The most common sources that lenders look to for repayment of business loans include all of the following except:","a":"C","o":[["A","The borrower's cash flow"],["B","Assets pledged as collateral"],["C","Relatives of the borrowe."],["D","The borrowers net worth"],["E","None of the above"]]},{"id":"17-MC-8","t":"MC","q":"When analyzing the financial statements of a business, a credit analyst will look for ratios in which of the following categories:","a":"E","o":[["A","Profitability."],["B","Coverage"],["C","Efficiency"],["D","Liquidity"],["E","All of the above are categories of ratios bankers will look for"]]},{"id":"17-MC-9","t":"MC","q":"Term loans normally are secured by:","a":"A","o":[["A","Fixed assets"],["B","Accounts receivable"],["C","Inventories"],["D","Personal property"],["E","None of the above."]]},{"id":"17-MC-10","t":"MC","q":"A bank that wants to examine the operating efficiency of a borrower would most likely examine which of the following ratios?","a":"A","o":[["A","Cost of Goods Sold/ Average Inventory"],["B","Income Before Interest and Taxes/ Interest Payments"],["C","Cost of Goods Sold/ Net Sales"],["D","Current Assets/ Current Liabilities"],["E","All of the Above"]]},{"id":"17-MC-11","t":"MC","q":"A bank that wants to examine the liquidity of a borrower would most likely examine which of the following ratios?","a":"D","o":[["A","Costs of Goods Sold/ Average inventory"],["B","Income Before Interest and Taxes/ Interest Payments"],["C","Cost of Goods Sold/ Net Sales"],["D","Current Assets/ Current Liabilities"],["E","All of the Above"]]},{"id":"17-MC-12","t":"MC","q":"A bank wants to examine whether the borrower can raise cash in a timely fashion to pay bills that are coming due. This bank would most likely examine which of the following categories of ratios?","a":"B","o":[["A","Customer's Control over Expenses"],["B","Customer's Liquidity"],["C","Customer's Operating Efficiency"],["D","Customer's Profitability"],["E","None of the Above"]]},{"id":"17-MC-13","t":"MC","q":"A government security dealer requires credit to add new government securities to his security portfolio. What type of loan is this?","a":"C","o":[["A","Self-liquidating inventory loan"],["B","Working capital loan"],["C","Security dealer financing"],["D","Revolving line of credit"],["E","None of the above"]]},{"id":"17-MC-14","t":"MC","q":"Credit is extended to a company up to one year to purchase raw materials and cover a seasonal peak need for cash. What type of loan is this?","a":"B","o":[["A","Self-liquidating inventory loan"],["B","Working capital loan"],["C","Security dealer financing"],["D","Revolving line of credit"],["E","None of the above"]]},{"id":"17-MC-15","t":"MC","q":"The term of an inventory loan is being set to match the exact length of time needed to generate sufficient cash to repay the loan. What type of loan is this?","a":"A","o":[["A","Self-liquidating inventory loan"],["B","Working capital loan"],["C","Security dealer financing"],["D","Revolving line of credit"],["E","None of the above"]]},{"id":"17-MC-16","t":"MC","q":"A business receives a three year line of credit against which it can borrow, repay and borrow again if necessary during the loan's three year term. What type of loan is this?","a":"D","o":[["A","Self-liquidating inventory loan"],["B","Working capital loan"],["C","Security dealer financing"],["D","Revolving line of credit"],["E","None of the above"]]},{"id":"17-MC-17","t":"MC","q":"A loan or line of credit extended to a business by a group of lending institutions in order to reduce the risk exposure is known as:","a":"D","o":[["A","An LBO"],["B","A revolving line of credit"],["C","A working capital loan"],["D","A syndicated loan"],["E","None of the above"]]},{"id":"17-MC-18","t":"MC","q":"A bank that is examining the ratio of total liabilities to total assets is examining which category of ratios?","a":"E","o":[["A","Expense Control Measures"],["B","Operating Efficiency Measures"],["C","Coverage Measures"],["D","Liquidity Measures"],["E","Leverage Measures"]]},{"id":"17-MC-19","t":"MC","q":"A bank that is examining the ratio of costs of goods sold to inventory is examining which category of ratios?","a":"B","o":[["A","Expense Control Measures"],["B","Operating Efficiency Measures"],["C","Coverage Measures"],["D","Liquidity Measures"],["E","Leverage Measures"]]},{"id":"17-MC-20","t":"MC","q":"A bank that is examining the ratio of overhead expenses to net sales is examining which category of ratios?","a":"A","o":[["A","Expense Control Measures"],["B","Operating Efficiency Measures"],["C","Coverage Measures"],["D","Liquidity Measures"],["E","Leverage Measures"]]},{"id":"17-MC-21","t":"MC","q":"Which dimension of a business firm's financial and operating performance would unfunded pension liabilities fit best?","a":"C","o":[["A","Profitability measure"],["B","Market indicator"],["C","Contingent liability"],["D","Marketability of the product or service"],["E","None of the above"]]},{"id":"17-MC-22","t":"MC","q":"Which dimension of a business firm's financial and operating performance would the percentage change in the firm's stock price fit best?","a":"B","o":[["A","Profitability measure"],["B","Market indicator"],["C","Contingent liability"],["D","Marketability of the product or service"],["E","None of the above"]]},{"id":"17-MC-23","t":"MC","q":"Which dimension of a business firm's financial and operating performance would the gross profit margin fit best?","a":"D","o":[["A","Liquidity measure"],["B","Market indicator"],["C","Contingent liability"],["D","Marketability of the product or service"],["E","None of the above"]]},{"id":"17-MC-24","t":"MC","q":"According to the cost-plus model for pricing loans, factors that should be considered in pricing a loan include:","a":"E","o":[["A","The marginal cost of raising loanable funds to support the loan request"],["B","Nonfunds operating costs"],["C","An appropriate margin to compensate the bank for default risk."],["D","The bank's desired profit margin"],["E","All of the above"]]},{"id":"17-MC-25","t":"MC","q":"The business loan pricing method that includes the nonfunds operating costs of making a loan plus the bank's desired profit margin is:","a":"A","o":[["A","The Cost-Plus Loan-Pricing Method"],["B","The Price Leadership Model"],["C","The Markup Model"],["D","Customer Profitability Analysis"],["E","None of the above"]]},{"id":"17-MC-26","t":"MC","q":"The business loan pricing method that estimates the total revenues a loan will generate, the net amount of loanable funds the bank must turn over to the borrower, and the before-tax yield expected from the loan is the:","a":"D","o":[["A","The Cost-Plus Loan-Pricing Method"],["B","The Price Leadership Model"],["C","The Below Prime Rate Pricing Model"],["D","Customer Profitability Analysis"],["E","None of the above"]]},{"id":"17-MC-27","t":"MC","q":"Suppose a business borrower is quoted a loan rate of two percentage points above the prevailing prime interest rate posted by leading U.S. banks. This is an example of the:","a":"D","o":[["A","Times-prime pricing method."],["B","Market-based pricing method."],["C","Cost-plus loan-pricing method."],["D","Prime-plus pricing method."],["E","Customer profitability analysis pricing method."]]},{"id":"17-MC-28","t":"MC","q":"The method of pricing a business loan that contends that a bank should take the whole customer relationship into account when pricing each loan request is the:","a":"D","o":[["A","Cost-Plus Loan-Pricing Method"],["B","Price Leadership Model"],["C","Below Prime Rate Pricing Model"],["D","Customer Profitability Analysis"],["E","None of the above."]]},{"id":"17-MC-29","t":"MC","q":"The business loan pricing method that bases a loan rate on a relatively low money market interest rate (such as the federal funds rate) plus a small margin to cover risk exposure, other operating costs, and a profit margin is known as the:","a":"B","o":[["A","Price Leadership Model"],["B","Below Prime Rate Pricing Model"],["C","Cost-Plus Loan Pricing Method"],["D","Customer Profitability Analysis"],["E","None of the above."]]},{"id":"17-MC-30","t":"MC","q":"Which of the following is a strength of the cost-plus loan pricing method?","a":"C","o":[["A","It considers the competition from other lenders"],["B","It allows the bank to compete more aggressively with the commercial paper market"],["C","It considers the cost of loanable funds and the operating costs of running the bank"],["D","It takes the whole customer relationship into account"],["E","None of the above"]]},{"id":"17-MC-31","t":"MC","q":"Which of the following is a weakness of the price leadership loan pricing method?","a":"A","o":[["A","It does not consider the marginal cost of raising funds"],["B","It does not give much regard for the competition from other lenders"],["C","The bank must know what their costs are in order to make correctly price loans"],["D","The bank must consider the revenues and expenses from all of the bank's dealings with the customer"],["E","None of the above"]]},{"id":"17-MC-32","t":"MC","q":"Which of the following is a strength of the markup (or below prime market) loan pricing method?","a":"B","o":[["A","It considers the competition from other lenders"],["B","It allows the bank to compete more aggressively with the commercial paper market"],["C","It considers the cost of loanable funds and the operating costs of running the bank"],["D","It takes the whole customer relationship into account"],["E","None of the above"]]},{"id":"17-MC-33","t":"MC","q":"Which of the following is a weakness of the cost-plus loan pricing method?","a":"D","o":[["A","It does not consider the marginal cost of raising funds"],["B","It does not give much regard for the competition from other lenders"],["C","The bank must know what their costs are in order to make correctly price loans"],["D","B and C above"],["E","All of the above"]]},{"id":"17-MC-34","t":"MC","q":"Which of the following is a strength of the price leadership loan pricing method?","a":"A","o":[["A","It considers the competition from other lenders"],["B","It allows the bank to compete more aggressively with the commercial paper market"],["C","It considers the cost of loanable funds and the operating costs of running the bank"],["D","It takes the whole customer relationship into account"],["E","None of the above"]]},{"id":"17-MC-35","t":"MC","q":"Which of the following is a strength of the customer profitability analysis method for pricing loans?","a":"D","o":[["A","It considers the competition from other lenders"],["B","It allows the bank to compete more aggressively with the commercial paper market"],["C","It considers the cost of loanable funds and the operating costs of running the bank"],["D","It takes the whole customer relationship into account"],["E","None of the above"]]},{"id":"17-MC-36","t":"MC","q":"The business loan pricing method which starts with a base rate such as the bank's prime rate and adds a markup for default and term risk is known as:","a":"B","o":[["A","The Cost-Plus Loan-Pricing Method"],["B","The Price Leadership Model"],["C","The Below Prime Rate Pricing Model"],["D","Customer Profitability Analysis"],["E","None of the above"]]},{"id":"17-MC-37","t":"MC","q":"SNCs are also known as:","a":"C","o":[["A","Working capital loans"],["B","Asset-backed loans"],["C","Syndicated loans"],["D","Construction loans"],["E","Inventory loans"]]},{"id":"17-MC-38","t":"MC","q":"Small business lending by banks is","a":"A","o":[["A","Declining"],["B","Rising"],["C","Relatively constant"],["D","One with no pattern"],["E","One with an unknown pattern"]]},{"id":"17-MC-39","t":"MC","q":"The most common type of loan foreign banks make in the U.S. are:","a":"A","o":[["A","Commercial loans"],["B","Retail loans"],["C","Real estate loans"],["D","Credit card loans"],["E","None of the above"]]},{"id":"17-MC-40","t":"MC","q":"Which of the following is an example of a captive finance company?","a":"B","o":[["A","Bank of America"],["B","GMAC"],["C","Toyota Motors"],["D","Koch Industries"],["E","All of the above"]]},{"id":"17-MC-41","t":"MC","q":"Lloyd Blenman is building a shopping center in Charlotte and needs to get a loan until the shopping center is finished and he can get a mortgage on the property. What type of loan does he need?","a":"C","o":[["A","Self-liquidating inventory loan"],["B","Working capital loan"],["C","Interim construction financing"],["D","Security dealer financing"],["E","Retailer and equipment financing"]]},{"id":"17-MC-42","t":"MC","q":"Dick Dowen needs a loan to buy plants and fertilizer for his nursery for the spring planting season. This loan will automatically be paid off as the plants and fertilizer are sold to his customers. What type of loan does Dick need?","a":"A","o":[["A","Self-liquidating inventory loan"],["B","Working capital loan"],["C","Interim construction financing"],["D","Security dealer financing"],["E","Retailer and equipment financing"]]},{"id":"17-MC-43","t":"MC","q":"Randal Ice needs a loan to purchase pet food and other pet supplies for his local pet store over the next six months. He has estimated that the maximum amount of inventory he will need in the next six months is $200,000 and he knows that he will have to use accounts receivables and the inventory he purchases as collateral for the loan. At the end of six months, he hopes he can get the loan renewed. What type of loan does Randal need?","a":"B","o":[["A","Self-liquidating inventory loan"],["B","Working capital loan"],["C","Interim construction financing"],["D","Security dealer financing"],["E","Retailer and equipment financing"]]},{"id":"17-MC-44","t":"MC","q":"Barbara Miller is a small dealer who specializes in healthcare stocks. She needs a loan so that she can sustain her portfolio of stocks until customer buy orders catch up with what she has already purchased from the market. She only expects to need this loan for a week. What type of loan does Barbara need?","a":"D","o":[["A","Self-liquidating inventory loan"],["B","Working capital loan"],["C","Interim construction financing"],["D","Security dealer financing"],["E","Retailer and equipment financing"]]},{"id":"17-MC-45","t":"MC","q":"Sight n’ Sound is a retail store that sells refrigerators, washers, dryers and other consumer appliances. They need a loan so they can place an order with Whirlpool. The appliances will be the collateral for the loan and as an appliance is sold, the money will be passed on to the lender. An employee of the lender will periodically check to make sure what has sold and what remains in the store. What type of loan does Sight n’ Sound need?","a":"E","o":[["A","Self-liquidating inventory loan"],["B","Working capital loan"],["C","Interim construction financing"],["D","Security dealer financing"],["E","Retailer and equipment financing"]]},{"id":"17-MC-46","t":"MC","q":"Mary Williams needs to purchase a new bulldozer and excavator for her construction business and wants to repay the loan over the next three years in regularly scheduled payments. What type of loan does Mary need?","a":"A","o":[["A","Term business loan"],["B","Revolving credit financing"],["C","Long term project loan"],["D","LBO loan"],["E","Syndicated loan"]]},{"id":"17-MC-47","t":"MC","q":"The Ford Motor Company needs to borrow $50 million. The First National Bank creates a packaged loan with several other banks to lend to Ford Motor Company. This loan package can be sold on the secondary market and carries a rate that is 500 basis points above LIBOR. The First National Bank expects this loan package to ultimately be held by a finance company looking for a good return on their money? What type of loan is this mostly likely to be?","a":"E","o":[["A","Term business loan"],["B","Revolving credit financing"],["C","Long term project loan"],["D","LBO loan"],["E","Syndicated loan"]]},{"id":"17-MC-48","t":"MC","q":"The Wabash Washing Machine Company has arranged to get a loan from their bank over the next five years. They can borrow up to a pre-specified limit and repay it as many times as they need until the loan matures. The Wabash Washing Machine Company has not pledged any specific collateral for this loan. What type of loan is this mostly likely to be?","a":"B","o":[["A","Term business loan"],["B","Revolving credit financing"],["C","Long term project loan"],["D","LBO loan"],["E","Syndicated loan"]]},{"id":"17-MC-49","t":"MC","q":"The Jung Company and the Nguyen Company have combined to build a new container ship docking facility in Charleston Harbor. The facility is expected to take two years to complete and cost $3 billion to construct. These companies want to borrow money in order to build this facility. What type of loan is this most likely to be?","a":"C","o":[["A","Term business loan"],["B","Revolving credit financing"],["C","Long term project loan"],["D","LBO loan"],["E","Syndicated loan"]]},{"id":"17-MC-50","t":"MC","q":"The management of the Frickel Frontier Freight Company wants to take the company private by borrowing money and using the proceeds of the loan to purchase the shares of the company in the market. Management believes they can increase revenues enough to be able to pay off the loan. What type of loan is management getting?","a":"D","o":[["A","Term business loan"],["B","Revolving credit financing"],["C","Long term project loan"],["D","LBO loan"],["E","Syndicated loan"]]},{"id":"17-MC-51","t":"MC","q":"A bank wants to examine how well customer controls their expenses. They are most likely to look at which of the following ratios?","a":"A","o":[["A","Wages and Salaries/Net Sales"],["B","Accounts Receivables/(Annual credit sales/360)"],["C","Net income after taxes/Net Sales"],["D","Income before interest and taxes/Interest payments"],["E","(Current assets – Inventory)/Current liabilities"]]},{"id":"17-MC-52","t":"MC","q":"A bank wants to examine how well a customer uses assets to generate sales. They are most likely to look at which of the following ratios?","a":"B","o":[["A","Wages and Salaries/Net Sales"],["B","Accounts Receivables/(Annual credit sales/360)"],["C","Net income after taxes/Net Sales"],["D","Income before interest and taxes/Interest payments"],["E","(Current assets – Inventory)/Current liabilities"]]},{"id":"17-MC-53","t":"MC","q":"A bank wants to examine how well a customer markets their goods and services. They are most likely to look at which of the following ratios?","a":"C","o":[["A","Wages and Salaries/Net Sales"],["B","Accounts Receivables/(Annual credit sales/360)"],["C","Net income after taxes/Net Sales"],["D","Income before interest and taxes/Interest payments"],["E","(Current assets – Inventory)/Current liabilities"]]},{"id":"17-MC-54","t":"MC","q":"A bank wants to examine the adequacy of a business customer’s earnings based on the coverage ratios. They are most likely to look at which of the following ratios?","a":"D","o":[["A","Wages and Salaries/Net Sales"],["B","Accounts Receivables/(Annual credit sales/360)"],["C","Net income after taxes/Net Sales"],["D","Income before interest and taxes/Interest payments"],["E","(Current assets – Inventory)/Current liabilities"]]},{"id":"17-MC-55","t":"MC","q":"A bank wants to know whether a customer can raise cash in a timely fashion at a reasonable cost. They are mostly likely to look at which of the following ratios?","a":"E","o":[["A","Wages and Salaries/Net Sales"],["B","Accounts Receivables/(Annual credit sales/360)"],["C","Net income after taxes/Net Sales"],["D","Income before interest and taxes/Interest payments"],["E","(Current assets – Inventory)/Current liabilities"]]},{"id":"17-MC-56","t":"MC","q":"A bank has a concern about the Wilson Company’s debt level. They feel that it is too high. What ratio are they most likely to examine to answer this question?","a":"E","o":[["A","Selling and administrative expenses/Net sales"],["B","Net sales/Total assets"],["C","Current assets-Current liabilities"],["D","Net income/Total assets"],["E","Long term debt/(Long term debt + Net worth)"]]},{"id":"17-MC-57","t":"MC","q":"A bank has a concern because they feel that a firm has an excessive amount of assets. They do not feel that the firm is efficient in generating sales from their current level of assets. What ratio are they most likely to examine to answer this question?","a":"B","o":[["A","Selling and administrative expenses/Net sales"],["B","Net sales/Total assets"],["C","Current assets-Current liabilities"],["D","Net income/Total assets"],["E","Long term debt/(Long term debt + Net worth)"]]},{"id":"17-MC-58","t":"MC","q":"A bank feels that a firm has expenses that are too high. What ratio are they most likely to examine to address this concern?","a":"A","o":[["A","Selling and administrative expenses/Net sales"],["B","Net sales/Total assets"],["C","Current assets-Current liabilities"],["D","Net income/Total assets"],["E","Long term debt/(Long term debt + Net worth)"]]},{"id":"17-MC-59","t":"MC","q":"A bank is concerned because they feel that a firm will not be able to raise enough cash to pay bills that are due within the next year. What ratio are they most likely to examine to address this concern?","a":"C","o":[["A","Selling and administrative expenses/Net sales"],["B","Net sales/Total assets"],["C","Current assets-Current liabilities"],["D","Net income/Total assets"],["E","Long term debt/(Long term debt + Net worth)"]]},{"id":"17-MC-60","t":"MC","q":"A bank wants to examine the financial success of a company by examining the profits of a company. What ratio will help the bank examine this issue?","a":"D","o":[["A","Selling and administrative expenses/Net sales"],["B","Net sales/Total assets"],["C","Current assets-Current liabilities"],["D","Net income/Total assets"],["E","Long term debt/(Long term debt + Net worth)"]]},{"id":"17-MC-61","t":"MC","q":"Banks need to be able to compare the firm they are examining to its industry. One company that provides information to banks about the industries their customers are in is:","a":"C","o":[["A","Standard and Poors"],["B","Moody’s"],["C","Dun and Bradstreet"],["D","Morgan Stanley"],["E","None of the above"]]},{"id":"17-MC-62","t":"MC","q":"A bank wants to estimate a firm’s future financial condition. Which of the following is something that allows a bank to do this?","a":"B","o":[["A","Statement of cash flows"],["B","Pro forma statement"],["C","Balance sheet"],["D","Income statement"],["E","None of the above"]]}]},{"ch":18,"title":"Consumer Loans, Credit Cards, and Real Estate Lending","items":[{"id":"18-TF-1","t":"TF","q":"The dominant lender in the United States to households is the finance company with commercial banks ranked second as consumer lenders.","a":"False"},{"id":"18-TF-2","t":"TF","q":"Nonresidential consumer loans include credit to finance the purchase of home appliances.","a":"True"},{"id":"18-TF-3","t":"TF","q":"Credit cards offer convenience to customers plus a revolving line of credit.","a":"True"},{"id":"18-TF-4","t":"TF","q":"Consumer loans appear to have virtually no sensitivity to the business cycle, staying relatively level through both recessions and expansions.","a":"False"},{"id":"18-TF-5","t":"TF","q":"Households tend to be interest-inelastic borrowers.","a":"True"},{"id":"18-TF-6","t":"TF","q":"Lenders in the consumer loan field prefer to measure a borrowing customer's income by the amount of take-home pay.","a":"True"},{"id":"18-TF-7","t":"TF","q":"The \"right of offset\" allows a bank to sell a customer's property to the highest bidder to repay a customer's loan if the loan is in default.","a":"False"},{"id":"18-TF-8","t":"TF","q":"\"Pyramiding of debt\" refers to borrowing from one lender to repay another lender.","a":"True"},{"id":"18-TF-9","t":"TF","q":"Credit-scoring systems tend to be valid over long periods of time (usually several years) and need not be periodically retested.","a":"False"},{"id":"18-TF-10","t":"TF","q":"Banks awarded top CRA marks usually get strong commitments from their boards of directors and senior management to promote community involvement.","a":"True"},{"id":"18-TF-11","t":"TF","q":"FNMA will buy home mortgages provided the borrower's monthly house payment does not exceed 35 percent of monthly gross income.","a":"False"},{"id":"18-TF-12","t":"TF","q":"Under FNMA rules for buying home mortgages FNMA will not usually purchase a borrower's mortgage if the borrower's credit report is more than 45 days old.","a":"False"},{"id":"18-TF-13","t":"TF","q":"An installment loan is a loan in which the customer repays the loan in two or more consecutive payments. These payments are often monthly or quarterly.","a":"True"},{"id":"18-TF-14","t":"TF","q":"The burden of proof is on the bank to demonstrate that its credit scoring system successfully identifies quality loan applications at a statistically significant level.","a":"True"},{"id":"18-TF-15","t":"TF","q":"Real estate loans are smaller in size and shorter in maturity than most other types of bank loans.","a":"False"},{"id":"18-TF-16","t":"TF","q":"There is usually a positive relationship between the interest rate a consumer is asked to pay and the amount of deposits the consumer is willing to keep with the bank.","a":"False"},{"id":"18-TF-17","t":"TF","q":"Competition for consumer loans tends to drive the interest rates on these loans down closer to loan production costs.","a":"True"},{"id":"18-TF-18","t":"TF","q":"Shorter term cash loans to consumers are normally secured, but longer-term consumer loans are usually unsecured.","a":"False"},{"id":"18-TF-19","t":"TF","q":"An auto loan usually carries with it a chattel mortgage, giving the bank a claim against the property covered by the loan.","a":"True"},{"id":"18-TF-20","t":"TF","q":"Most consumer loans are priced off some base or cost rate.","a":"True"},{"id":"18-TF-21","t":"TF","q":"The APR is the internal rate of return on a loan that equates total payments with the amount of the loan.","a":"True"},{"id":"18-TF-22","t":"TF","q":"The quotation to customers of the APR on the loan they are requesting usually discourages consumers from shopping around according to recent research findings.","a":"False"},{"id":"18-TF-23","t":"TF","q":"Unlike the APR method for calculating consumer loan rates, the simple interest approach adjusts for the length of time a borrower actually has use of credit.","a":"False"},{"id":"18-TF-24","t":"TF","q":"Under the simple interest method the customer saves on interest as an installment loan approaches maturity.","a":"True"},{"id":"18-TF-25","t":"TF","q":"With the discount rate method interest is deducted first before the customer has use of the proceeds of a loan.","a":"True"},{"id":"18-TF-26","t":"TF","q":"The majority of installment and lump-sum payment loans to families and individuals are made with floating interest rates.","a":"False"},{"id":"18-TF-27","t":"TF","q":"Points on a home mortgage loan result in a lender earning a higher effective interest rate on the loan than just the loan rate quoted to the borrower.","a":"True"},{"id":"18-TF-28","t":"TF","q":"According to the table presented in the book personal loans tend to have lower rates than automobile loans.","a":"False"},{"id":"18-TF-29","t":"TF","q":"According to the table presented in the book credit card loans tend to have the highest interest rates of all consumer loans.","a":"True"},{"id":"18-TF-30","t":"TF","q":"According to the table presented in the book new car loans have a lower interest rate than used car loans.","a":"True"},{"id":"18-TF-31","t":"TF","q":"There are very little economies of scale (cost savings) in the credit card business.","a":"False"},{"id":"18-TF-32","t":"TF","q":"Currently the debit card market is almost as large as the credit card market.","a":"False"},{"id":"18-TF-33","t":"TF","q":"One of the elements used in the FICO credit scoring system is the borrower's employment history and salary.","a":"False"},{"id":"18-TF-34","t":"TF","q":"The most important factor used in the FICO credit score is the borrower's payment history.","a":"True"},{"id":"18-TF-35","t":"TF","q":"Home mortgage real estate loans soared to record levels at the beginning of the 21st century.","a":"True"},{"id":"18-MC-1","t":"MC","q":"Short-term to medium-term loans repayable in two or more consecutive payments are known as:","a":"B","o":[["A","Noninstallment loans"],["B","Installment loans"],["C","Residential mortgage loans"],["D","Nonresidential cash loans"],["E","None of the above"]]},{"id":"18-MC-2","t":"MC","q":"Loans to individuals and families to finance the purchase of new homes are known as:","a":"C","o":[["A","Noninstallment loans"],["B","Installment loans"],["C","Residential mortgage loans"],["D","Nonresidential cash loans"],["E","None of the above"]]},{"id":"18-MC-3","t":"MC","q":"Short-term loans drawn upon by individuals and families for immediate cash needs and repayable in a lump sum when the borrower's note matures are known as:","a":"A","o":[["A","Noninstallment loans"],["B","Installment loans"],["C","Residential mortgage loans"],["D","Nonresidential cash loans"],["E","None of the above"]]},{"id":"18-MC-4","t":"MC","q":"Which of the following factors have proven most important in credit scoring models?","a":"E","o":[["A","Credit Bureau ratings"],["B","Income bracket"],["C","Number of loans the customer has had"],["D","All of the above"],["E","A and B only"]]},{"id":"18-MC-5","t":"MC","q":"In order to be eligible for purchase by FNMA a home mortgage cannot have a maturity of less than 10 years nor more than:","a":"B","o":[["A","25 years"],["B","30 years"],["C","35 years"],["D","40 years"],["E","None of the above"]]},{"id":"18-MC-6","t":"MC","q":"FNMA will not purchase home mortgages in the secondary market if the borrower's monthly debt repayments (including housing costs) exceed _________ percent of the borrower's monthly gross income. The correct percentage figure to complete the sentence above is:","a":"C","o":[["A","28"],["B","30"],["C","36"],["D","40"],["E","None of the above"]]},{"id":"18-MC-7","t":"MC","q":"The bank's real estate loan officer should consider which of the following aspects of the customer's loan application carefully when making a home mortgage?","a":"E","o":[["A","The amount and stability of the borrower's income"],["B","The borrower's available savings and where the down payment is coming from"],["C","The borrower's track record in caring for and managing property."],["D","The outlook for real estate sales in the local market area"],["E","All of the above are things that need to be looked at carefully"]]},{"id":"18-MC-8","t":"MC","q":"An abusive practice is which lenders grant loans to weak borrowers and charge them high fees and interest rates which may cause the borrower to default on the loan is known as:","a":"C","o":[["A","Installment loans"],["B","Credit card loans"],["C","Predatory lending"],["D","Herbivore lending"],["E","None of the above"]]},{"id":"18-MC-9","t":"MC","q":"Which of the following is true regarding credit card loans?","a":"A","o":[["A","There is evidence that considerable economies of scale exist"],["B","Credit cards cannot act as installment loans"],["C","Credit cards are very inconvenient for consumers"],["D","Credit cards are very inflexible for consumers"],["E","All of the above are true"]]},{"id":"18-MC-10","t":"MC","q":"Which of the following is not part of the evaluation of an installment loan?","a":"A","o":[["A","The borrower's track record in caring for and maintaining property"],["B","Evidence of stable employment"],["C","Evidence of residence stability"],["D","Evidence of income stability"],["E","All of the above are part of the evaluation of an installment loan"]]},{"id":"18-MC-11","t":"MC","q":"Which of the following is an advantage of a credit scoring model?","a":"D","o":[["A","Credit scoring models rely on the evaluation of an experienced credit officer"],["B","Credit scoring models are immune from charges of discrimination"],["C","Credit scoring models never make mistakes"],["D","Credit scoring models can handle a large volume of applications in a short period of time"],["E","All of the above are advantages of credit scoring models"]]},{"id":"18-MC-12","t":"MC","q":"When interest owed on a loan is added to the principal amount of the loan to determine a borrowing customer's required installment payments, this is known as the _________method for figuring a customer's loan rate. Fill in the blank with an appropriate response below.","a":"D","o":[["A","Simple interest"],["B","APR"],["C","Discount"],["D","Add-on"],["E","None of the above"]]},{"id":"18-MC-13","t":"MC","q":"The symbols ARM in lending means:","a":"C","o":[["A","Automatic rate modulation"],["B","Amortization rate method"],["C","Adjustable rate mortgage"],["D","Adaptable readjusted mortgage"],["E","None of the above."]]},{"id":"18-MC-14","t":"MC","q":"The charge on a home mortgage loan that a borrower may be asked to pay up front is referred to as:","a":"B","o":[["A","Loan Interest Owed"],["B","Points"],["C","Loading"],["D","Tax equity"],["E","None of the above."]]},{"id":"18-MC-15","t":"MC","q":"Which of the following has the highest interest rate according to the book?","a":"D","o":[["A","New automobile loan"],["B","Used automobile loan"],["C","Personal loan"],["D","Credit card loan"],["E","All of these have the same interest rate"]]},{"id":"18-MC-16","t":"MC","q":"Which of the following has the lowest interest rate according to the book?","a":"A","o":[["A","New automobile loan"],["B","Used automobile loan"],["C","Personal loan"],["D","Credit card loan"],["E","All of these have the same interest rate"]]},{"id":"18-MC-17","t":"MC","q":"The largest credit card lender (as a group) in the U.S. are:","a":"C","o":[["A","Thrifts"],["B","Insurance companies"],["C","Finance companies"],["D","Oil companies"]]},{"id":"18-MC-18","t":"MC","q":"Prepaid cards which compete with credit cards and debit cards are:","a":"A","o":[["A","Smart cards"],["B","Deposit cards"],["C","Match cards"],["D","All of the above"],["E","None of the above"]]},{"id":"18-MC-19","t":"MC","q":"The first major bank within the U.S. to establish a separate department for granting household loans was:","a":"A","o":[["A","First National City Bank of New York"],["B","BankAmerica"],["C","Bank One"],["D","State Street Bank"],["E","Bank of New York"]]},{"id":"18-MC-20","t":"MC","q":"The fastest growing consumer loan category is:","a":"C","o":[["A","Credit card loans"],["B","Auto loans"],["C","Home mortgages"],["D","Personal loans"],["E","Education loans"]]},{"id":"18-MC-21","t":"MC","q":"The very popular FICO credit scoring system provides credit scores in the range:","a":"D","o":[["A","0 to 10"],["B","0 to 1000"],["C","100 to 1000"],["D","300 to 850"],["E","20 to 80"]]},{"id":"18-MC-22","t":"MC","q":"The most important factor used in the FICO credit scoring system is:","a":"A","o":[["A","The borrower's payment history"],["B","The amount of money owed"],["C","Marital status"],["D","Employment history and salary"],["E","Age"]]},{"id":"18-MC-23","t":"MC","q":"Jeremiah Uselton needs a loan to purchase a condo in Sarasota, Florida. What type of loan does Jeremiah need?","a":"A","o":[["A","Residential mortgage loan"],["B","Installment loan"],["C","Noninstallment loan"],["D","Revolving line of credit"],["E","None of the above"]]},{"id":"18-MC-24","t":"MC","q":"Tammy Payne wants to buy a used car and wants a loan that she will pay off over the next three years with monthly payments. What type of loan does Tammy want?","a":"B","o":[["A","Residential mortgage loan"],["B","Installment loan"],["C","Noninstallment loan"],["D","Revolving line of credit"],["E","None of the above"]]},{"id":"18-MC-25","t":"MC","q":"Emily Barnes has gone to the First State Bank and gotten a loan of $5000 so she can go on vacation. She plans on paying the loan back in one payment in three months. What type of loan has Emily gotten?","a":"C","o":[["A","Residential mortgage loan"],["B","Installment loan"],["C","Noninstallment loan"],["D","Revolving line of credit"],["E","None of the above"]]},{"id":"18-MC-26","t":"MC","q":"Bill Wells uses his Discover card to buy new furniture for his apartment. The interest rate on this card is 18% and the minimum payment that is due is $100. What type of loan has Bill gotten?","a":"D","o":[["A","Residential mortgage loan"],["B","Installment loan"],["C","Noninstallment loan"],["D","Revolving line of credit"],["E","None of the above"]]},{"id":"18-MC-27","t":"MC","q":"Jerry McGuire uses his Visa card to buy a new washer and dryer and a new refrigerator for his home. He plans on paying off the credit card over the next two years. How is Jerry using his credit card?","a":"A","o":[["A","As an installment loan"],["B","As a noninstallment loan"],["C","As a lump sum payer"],["D","As a debit card"],["E","None of the above"]]},{"id":"18-MC-28","t":"MC","q":"The most profitable credit card customers for a bank are those that:","a":"D","o":[["A","Use their credit card frequently"],["B","Pay off any charges incurred within a few days"],["C","Charge at least $10,000 per year"],["D","Use their credit card as a source of installment loans"],["E","None of the above"]]},{"id":"18-MC-29","t":"MC","q":"Alexis Downs uses her credit card to buy furniture but pays off the credit card at the end of the month before she incurs any interest costs. How is Alexis using her credit card?","a":"B","o":[["A","As an installment loan"],["B","As a noninstallment loan"],["C","As a lump sum payer"],["D","As a debit card"],["E","None of the above"]]},{"id":"18-MC-30","t":"MC","q":"Donna Carlon is using her plastic card to buy groceries. The money is taken from her checking account immediately to pay for her groceries. How is Donna using her card?","a":"D","o":[["A","As an installment loan"],["B","As a noninstallment loan"],["C","As a lump sum payer"],["D","As a debit card"],["E","None of the above"]]},{"id":"18-MC-31","t":"MC","q":"A bank is considering making a loan to Alice Granger. The bank is looking at her credit report from Equifax and also examining the reason Alice has put on the loan application for needing the loan? What aspect of evaluating a consumer loan application is the bank looking at?","a":"A","o":[["A","Character and purpose"],["B","Income level"],["C","Deposit balance"],["D","Employment and residential stability"],["E","Pyramiding of debt"]]},{"id":"18-MC-32","t":"MC","q":"A bank is considering making a loan to Ron Weasley. Ron has a gross salary per month of $4000 but has take-home pay of $2800 per month. What aspect of evaluating a consumer loan application is this fact most concerned with?","a":"B","o":[["A","Character and purpose"],["B","Income level"],["C","Deposit balance"],["D","Employment and residential stability"],["E","Pyramiding of debt"]]},{"id":"18-MC-33","t":"MC","q":"A bank is considering making a loan to Sean Finnigan. Sean owns his own home and has lived there for the past four years. What aspect of evaluating a consumer loan application is this fact most concerned with?","a":"D","o":[["A","Character and purpose"],["B","Income level"],["C","Deposit balance"],["D","Employment and residential stability"],["E","Pyramiding of debt"]]},{"id":"18-MC-34","t":"MC","q":"A bank is considering making a loan to Sam Snape. Mr. Snape has $1000 in the bank right now but generally keeps a balance of $4500 most of the year. What aspect of evaluating a consumer loan application is this fact concerned with?","a":"C","o":[["A","Character and purpose"],["B","Income level"],["C","Deposit balance"],["D","Employment and residential stability"],["E","Pyramiding of debt"]]},{"id":"18-MC-35","t":"MC","q":"A bank is considering making a loan to Neville Langdon. Neville has bounced three checks in the last year and already has $10,000 on a credit card and an automobile loan with a large balance. What aspect of evaluating a consumer loan application is this fact concerned with?","a":"E","o":[["A","Character and purpose"],["B","Income level"],["C","Deposit balance"],["D","Employment and residential stability"],["E","Pyramiding of debt"]]},{"id":"18-MC-36","t":"MC","q":"A bank is considering making a loan to John Carter. John is a commissioned sales broker. Some months he earns as much as $10,000 and in other months he earns virtually nothing. Which aspect of evaluating a consumer loan would this be concerned with?","a":"B","o":[["A","Character and purpose"],["B","Income level"],["C","Deposit balance"],["D","Employment and residential stability"],["E","Pyramiding of debt"]]},{"id":"18-MC-37","t":"MC","q":"Which of the following is a challenge of making a consumer loan?","a":"C","o":[["A","Audited financial statements are provided by consumers quarterly"],["B","Consumers must disclose publicly any changes in their health that would affect the loan"],["C","Consumers can more easily hide pertinent information"],["D","Consumers can more easily adjust to financial setbacks than can businesses"],["E","All of the above are challenges of making a consumer loan"]]},{"id":"18-MC-38","t":"MC","q":"Credit reports provided by credit bureaus provide lenders:","a":"E","o":[["A","With personal identifying data"],["B","With personal credit histories derived from data submitted by lenders"],["C","With public information that may bear on a borrower’s honesty and stability"],["D","With the volume of inquiries from lenders about the borrower"],["E","All of the above"]]}]}]};

 case'boss':{const b=BOSS.find(x=>x.id===d.b),pool=ALL.filter(q=>b.chs.includes(q.ch));const mc=smart(pool.filter(q=>q.t==='MC'),15),tf=smart(pool.filter(q=>q.t==='TF'),10);start(b.n,shuf(mc.concat(tf)),'boss');SS.bid=b.id;break}
 case'pick':{const s=SS,q=s.list[s.i];if(s.mode==='exam'){s.pick=d.v;render();break}if(s.done)break;s.pick=d.v;const r=record(q,d.v,false);s.done=true;s.ok=r.ok;s.gain=r.gain;s.res.push({q,pick:d.v,ok:r.ok});render();break}
 case'next':{const s=SS,q=s.list[s.i];if(s.mode==='exam'){if(!s.pick)break;s.res.push({q,pick:s.pick,ok:s.pick===q.a});record(q,s.pick,true)}else if(!s.done)break;if(s.i+1>=s.list.length)finish();else{s.i++;s.pick=null;s.done=false;render();scrollTo(0,0)}break}
 case'quit':if(SS&&SS.res.length&&SS.mode!=='exam'){finish()}else{SS=null;V={name:'home'};render()}break;
 case'redo':start('Luyện lại câu sai',Object.keys(S.wrong).sort((a,b)=>S.wrong[b]-S.wrong[a]).map(id=>BY[id]),'practice');break;
 case'rv':{let l=[];if(d.m==='hard'){l=smart(ALL.filter(q=>(S.wrong[q.id]||0)>=2||(S.q[q.id]&&S.q[q.id].n>=2&&S.q[q.id].c/S.q[q.id].n<.5)),20)}else if(d.m==='weak'){const rows=D.chapters.map(c=>({c,s:cs(c.ch)})).filter(x=>x.s.n).sort((a,b)=>a.s.acc-b.s.acc);if(rows.length)l=smart(rows[0].c.items.filter(q=>S.q[q.id]),20)}else l=smart(ALL.filter(q=>S.q[q.id]),20);start('Review',l,'practice');break}
 case'days':S.plan.days=+d.v;save();render();break;
 case'goal':S.plan.goal=d.v;save();render();break;
 case'pstart':S.plan.start=today();save();toast('Đã bắt đầu lộ trình từ hôm nay');render();break;
 case'exn':EX.n=+d.v;render();break;
 case'exch':{const c=+d.v;EX.chs.has(c)?EX.chs.delete(c):EX.chs.add(c);render();break}
 case'exstart':exStart();break;
 case'copy':{const t=$('#js');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}try{navigator.clipboard&&navigator.clipboard.writeText(t.value)}catch(e){}toast(ok?'Đã sao chép':'Đã chọn sẵn, hãy nhấn Ctrl/Cmd+C');break}
 case'imp':{try{const o=JSON.parse($('#js').value);if(typeof o!=='object'||!o||o.xp===undefined)throw 0;S=Object.assign(def(),o);save();toast('Đã nhập tiến độ');render()}catch(e){toast('JSON không hợp lệ')}break}
 case'reset1':CONF=1;render();break;case'reset0':CONF=0;render();break;
 case'reset2':S=def();CONF=0;save();toast('Đã đặt lại tiến độ');render();break;
 case'theme':{const r=document.documentElement;d.v==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',d.v);break}
}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT')return;act(b.dataset.a,b.dataset)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.a==='daysin'){S.plan.days=Math.max(3,Math.min(90,+t.value||14));save();render()}});
document.addEventListener('keydown',e=>{if(V.name!=='quiz'||/INPUT|TEXTAREA/.test(e.target.tagName))return;const q=SS.list[SS.i],k=e.key.toUpperCase();if(e.key==='Enter'||e.key===' '){const b=$('[data-a=next]');if(b&&!b.disabled){e.preventDefault();b.click()}return}
 const m=q.t==='TF'?{T:'True',F:'False',D:'True',S:'False'}[k]:(q.o.find(o=>o[0]===k)||[])[0];if(m)act('pick',{v:m})});
render();
</script>
