"C","Deducting total interest expenses from total interest income and dividing by total equity capital."],["D","Noninterest income less noninterest expenses divided by total earning assets."],["E","None of the above."]]},{"id":"6-MC-3","t":"MC","q":"The difference between such sources of bank income as service charges on deposits and trust-service fees and such sources of bank expenses as salaries and wages and overhead expenses divided by total assets or total earning assets is called the:","a":"C","o":[["A","Net profit margin"],["B","Net operating margin"],["C","Net noninterest margin"],["D","Net return on assets"],["E","None of the above"]]},{"id":"6-MC-4","t":"MC","q":"A bank's ROE equals its ROA times its:","a":"B","o":[["A","Net profit margin"],["B","Total assets divided by total equity capital"],["C","Total operating revenues divided by total assets"],["D","Ratio of net after-tax income to total operating revenues"],["E","None of the above."]]},{"id":"6-MC-5","t":"MC","q":"The earnings spread for a bank is equal to:","a":"A","o":[["A","Total interest income divided by total earning assets less total interest-expense divided by total interest-bearing bank liabilities."],["B","Total interest income less total interest expenses divided by earning assets."],["C","Total operating revenues less total operating expenses divided by total assets."],["D","Total cash and noncash expenses subtracted from interest and noninterest income divided by total assets."],["E","None of the above."]]},{"id":"6-MC-6","t":"MC","q":"The so-called employee productivity ratio for a bank is equal to:","a":"C","o":[["A","Net operating revenue less total interest expenses per employee."],["B","Total interest and noninterest expense per employee"],["C","Net operating income per full-time-equivalent employee"],["D","Total operating earnings less salaries and wages expense per employee."],["E","None of the above."]]},{"id":"6-MC-7","t":"MC","q":"According to the textbook the most profitable banks in the United States in 2007 fell in the asset size range of:","a":"D","o":[["A","Under $25 million in total assets"],["B","Under $100 million in total assets"],["C","Between $100 million and $10 billion in total assets"],["D","Over $10 billion in total assets"],["E","None of the above."]]},{"id":"6-MC-8","t":"MC","q":"A bank's stock price will tend to rise if the:","a":"D","o":[["A","Value of the stream of future stockholder dividends is expected to increase"],["B","The banking organization's perceived level of risk has fallen"],["C","Expected dividends increase, while perceived level of risk declines"],["D","All of the above."],["E","None of the above."]]},{"id":"6-MC-9","t":"MC","q":"The ratio that equals total interest income divided by total earning assets less total interest expense divided by total interest-bearing liabilities is known as the:","a":"B","o":[["A","Earnings base"],["B","Earnings spread"],["C","Net income margin"],["D","Net return prior to special transactions"],["E","None of the above"]]},{"id":"6-MC-10","t":"MC","q":"What do loans and security investments represent for a bank?","a":"A","o":[["A","Earning assets"],["B","Classified assets"],["C","Discretionary accounts"],["D","Market-valued assets"],["E","None of the above"]]},{"id":"6-MC-11","t":"MC","q":"The so-called tax-management efficiency ratio consists of:","a":"C","o":[["A","Total tax liabilities over net income"],["B","Tax-exempt assets over taxable assets"],["C","Net income over pre-tax net operating income"],["D","Taxes owed over total liabilities of a bank"],["E","None of the above."]]},{"id":"6-MC-12","t":"MC","q":"The ratio of net loans to total assets is considered to be a measure of what form of risk in banking?","a":"B","o":[["A","Credit risk"],["B","Liquidity risk"],["C","Market risk"],["D","Interest-rate risk"],["E","None of the above"]]},{"id":"6-MC-13","t":"MC","q":"OE for a bank reflects:","a":"D","o":[["A","How well the assets of the bank are managed"],["B","The bank's use of leverage"],["C","How well the bank controls expenses"],["D","All of the above"],["E","None of the above"]]},{"id":"6-MC-14","t":"MC","q":"A ratio that can be used to measure a bank's credit risk would be:","a":"D","o":[["A","Net loans/total assets"],["B","Interest sensitive assets/interest sensitive liabilities"],["C","Total assets/number of full time employees"],["D","Nonperforming loans/total loans"]]},{"id":"6-MC-15","t":"MC","q":"A bank that has a low profit margin most likely:","a":"A","o":[["A","Is doing a poor job of controlling expenses"],["B","Has a small amount of financial leverage"],["C","Has a small amount of liquidity risk"],["D","Has assets that are not very productive"],["E","None of the above"]]},{"id":"6-MC-16","t":"MC","q":"A bank that has a high asset utilization (AU) ratio most likely:","a":"D","o":[["A","Is doing a poor job of controlling expenses"],["B","Has a small amount of financial leverage"],["C","Has a small amount of liquidity risk"],["D","Is allocating assets to the most productive investments"],["E","None of the above"]]},{"id":"6-MC-17","t":"MC","q":"Which of the following would be the best example of a ratio used to examine the cost of one of the bank's liabilities?","a":"B","o":[["A","Demand deposits/ total assets"],["B","Interest on time deposits/ total time deposits"],["C","Interest on real estate loans/ total real estate loans"],["D","Interest sensitive assets/ interest sensitive liabilities"]]},{"id":"6-MC-18","t":"MC","q":"Which of the following would be the best example of a ratio used to examine the return of one of the bank's assets?","a":"C","o":[["A","Demand deposits/ total assets"],["B","Interest on time deposits/ total time deposits"],["C","Interest on real estate loans/ total real estate loans"],["D","Interest sensitive assets/ interest sensitive liabilities"]]},{"id":"6-MC-19","t":"MC","q":"Which of the following would be the best example of a ratio used to examine the bank's interest rate risk?","a":"D","o":[["A","Demand deposits/ total assets"],["B","Interest on time deposits/ total time deposits"],["C","Interest on real estate loans/ total real estate loans"],["D","Interest sensitive assets/ interest sensitive liabilities"]]},{"id":"6-MC-20","t":"MC","q":"Which of the following ratios would be a measure of credit risk?","a":"A","o":[["A","Nonperforming Loans/Net Loans"],["B","Net Loans/Total Assets"],["C","Interest Sensitive Assets/Interest Sensitive Liabilities"],["D","Equity Capital/Total Assets"],["E","None of the above"]]},{"id":"6-MC-21","t":"MC","q":"Which of the following ratios would be a measure of market risk?","a":"E","o":[["A","Nonperforming Loans/Net Loans"],["B","Net Loans/Total Assets"],["C","Interest Sensitive Assets/Interest Sensitive Liabilities"],["D","Equity Capital/Total Assets"],["E","None of the above"]]},{"id":"6-MC-22","t":"MC","q":"In recent years banks have been __________ profitable than (as) S&Ls and Savings Banks.","a":"A","o":[["A","More"],["B","Less"],["C","As"],["D","Much more"],["E","Much less"]]},{"id":"6-MC-23","t":"MC","q":"Operational risk includes which of the following?","a":"E","o":[["A","Failure of bank’s computer system"],["B","Closure of a bank for three months due to flooding from a major hurricane"],["C","Embezzlement of funds of a bank by a teller of the bank"],["D","Closure of a bank for two weeks due to a fire from a lightening strike"],["E","All of the above are example of operational risk"]]},{"id":"6-MC-24","t":"MC","q":"Brian Smith, CEO of Carter National Bank, decides that interest rates are going to fall in the future and as a result buys $100 million in 30 year Treasury Bonds for the bank’s security portfolio. Instead, interest rates rise causing the value of these bonds to fall. This would be an example of which of the following types of risk?","a":"D","o":[["A","Operational risk"],["B","Legal risk"],["C","Compliance risk"],["D","Strategic risk"],["E","Reputation risk"]]},{"id":"6-MC-25","t":"MC","q":"Chaos State Bank has an old computer system which can go down for weeks at a time, leaving customers unable to access their accounts online. Many customers have left the bank for banks with more reliable computer systems. Which type of risk would this be an example of?","a":"A","o":[["A","Operational risk"],["B","Legal risk"],["C","Compliance risk"],["D","Strategic risk"],["E","Reputation risk"]]},{"id":"6-MC-26","t":"MC","q":"Carson County State Bank has a ratio of equity capital to total assets of 2.5%. The FDIC which regulates this bank has determined that this is not enough equity capital and is making the bank issue new stock in the market. In addition, they are not allowing the bank to issue a dividend to their current stockholders. Which type of risk would this be an example of?","a":"C","o":[["A","Operational risk"],["B","Legal risk"],["C","Compliance risk"],["D","Strategic risk"],["E","Reputation risk"]]},{"id":"6-MC-27","t":"MC","q":"Everett Bank has just learned that there is a disgruntled former employee who has created a blog that is telling everyone that Everett Bank has halved their customer service representatives and so customers have great difficulty getting through to a live person when there is a problem with their account. Everett is worried that they may lose customers as a result. Which type of risk would this be an example of?","a":"E","o":[["A","Operational risk"],["B","Legal risk"],["C","Compliance risk"],["D","Strategic risk"],["E","Reputation risk"]]},{"id":"6-MC-28","t":"MC","q":"Norman Bank made a loan of $1,000,000 to Jarod LeFevre. Jarod has declared bankruptcy and Norman Bank has just learned that the judge in the case has ruled that Jarod does not have to pay any of the loan back or forfeit any of his assets. Which type of risk would this be an example of?","a":"B","o":[["A","Operational risk"],["B","Legal risk"],["C","Compliance risk"],["D","Strategic risk"],["E","Reputation risk"]]},{"id":"6-MC-29","t":"MC","q":"Forrest Fennell is thinking about investing in Capital City Bank. He is examining certain ratios of the bank including the ratio of nonperforming loans to total loans and leases and the provision for loan losses to total loans and leases. What type of risk is Forrest attempting to measure with these ratios?","a":"A","o":[["A","Credit risk"],["B","Liquidity risk"],["C","Market risk"],["D","Interest rate risk"],["E","Operational risk"]]},{"id":"6-MC-30","t":"MC","q":"Gerald Wilkens is thinking about investing in Tallahassee State Bank. He is examining certain ratios of the bank including the ratio of cash assets and government securities to total assets and purchased funds to total assets. What type of risk is Gerald attempting to measure with these ratios?","a":"B","o":[["A","Credit risk"],["B","Liquidity risk"],["C","Market risk"],["D","Interest rate risk"],["E","Operational risk"]]},{"id":"6-MC-31","t":"MC","q":"Amy Farmer is thinking about investing in the Guthrie National Bank. She is examining certain ratios of the bank including the ratio of the book value of the assets to the market value of the assets and the market value of the bonds held by the bank to their recorded value. What type of risk is Amy attempting to measure with these ratios?","a":"C","o":[["A","Credit risk"],["B","Liquidity risk"],["C","Market risk"],["D","Interest rate risk"],["E","Operational risk"]]},{"id":"6-MC-32","t":"MC","q":"Paul Smith is thinking about investing in Capital City Bank. He is examining certain ratios of the bank including the ratio of interest sensitive assets to interest sensitive liabilities and uninsured deposits to total deposits. What type of risk is Paul attempting to measure with these ratios?","a":"D","o":[["A","Credit risk"],["B","Liquidity risk"],["C","Market risk"],["D","Interest rate risk"],["E","Operational risk"]]},{"id":"6-MC-33","t":"MC","q":"The Garic State Bank of New Orleans was under water for three weeks after Hurricane Katrina hit the state. The lobby is full of mud and other debris. Many of the valuables stored in the bank’s safety deposit boxes have been ruined. John Garic, the President and CEO of the bank, has been working night and day to reopen the bank. What type of risk has John been dealing with?","a":"E","o":[["A","Credit risk"],["B","Liquidity risk"],["C","Market risk"],["D","Interest rate risk"],["E","Operational risk"]]},{"id":"6-MC-34","t":"MC","q":"Which assets are excluded from risk assets?","a":"C","o":[["A","Real Estate Loans"],["B","Commercial Paper"],["C","Plant and Equipment"],["D","Commercial and Industrial Loans"],["E","All of the above are risk assets"]]}]},{"ch":12,"title":"Managing and Pricing Deposit Services","items":[{"id":"12-TF-1","t":"TF","q":"The volume of core deposits at U.S. banks has been growing in recent years relative to other categories of deposits.","a":"False"},{"id":"12-TF-2","t":"TF","q":"The U.S. Treasury keeps most of its operating funds in TT&L deposits, according to the textbook.","a":"True"},{"id":"12-TF-3","t":"TF","q":"Deposits owned by commercial banks and held with other banks are called correspondent deposits.","a":"True"},{"id":"12-TF-4","t":"TF","q":"The implicit interest rate on checkable deposits equals the difference between the cost of supplying deposit services to a customer and the amount of the service charge actually assessed that customer.","a":"True"},{"id":"12-TF-5","t":"TF","q":"The contention that there are certain banking services (such as small loans or savings and checking accounts) that every citizen should have access to is usually called socialized banking.","a":"False"},{"id":"12-TF-6","t":"TF","q":"Domestic deposits generate legal reserves.","a":"True"},{"id":"12-TF-7","t":"TF","q":"Excess legal reserves are the source out of which new bank loans are created.","a":"True"},{"id":"12-TF-8","t":"TF","q":"Demand deposits are among the most volatile and least predictable of a bank's sources of funds with the shortest potential maturity.","a":"True"},{"id":"12-TF-9","t":"TF","q":"IRA and Keogh deposits have great appeal for bankers principally because they can be sold bearing relatively low (often below-market) interest rates.","a":"False"},{"id":"12-TF-10","t":"TF","q":"In general, the longer the maturity of a deposit, the lower the yield a financial institution must offer to its depositors because of the greater interest-rate risk the bank faces with longer-term deposits.","a":"False"},{"id":"12-TF-11","t":"TF","q":"The availability of a large block of core deposits decreases the duration of a bank's liabilities.","a":"False"},{"id":"12-TF-12","t":"TF","q":"Interest-bearing checking accounts, on average, tend to generate lower net returns than regular (noninterest-bearing) checking accounts.","a":"False"},{"id":"12-TF-13","t":"TF","q":"Personal checking accounts tend to be more profitable than commercial checking accounts.","a":"False"},{"id":"12-TF-14","t":"TF","q":"NOW accouts can be held by businesses and individuals and are interest bearing checking accounts.","a":"False"},{"id":"12-TF-15","t":"TF","q":"A MMDA is a short term deposit where the bank can offer a competitive interest rate and which allows up to 6 preauthorized drafts per month.","a":"True"},{"id":"12-TF-16","t":"TF","q":"A Roth IRA allows an individual to accumulate investment earnings tax free and also pay no tax on their investment earnings when withdrawn provided the taxpayer follows the rules on this new account.","a":"True"},{"id":"12-TF-17","t":"TF","q":"Competition tends to raise deposit interest costs.","a":"True"},{"id":"12-TF-18","t":"TF","q":"Competition lowers the expected return to a bank from putting its deposits to work.","a":"True"},{"id":"12-TF-19","t":"TF","q":"A bank has full control of its deposit prices in the long run.","a":"False"},{"id":"12-TF-20","t":"TF","q":"Nonprice competition for deposits has tended to distort the allocation of scarce resources in the banking sector.","a":"True"},{"id":"12-TF-21","t":"TF","q":"Deposits are usually priced separately from loans and other bank services.","a":"True"},{"id":"12-TF-22","t":"TF","q":"According to recent Federal Reserve data no-fee savings accounts are on the decline.","a":"True"},{"id":"12-TF-23","t":"TF","q":"According to recent survey information provided by the staff of the Federal Reserve Board the average level of fees on most types of checking and NOW accounts appear to have risen.","a":"True"},{"id":"12-TF-24","t":"TF","q":"The number one factor households consider in selecting a bank to hold their checking account is, according to recent studies cited in this chapter, low fees and low minimum balance.","a":"False"},{"id":"12-TF-25","t":"TF","q":"The number one factor households consider in choosing a bank to hold their savings deposits, according to recent studies cited in this chapter, is location.","a":"False"},{"id":"12-TF-26","t":"TF","q":"Conditionally free deposits for customers mean that as long as the customers do not go above a certain level of deposits there are no monthly fees or per transaction charges.","a":"False"},{"id":"12-TF-27","t":"TF","q":"When a bank temporarily offers higher than average interest rates or lower than average customer fees in order to attract new business they are practicing conditional pricing.","a":"False"},{"id":"12-TF-28","t":"TF","q":"Web-centered banks with little or no physical facilities are known as ________ banks","a":"True"},{"id":"12-TF-29","t":"TF","q":"The total dollar value of checks paid in the United States has grown modestly in recent years.","a":"False"},{"id":"12-TF-30","t":"TF","q":"There are still a number of existing problems with online bill-paying services which has limited the growth.","a":"True"},{"id":"12-TF-31","t":"TF","q":"The depository institutions which tend to have the highest deposit yields are credit unions.","a":"False"},{"id":"12-TF-32","t":"TF","q":"Urban markets are more responsive to deposit interest rates and fees than rural markets.","a":"False"},{"id":"12-TF-33","t":"TF","q":"Research indicates that at least half of all households and small businesses hold their primary checking account at a depository institution situated within 3 miles of their location.","a":"True"},{"id":"12-MC-1","t":"MC","q":"Deposit accounts whose principal function is to make payments for purchases of goods and services are called:","a":"D","o":[["A","Drafts"],["B","Second-party payments accounts"],["C","Thrift deposits"],["D","Transaction accounts"],["E","None of the above"]]},{"id":"12-MC-2","t":"MC","q":"The stable and predictable base of deposited funds that are not highly sensitive to movements in market interest rates but tend to remain with the bank are called:","a":"B","o":[["A","Time deposits"],["B","Core deposits"],["C","Consumer CDs"],["D","Nontransaction deposits"],["E","None of the above"]]},{"id":"12-MC-3","t":"MC","q":"A deposit which offers flexible money market interest rates but is accessible for spending by writing a limited number of checks or executing preauthorized drafts is known as a:","a":"C","o":[["A","Demand deposit"],["B","NOW account"],["C","MMDAs"],["D","Time deposit"],["E","None of the above"]]},{"id":"12-MC-4","t":"MC","q":"The types of deposits that will be created by the banking system depend predominantly upon:","a":"D","o":[["A","The level of interest rates"],["B","The state of the economy"],["C","The monetary policies of the central bank"],["D","Public preference"],["E","None of the above."]]},{"id":"12-MC-5","t":"MC","q":"The most profitable deposit for a bank is a:","a":"B","o":[["A","Time deposit"],["B","Commercial checking account"],["C","Personal checking account"],["D","Passbook savings deposit"],["E","Special checking account"]]},{"id":"12-MC-6","t":"MC","q":"Some people feel that individuals are entitled to some minimum level of financial services no matter what their income level. This issue is often called:","a":"A","o":[["A","Lifeline banking"],["B","Preference banking"],["C","Nondiscriminatory banking"],["D","Lifeboat banking"],["E","None of the above"]]},{"id":"12-MC-7","t":"MC","q":"The formula Operating Expense per unit of deposit service + Estimated overhead expense + Planned profit from each deposit service unit sold reflects what deposit pricing method listed below?","a":"B","o":[["A","Marginal cost pricing"],["B","Cost plus pricing"],["C","Conditional pricing"],["D","Upscale target pricing"],["E","None of the above."]]},{"id":"12-MC-8","t":"MC","q":"Using deposit fee schedules that vary deposit prices according to the number of transactions, the average balance in the deposit account, and the maturity of the deposit represents what deposit pricing method listed below?","a":"C","o":[["A","Marginal cost pricing"],["B","Cost plus pricing"],["C","Conditional pricing"],["D","Upscale target pricing"],["E","None of the above."]]},{"id":"12-MC-9","t":"MC","q":"The deposit pricing method that favors large-denomination deposits because services are free if the deposit account balance stays above some minimum figure is called:","a":"B","o":[["A","Free pricing"],["B","Conditionally free pricing"],["C","Flat-rate pricing"],["D","Upscale target pricing"],["E","Marginal cost pricing"]]},{"id":"12-MC-10","t":"MC","q":"According to recent studies cited in this book, in selecting a bank to hold their checking accounts household customers rank first which of the following factors?","a":"C","o":[["A","Safety"],["B","High deposit interest rates"],["C","Convenient location"],["D","Availability of other services"],["E","Low fees and low minimum balance."]]},{"id":"12-MC-11","t":"MC","q":"According to recent studies cited in this chapter, in choosing a bank to hold their savings deposits household customers rank first which of the following factors?","a":"A","o":[["A","Familiarity"],["B","Interest rate paid"],["C","Transactional convenience"],["D","Location"],["E","Fees charged."]]},{"id":"12-MC-12","t":"MC","q":"According to recent studies cited in this chapter, in choosing a bank to supply their deposits and other services business firms rank first which of the following factors?","a":"B","o":[["A","Quality of financial advice given"],["B","Financial health of lending institution"],["C","Whether loans are competitively priced"],["D","Whether cash management and operations services are provided."],["E","Quality of bank officers."]]},{"id":"12-MC-13","t":"MC","q":"A financial institution that charges customers based on the number of services they use and gives lower deposit fees or waives some fees for a customer that purchases two or more services is practicing:","a":"C","o":[["A","Marginal cost pricing"],["B","Conditional pricing"],["C","Relationship pricing"],["D","Upscale target pricing"],["E","None of the above"]]},{"id":"12-MC-14","t":"MC","q":"Conditional deposit pricing may involve all of the following factors except:","a":"A","o":[["A","The level of interest rates"],["B","The number of transactions passing through the account"],["C","The average balance in the account"],["D","The maturity of the account"],["E","All of the above are used"]]},{"id":"12-MC-15","t":"MC","q":"Customers who wish to set aside money in anticipation of future expenditures or financial emergencies put their money in","a":"C","o":[["A","Drafts"],["B","Second-party payment accounts"],["C","Thrift Deposits"],["D","Transaction accounts"],["E","None of the above"]]},{"id":"12-MC-16","t":"MC","q":"A savings account evidenced only by computer entry for which the customer gets a monthly printout is called:","a":"B","o":[["A","Passbook savings account"],["B","Statement savings plan"],["C","Negotiable order of withdrawal"],["D","Money market mutual fund"],["E","None of the above"]]},{"id":"12-MC-17","t":"MC","q":"A traditional savings account where evidenced by the entries recorded in a booklet kept by the customer is called:","a":"A","o":[["A","Passbook savings account"],["B","Statement savings plan"],["C","Negotiable order of withdrawal"],["D","Money market mutual fund"],["E","None of the above"]]},{"id":"12-MC-18","t":"MC","q":"An account at a bank that carries a fixed maturity date with a fixed interest rate and which often carries a penalty for early withdrawal of money is called:","a":"C","o":[["A","Demand deposit"],["B","Transaction deposit"],["C","Time deposit"],["D","Money market mutual deposit"],["E","None of the above"]]},{"id":"12-MC-19","t":"MC","q":"A time deposit that has a denominations greater than $100,000 and are generally for wealthy individuals and corporations is known as a:","a":"A","o":[["A","Negotiable CD"],["B","Bump-up CD"],["C","Step-up CD"],["D","Liquid CD"],["E","None of the above"]]},{"id":"12-MC-20","t":"MC","q":"A time deposit that is non-negotiable but where the promised interest rate can rise with market interest rates is called a:","a":"B","o":[["A","Negotiable CD"],["B","Bump-up CD"],["C","Step-up CD"],["D","Liquid CD"],["E","None of the above"]]},{"id":"12-MC-21","t":"MC","q":"A time deposit that allows for a periodic upward adjustment to the promised rate is called a:","a":"C","o":[["A","Negotiable CD"],["B","Bump-up CD"],["C","Step-up CD"],["D","Liquid CD"],["E","None of the above"]]},{"id":"12-MC-22","t":"MC","q":"A time deposit that allows the depositor to withdraw some of his or her funds without a withdrawal penalty is called a:","a":"D","o":[["A","Negotiable CD"],["B","Bump-up CD"],["C","Step-up CD"],["D","Liquid CD"],["E","None of the above"]]},{"id":"12-MC-23","t":"MC","q":"What has made IRA and Keogh accounts more attractive to depositors recently?","a":"E","o":[["A","Allowing the bank to have FDIC insurance on these accounts"],["B","Allowing the fund to grow tax free over the life of the fund"],["C","Allowing the depositor to pay no taxes on investment earnings when withdrawn"],["D","Requiring banks to pay at least 6% on these accounts to depositors"],["E","Increasing FDIC insurance coverage to $250,000 on these accounts"]]},{"id":"12-MC-24","t":"MC","q":"The dominant holder of bank deposits in the U.S. is:","a":"A","o":[["A","The private sector"],["B","State and local governments"],["C","Foreign governments"],["D","Deposits of other banks"],["E","None of the above"]]},{"id":"12-MC-25","t":"MC","q":"The deposit pricing method absent of any monthly account maintenance fee or per-transaction fee is called:","a":"A","o":[["A","Free pricing"],["B","Conditionally free pricing"],["C","Flat-rate pricing"],["D","Marginal cost pricing"],["E","Nonprice competition"]]},{"id":"12-MC-26","t":"MC","q":"The deposit pricing method that charges a fixed charge per check or per period or both is called:","a":"C","o":[["A","Free pricing"],["B","Conditionally free pricing"],["C","Flat-rate pricing"],["D","Marginal cost pricing"],["E","Nonprice competition"]]},{"id":"12-MC-27","t":"MC","q":"The deposit pricing method that focuses on the added cost of bringing in new funds is called:","a":"D","o":[["A","Free pricing"],["B","Conditionally free pricing"],["C","Flat-rate pricing"],["D","Marginal cost pricing"],["E","Nonprice competition"]]},{"id":"12-MC-28","t":"MC","q":"Business (commercial) transaction accounts are generally more profitable than personal checking accounts, according to the textbook. Which of the following explain the reasons for this statement:","a":"E","o":[["A","The average size of the business transaction is smaller than the personal transaction"],["B","Lower interest expenses are associated with commercial deposit transaction"],["C","The bank receives more investable funds in the commercial deposits transaction"],["D","A and B"],["E","B and C"]]}]},{"ch":13,"title":"Managing Nondeposit Liabilities","items":[{"id":"13-TF-1","t":"TF","q":"The traditional and principal source of bank funds is deposits.","a":"True"},{"id":"13-TF-2","t":"TF","q":"Asset management (i.e., conversion of assets to cash) is regarded as an interest-sensitive approach to raising funds.","a":"False"},{"id":"13-TF-3","t":"TF","q":"Deposits have been growing faster than nondeposit sources of funds in recent years among U.S. banks.","a":"False"},{"id":"13-TF-4","t":"TF","q":"Federal funds today consist exclusively of deposits held at the Federal Reserve banks.","a":"False"},{"id":"13-TF-5","t":"TF","q":"There are no reserve requirements on Federal funds borrowings in the U.S.","a":"True"},{"id":"13-TF-6","t":"TF","q":"Accommodating banks buy and sell Federal funds simultaneously.","a":"True"},{"id":"13-TF-7","t":"TF","q":"Loans of Federal funds under a continuing contract are automatically renewed each day unless either the borrower or the lender decides to end the agreement.","a":"True"},{"id":"13-TF-8","t":"TF","q":"The loan from a Federal Reserve bank which normally lasts only a few days and is designed to provide immediate aid in meeting a bank's legal reserve requirement is known as extended credit.","a":"False"},{"id":"13-TF-9","t":"TF","q":"Yankee CDs are issued by large savings and loan associations and other nonbank savings institutions.","a":"False"},{"id":"13-TF-10","t":"TF","q":"The volume of variable-rate CDs exceeds the volume of fixed-rate CDs among U.S. banks.","a":"False"},{"id":"13-TF-11","t":"TF","q":"Liability management is considered to be an interest-sensitive approach to raising bank funds.","a":"True"},{"id":"13-TF-12","t":"TF","q":"Funds raised by the use of liability management techniques are considered to be flexible.","a":"True"},{"id":"13-TF-13","t":"TF","q":"Liability management banking calls for using price (the interest rate offered) as the control lever to regulate incoming funds.","a":"True"},{"id":"13-TF-14","t":"TF","q":"The most common type of federal funds loans are term loans.","a":"False"},{"id":"13-TF-15","t":"TF","q":"Longer-term federal funds contracts lasting several days, weeks, or months, often accompanied by a written contract, are called continuing contracts.","a":"False"},{"id":"13-TF-16","t":"TF","q":"The largest foreign banks active in the United States sell CDs through their U.S. branches called Yankee CDs.","a":"True"},{"id":"13-TF-17","t":"TF","q":"Nondeposit funds do have the advantage of quick availability compared to most types of deposits, but are not as stable a funding source for banks as are time and savings deposits.","a":"True"},{"id":"13-TF-18","t":"TF","q":"Longer-term federal funds contracts which are automatically renewed each day unless either the borrower or the lender decides to end the agreement are called term loans,","a":"False"},{"id":"13-TF-19","t":"TF","q":"The main use of federal funds today is still the traditional one. Federal funds provide a mechanism that allows banks short of legal reserves to tap into immediately available funds from other institutions possessing temporarily idle funds.","a":"True"},{"id":"13-TF-20","t":"TF","q":"One of the factors to consider when a bank chooses among nondeposit funding sources is the relative cost. In general, the cheapest source of short-term funds is the Fed Funds market.","a":"True"},{"id":"13-TF-21","t":"TF","q":"There are no restrictions on getting a Federal Reserve loan and because it is the cheapest source of short-term funds most banks will use this source of funds exclusively.","a":"False"},{"id":"13-TF-22","t":"TF","q":"CDs must be issued with maturities of at least 7 days.","a":"True"},{"id":"13-TF-23","t":"TF","q":"Loans from the Fed Funds market must be backed by collateral.","a":"False"},{"id":"13-TF-24","t":"TF","q":"In recent years financial institutions have gotten better at managing interest rate risk.","a":"True"},{"id":"13-TF-25","t":"TF","q":"Large banks depend more on nondeposit borrowings than small banks.","a":"True"},{"id":"13-TF-26","t":"TF","q":"Although there is an active federal funds spot market, there is currently no associated futures market for federal funds.","a":"False"},{"id":"13-TF-27","t":"TF","q":"Repurchase Agreement (RPs) transactions are perceived to be less risky than equivalent federal funds transactions.","a":"True"},{"id":"13-TF-28","t":"TF","q":"Interest rates in the Repurchase Agreement (RP) market are quoted on a 360-day basis.","a":"True"},{"id":"13-TF-29","t":"TF","q":"Seasonal credit discount window loans generally have the highest interest rates.","a":"False"},{"id":"13-TF-30","t":"TF","q":"Primary credit is defined as loans available for short terms and normally considered beneficial for the borrower because it carries an interest rate slightly below the target Fed funds rate.","a":"False"},{"id":"13-TF-31","t":"TF","q":"When the general credit conditions are tight, there is a possibility that not every borrower will be accommodated by a lender. This chance of credit rationing is referred to as credit availability risk.","a":"True"},{"id":"13-TF-32","t":"TF","q":"The size of a financial institution has an effect on the type of nondeposit funding source that it will consider. For example, larger depository institutions have the credit standing to sell the largest negotiable CDs, while the Fed funds market is suitable for smaller institutions.","a":"True"},{"id":"13-TF-33","t":"TF","q":"Only federal regulators can limit the terms (amount, frequency, and use) of borrower funds by the U.S. depository institutions.","a":"False"},{"id":"13-MC-1","t":"MC","q":"The doctrine that the first priority of a bank is to make loans to all those customers from whom the bank expects to receive positive net earnings is called the:","a":"B","o":[["A","Funds management doctrine"],["B","Customer relationship doctrine"],["C","Loan priority doctrine"],["D","Revenue flows doctrine"],["E","None of the above."]]},{"id":"13-MC-2","t":"MC","q":"The doctrine that banks should be able to buy the reserves they need to cover good-quality loan requests is known as:","a":"C","o":[["A","Funds Management"],["B","Asset Management"],["C","Liability Management"],["D","Asset-Liability Coordinated Management"],["E","None of the above."]]},{"id":"13-MC-3","t":"MC","q":"With liability management banking the control lever to regulate incoming bank funds is:","a":"D","o":[["A","Management discretion"],["B","The volume of loan demand the bank faces."],["C","Deposit growth"],["D","Price"],["E","None of the above."]]},{"id":"13-MC-4","t":"MC","q":"The most popular domestic source of borrowed reserves for U.S. banks is:","a":"A","o":[["A","Federal funds market"],["B","Money market negotiable CDs"],["C","Eurodollar market"],["D","Borrowings from the Federal Reserve Banks"],["E","Commercial paper market"]]},{"id":"13-MC-5","t":"MC","q":"The phrase \"short-term borrowings of immediately available money\" refers to:","a":"E","o":[["A","Negotiable CDs"],["B","Eurodollar deposits"],["C","Commercial paper issues"],["D","Borrowings of legal reserves at the Federal Reserve banks"],["E","None of the above."]]},{"id":"13-MC-6","t":"MC","q":"Large time deposits are generally referred to as:","a":"B","o":[["A","Mini CDs."],["B","Jumbo CDs."],["C","Large CDs."],["D","Giant CDs."],["E","Super CDs."]]},{"id":"13-MC-7","t":"MC","q":"The source of short-term funds for commercial banks that was developed to tap temporary surplus funds held by large corporate and wealthy individual customers is:","a":"D","o":[["A","Federal funds."],["B","Commercial paper."],["C","Eurodollar deposits."],["D","Negotiable CDs."],["E","None of the above."]]},{"id":"13-MC-8","t":"MC","q":"Factors that will affect a bank's decision as to which nondeposit sources of funds it will use to cover its projected funds gap include which of the following?","a":"E","o":[["A","The relative cost of raising the funds."],["B","The length of time the funds will be required."],["C","The risk associated with each source of funds."],["D","The size of the bank."],["E","All of the above."]]},{"id":"13-MC-9","t":"MC","q":"CDs that are sold by the largest foreign banks through their U.S. branches are called:","a":"D","o":[["A","Thrift CDs."],["B","Domestic CDs."],["C","EuroCDs."],["D","Yankee CDs."],["E","None of the above."]]},{"id":"13-MC-10","t":"MC","q":"Accommodating banks perform what role?","a":"D","o":[["A","They act as intermediaries in the Eurodollar market."],["B","They issue negotiable CDs for themselves and for other banks."],["C","They sell commercial paper to raise funds for themselves and other firms belonging to their bank holding company."],["D","They buy and sell federal funds simultaneously in order to make a market for reserves of customer banks."],["E","None of the above."]]},{"id":"13-MC-11","t":"MC","q":"A federal funds loan that is automatically renewed each day unless either the borrower or the lender decides to end the loan agreement is known as a:","a":"B","o":[["A","Overnight loan."],["B","Continuing contract."],["C","Term loan."],["D","Rollover loan agreement"],["E","None of the above"]]},{"id":"13-MC-12","t":"MC","q":"Longer-term federal funds contracts lasting several days, weeks, or months, often accompanied by a written contract, are known as:","a":"A","o":[["A","Term loans."],["B","Continuing contracts"],["C","Rollover loans."],["D","Federal funds mutuality agreements"],["E","None of the above"]]},{"id":"13-MC-13","t":"MC","q":"The bank funding source that is really a \"hybrid\" account is the:","a":"C","o":[["A","Federal funds loan."],["B","Repurchase agreement."],["C","Negotiable CD."],["D","Eurodollar deposit."],["E","None of the above."]]},{"id":"13-MC-14","t":"MC","q":"The short-term notes, with maturities ranging from 3 or 4 days to 9 months, issued by well known companies are known as:","a":"B","o":[["A","Negotiable CDs"],["B","Commercial paper"],["C","Federal funds"],["D","Repurchase agreements"],["E","None of the above"]]},{"id":"13-MC-15","t":"MC","q":"An agreement where one party agrees to sell T-bills to another party and at the same time agrees to buy them back at a set price is known as:","a":"A","o":[["A","A repurchase agreement"],["B","Commercial paper"],["C","Federal Funds"],["D","Negotiable CDs"],["E","None of the above"]]},{"id":"13-MC-16","t":"MC","q":"Which of the following is not an advantage of using a repurchase agreement?","a":"A","o":[["A","The bank gains excess reserves which can used to make new deposits"],["B","The bank makes use of high-quality but low yielding assets without losing them permanently"],["C","If the agreement is made with a bank who keeps a checkable deposit with the bank it can reduce both the bank's deposits and reserve requirements"],["D","The interest rate the bank has to pay is usually low"],["E","All of the above are advantages of using a repurchase agreement"]]},{"id":"13-MC-17","t":"MC","q":"Which of the following is an example of a longer term nondeposit funding source?","a":"C","o":[["A","Federal funds"],["B","Repurchase agreements"],["C","Capital notes and debentures"],["D","Negotiable CDs"],["E","None of the above"]]},{"id":"13-MC-18","t":"MC","q":"Dollar denominated CDs issued by banks outside the United States are known as:","a":"B","o":[["A","Domestic CDs"],["B","Euro CDs"],["C","Yankee CDs"],["D","Commercial paper"],["E","None of the above"]]},{"id":"13-MC-19","t":"MC","q":"A repurchase agreement (RP) in which the collateral is specifically identified is known as:","a":"A","o":[["A","A conventional RP"],["B","A General Collateral Finance RP"],["C","A specific RP"],["D","A general RP"],["E","An individual RP"]]},{"id":"13-MC-20","t":"MC","q":"A conventional Repurchase Agreement (RP) is ________ flexible for the borrower than (as) a General Collateral Finance RP.","a":"B","o":[["A","More"],["B","Less"],["C","As"],["D","Unknown"],["E","None of the above"]]},{"id":"13-MC-21","t":"MC","q":"The following types of loans are all available at the discount window except:","a":"A","o":[["A","Adjustment credit"],["B","Primary credit"],["C","Secondary credit"],["D","Seasonal credit"],["E","None of the above"]]},{"id":"13-MC-22","t":"MC","q":"In addition to the Federal Reserve, another governmental agency has also been loaning large amounts of money to banks and thrift institutions and is known as the:","a":"D","o":[["A","FDIC"],["B","OCC"],["C","OTS"],["D","FHLB"],["E","RTC"]]},{"id":"13-MC-23","t":"MC","q":"The Willis Savings Bank is comparing the prevailing interest rate in the Fed Funds market with that in the negotiable CD market. They are making sure to include the noninterest costs and the deposit insurance costs as well as the amount of money that will actually be available for new loans. Which factor that affects a bank’s use of nondeposit sources of funds is the bank examining?","a":"A","o":[["A","The relative cost of raising the funds"],["B","The length of time the funds will be required"],["C","The risk associated with each source of funds"],["D","The size of the bank"],["E","Regulations"]]},{"id":"13-MC-24","t":"MC","q":"The First State Bank of Summerville knows that, if they issue commercial paper through a subsidiary, money is very tight and the interest rate on the commercial paper may very high. What factor that affects a bank’s use of nondeposit sources of funds is the bank concerned about?","a":"C","o":[["A","The relative cost of raising the funds"],["B","The length of time the funds will be required"],["C","The risk associated with each source of funds"],["D","The size of the bank"],["E","Regulations"]]},{"id":"13-MC-25","t":"MC","q":"The First State Bank of Summerville knows that, if they issue a large amount of the negotiable CD, money is tight. As a result, they choose to ration the credit and lend only to their most loyal clients. What risk factor that affects a bank’s use of nondeposit sources of funds is the concern here?","a":"D","o":[["A","Interest rate changes"],["B","The length of time the funds will be required"],["C","The relative cost of raising the funds"],["D","Credit availability"],["E","Regulations"]]},{"id":"13-MC-26","t":"MC","q":"The manager of the First National Bank of Edmond needs $100 million this afternoon to satisfy an unexpected loan demand from an excellent customer of the bank. What factor that affects a bank’s use of nondeposit sources of funds is the manager concerned about?","a":"B","o":[["A","The relative cost of raising the funds"],["B","The length of time the funds will be required"],["C","The risk associated with each source of funds"],["D","The size of the bank"],["E","Regulations"]]},{"id":"13-MC-27","t":"MC","q":"The First State Bank of Summerville needs to raise $500,000 in nondeposit sources of funds. They know that the Eurodollar market requires a minimum denomination of $1 million. What factor that affects a bank’s use of nondeposit sources of funds is this bank concerned about?","a":"D","o":[["A","The relative cost of raising the funds"],["B","The length of time the funds will be required"],["C","The risk associated with each source of funds"],["D","The size of the bank"],["E","Regulations"]]},{"id":"13-MC-28","t":"MC","q":"Bank of America is concerned because they have heard that the Federal Reserve Board may impose legal reserve requirements on money borrowed in the Fed Funds market. Which factor that affects a bank’s use of nondeposit sources of funds is this bank concerned about?","a":"E","o":[["A","The relative cost of raising the funds"],["B","The length of time the funds will be required"],["C","The risk associated with each source of funds"],["D","The size of the bank"],["E","Regulations"]]},{"id":"13-MC-29","t":"MC","q":"CDs issued by savings institutions are called:","a":"A","o":[["A","Thrift CDs"],["B","Domestic CDs"],["C","Euro CDs"],["D","Yankee CDs"],["E","Variable rate CDs"]]},{"id":"13-MC-30","t":"MC","q":"When a foreign branch lends a Eurodeposit to its home office in the U.S., how is this listed on the balance sheet of the home office?","a":"B","o":[["A","Loan from Subsidiary"],["B","Liabilities to Foreign Branches"],["C","Securities Sold under Agreement to Repurchase"],["D","Bankers Acceptance"],["E","None of the above"]]},{"id":"13-MC-31","t":"MC","q":"A Fed Funds loan that is an unwritten agreement negotiated via wire or telephone with the borrowed funds returned the next day is known as:","a":"A","o":[["A","An overnight loan"],["B","A continuing contract"],["C","A term loan"],["D","A daytime loan"],["E","None of the above"]]},{"id":"13-MC-32","t":"MC","q":"Setting the Federal Reserve primary-credit discount rate above the Fed Funds rate mirrors what credit facilities used by several European central banks?","a":"C","o":[["A","The Vince credit facilities"],["B","The Adam Smith credit facilities"],["C","The Lombard credit facilities"],["D","The Lower Back credit facilities"],["E","None of the above"]]}]},{"ch":14,"title":"Investment Banking, Insurance, and Other Sources of Fee Income","items":[{"id":"14-TF-1","t":"TF","q":"A bank's nondeposit investment products include IRAs, Keoghs and MMDAs.","a":"False"},{"id":"14-TF-2","t":"TF","q":"A nonproprietary mutual fund is where the bank acts as a broker for a nonaffiliated mutual fund but does not act as an investment advisor.","a":"True"},{"id":"14-TF-3","t":"TF","q":"Trust services have no impact on the deposits of the bank.","a":"False"},{"id":"14-TF-4","t":"TF","q":"Trust services are a relatively new service for banks.","a":"False"},{"id":"14-TF-5","t":"TF","q":"The product line diversification effect occurs when a traditional banking service and a nontraditional banking service are not very correlated with each other and reduce the overall risk of the bank.","a":"True"},{"id":"14-TF-6","t":"TF","q":"While the trust department performs a variety of roles their activities center on establishing a fiduciary relationship with the customer.","a":"True"},{"id":"14-TF-7","t":"TF","q":"A proprietary mutual fund is where the bank sells a mutual fund through one of their affiliated companies and where the bank can act as an investment advisor.","a":"True"},{"id":"14-TF-8","t":"TF","q":"An annuity is a company that offers shares in a pool of securities (stocks, bonds, etc.) and flows through any earnings generated to the shareholding customer.","a":"False"},{"id":"14-TF-9","t":"TF","q":"A mutual fund is a savings instrument where the customer makes cash payments to an investment manager who invests them in earning assets. Later the purchaser receives a stream of income from these assets.","a":"False"},{"id":"14-TF-10","t":"TF","q":"Customers have no rights to opt out of having their private information collected by banks and other financial-service firms shared with other financial-services firms.","a":"False"},{"id":"14-TF-11","t":"TF","q":"One attractive feature of investment banking is that it is generally less risky than commercial banking.","a":"False"},{"id":"14-TF-12","t":"TF","q":"The first mutual fund was offered in France.","a":"False"},{"id":"14-TF-13","t":"TF","q":"State Street Bank in Boston is a good example of a fee-focused banking company.","a":"True"},{"id":"14-TF-14","t":"TF","q":"An insurance product or annuity sold by a depository institution is NOT insured by the FDIC.","a":"True"},{"id":"14-TF-15","t":"TF","q":"Investment bankers are financial advisors to individuals and act as brokers and dealers for those individuals.","a":"False"},{"id":"14-TF-16","t":"TF","q":"Traditionally the most profitable and best known investment banking activity is providing client advice.","a":"False"},{"id":"14-TF-17","t":"TF","q":"A ‘Chinese wall’ is supposed to prevent the transfer of insider information about clients between the investment banker’s security underwriter division and the internal unit where proprietary trading of stocks and bonds takes place.","a":"True"},{"id":"14-MC-1","t":"MC","q":"Customers purchasing nondeposit investment accounts sold by a bank operating in the United States must be told in writing:","a":"D","o":[["A","Investment accounts are not federally insured"],["B","Investment accounts are not deposits in nor guaranteed by a depository institution"],["C","Investment accounts could suffer loss of principal"],["D","All of the above."],["E","None of the above."]]},{"id":"14-MC-2","t":"MC","q":"A trust department's activities often center around establishing:","a":"C","o":[["A","An independent relationship with the customer"],["B","A partnership relationship with the customer"],["C","A fiduciary relationship with the customer"],["D","A subservient relationship with the customer"],["E","None of the above"]]},{"id":"14-MC-3","t":"MC","q":"A bank would offer insurance services in addition to traditional banking services if it believed in the potential the benefits of:","a":"C","o":[["A","Reputation"],["B","Economies of scale"],["C","Economies of scope"],["D","Investment services"],["E","None of the above"]]},{"id":"14-MC-4","t":"MC","q":"Which of the following is an example of a nondeposit investment product of the bank?","a":"D","o":[["A","Time deposit"],["B","NOW account"],["C","Passbook savings account"],["D","Proprietary mutual fund"],["E","All of the above"]]},{"id":"14-MC-5","t":"MC","q":"Which of the following trust agreements allows wealth to be passed free of gift and estate tax to heirs?","a":"B","o":[["A","Revocable trust"],["B","Irrevocable trust"],["C","Charitable trust"],["D","Indenture trusts"],["E","None of the above"]]},{"id":"14-MC-6","t":"MC","q":"Which of the following trust agreements allows the bank trust officer to act on behalf of a living customer?","a":"A","o":[["A","Revocable trust"],["B","Irrevocable trust"],["C","Charitable trust"],["D","Indenture trusts"],["E","None of the above"]]},{"id":"14-MC-7","t":"MC","q":"Which of the following trust agreements is used to back the issue of securities by a corporation?","a":"D","o":[["A","Revocable trust"],["B","Irrevocable trust"],["C","Charitable trust"],["D","Indenture trusts"],["E","None of the above"]]},{"id":"14-MC-8","t":"MC","q":"When a bank is expecting that the overall risk of FHC will be reduced when they combine investment banking services with the traditional banking services, what type of effect are they expecting?","a":"A","o":[["A","Product Line Diversification Effect"],["B","Economies of Scope Effect"],["C","Economies of Scale Effect"],["D","Geographic Diversification Effect"],["E","None of the above"]]},{"id":"14-MC-9","t":"MC","q":"When a bank is expecting to be able to employ the same managers, employees and physical resources to offer multiple products and generate costs savings they are expecting which of the following effects?","a":"B","o":[["A","Product Line Diversification Effect"],["B","Economies of Scope Effect"],["C","Economies of Scale Effect"],["D","Geographic Diversification Effect"],["E","None of the above"]]},{"id":"14-MC-10","t":"MC","q":"Trust Department activities include all of the following except:","a":"D","o":[["A","safeguarding"],["B","asset management"],["C","generate large deposits"],["D","lending"],["E","source of new deposits"]]},{"id":"14-MC-11","t":"MC","q":"A financial holding company may include all of the following services except:","a":"A","o":[["A","IPO"],["B","Consumer lending"],["C","Trust services"],["D","Investment banking"],["E","Insurance"]]},{"id":"14-MC-12","t":"MC","q":"Among potential advantages of combining various financial services activities in one FHC are all of the following except:","a":"E","o":[["A","Supplementing traditional sources of funds with new funds"],["B","Supplementing traditional revenue with new revenue sources"],["C","Lowering the cost of service production through economies of scale and scope"],["D","Reducing the risk of failure"],["E","Increasing earnings fluctuations"]]},{"id":"14-MC-13","t":"MC","q":"If the correlation between revenues from traditional banking and nontraditional services offered by a bank rises, potential diversification benefits:","a":"B","o":[["A","Will rise"],["B","Will fall"],["C","Will remain the same"],["D","Will remain the same but only under certain conditions"],["E","Cannot be determined"]]},{"id":"14-MC-14","t":"MC","q":"A company that offers shares in a pool of securities and flows through any earnings generated to the shareholders is called:","a":"A","o":[["A","A mutual fund"],["B","An annuity"],["C","The net asset value"],["D","A hedge fund"],["E","None of the above"]]},{"id":"14-MC-15","t":"MC","q":"A savings instrument where the customer makes a lump sum payment to the investment manager who invests the payment in earning assets and later receives a stream of income from the assets is called:","a":"B","o":[["A","A mutual fund"],["B","An annuity"],["C","The net asset value"],["D","A hedge fund"],["E","None of the above"]]},{"id":"14-MC-16","t":"MC","q":"A customer’s *pro rata* value of a share in a mutual fund if the assets of the fund were liquidated and liabilities paid off is called:","a":"C","o":[["A","A mutual fund"],["B","An annuity"],["C","The net asset value"],["D","A hedge fund"],["E","None of the above"]]},{"id":"14-MC-17","t":"MC","q":"A private partnership whose shares are primarily offered to wealthy individuals and large institutions and which often makes high-stakes bets on the direction of the market is called:","a":"D","o":[["A","A mutual fund"],["B","An annuity"],["C","The net asset value"],["D","A hedge fund"],["E","None of the above"]]}]},{"ch":15,"title":"The Management of Capital","items":[{"id":"15-TF-1","t":"TF","q":"In the field of banking, capital refers principally to those funds contributed by a bank's owners.","a":"True"},{"id":"15-TF-2","t":"TF","q":"According to the textbook capital and risk are intimately related to each other.","a":"True"},{"id":"15-TF-3","t":"TF","q":"One fundamental purpose for regulating capital is to limit losses to the federal government arising from deposit insurance claims.","a":"True"},{"id":"15-TF-4","t":"TF","q":"Deposit insurance subsidized by government encourages banks to increase their ratios of capital to deposits.","a":"False"},{"id":"15-TF-5","t":"TF","q":"Tier 2 includes undivided profits.","a":"False"},{"id":"15-TF-6","t":"TF","q":"Core capital includes the surplus account for stock.","a":"True"},{"id":"15-TF-7","t":"TF","q":"Under the international capital (Basel) agreement Tier 2 capital must be raised to a minimum of 4 percent of risk-weighted assets.","a":"False"},{"id":"15-TF-8","t":"TF","q":"Off-balance-sheet commitments of banks carry capital requirements under the international (Basel) capital requirements.","a":"True"},{"id":"15-TF-9","t":"TF","q":"Portfolio diversification refers to seeking out customers located in different communities or countries, which presumably will experience different economic conditions.","a":"False"},{"id":"15-TF-10","t":"TF","q":"Geographic diversification refers to the spreading out credit accounts and deposits among a wide variety of customers, including large and small business accounts, different industries, and households with a variety of sources of income and collateral.","a":"False"},{"id":"15-TF-11","t":"TF","q":"The last line of defense against bank failure is owner's capital, according to the textbook.","a":"True"},{"id":"15-TF-12","t":"TF","q":"Recent research suggests that interest-rate contracts display considerably less risk exposure than do foreign-currency contracts.","a":"True"},{"id":"15-TF-13","t":"TF","q":"The Basel Agreement on capital as drafted in the 1980s failed to deal with market risk.","a":"True"},{"id":"15-TF-14","t":"TF","q":"If a bank benefits when the value of a foreign currency rises, the bank is said to be in a short position.","a":"False"},{"id":"15-TF-15","t":"TF","q":"If a bank benefits when a foreign currency declines in value, then the bank is in a long position.","a":"False"},{"id":"15-TF-16","t":"TF","q":"If the ratio of tangible equity capital to total assets is 2 percent or less it is subject to being placed in conservatorship or receivership if its capital ratios are not increased within a prescribed period of time even if its net worth is still positive.","a":"True"},{"id":"15-TF-17","t":"TF","q":"According to recent research, bank stock prices usually drop within a week after a dividend cut is announced.","a":"True"},{"id":"15-TF-18","t":"TF","q":"Equity notes are considered to be part of Tier 1 capital.","a":"False"},{"id":"15-TF-19","t":"TF","q":"The most important source of thrift capital in terms of dollar volume is common stock (par value).","a":"False"},{"id":"15-TF-20","t":"TF","q":"The daily rate at which robberies have occurred in the U.S. has continued to climb in the 1990s.","a":"False"},{"id":"15-TF-21","t":"TF","q":"One of the reasons to regulate the capital position of banks is to limit the risk of bank failures, especially large bank failures.","a":"True"},{"id":"15-TF-22","t":"TF","q":"Deposits with the Federal Reserve banks are considered to have moderate credit risk and are therefore placed in the 50 percent risk weight category.","a":"False"},{"id":"15-TF-23","t":"TF","q":"The largest component of capital among banks is retained earnings.","a":"False"},{"id":"15-TF-24","t":"TF","q":"VaR models provide a single number which indicates the potential for losses on a portfolio of assets.","a":"True"},{"id":"15-TF-25","t":"TF","q":"VaR models are most successful in assessing potential risk when the assets are non-traded.","a":"False"},{"id":"15-TF-26","t":"TF","q":"Credit risk models will probably not be needed when Basel II takes effect.","a":"False"},{"id":"15-TF-27","t":"TF","q":"One of the key innovations which have been proposed in Basel II is to require banks to hold capital against operational risk.","a":"True"},{"id":"15-TF-28","t":"TF","q":"Basel II will require each bank to determine its own capital requirements based on its own calculated risk exposure.","a":"True"},{"id":"15-TF-29","t":"TF","q":"It is anticipated that Basel II may lower capital requirements for the largest banks.","a":"True"},{"id":"15-TF-30","t":"TF","q":"The global financial crisis of 2007-2009 highlighted the importance of taking into consideration a bank’s exposure to market risk that arise from changes in interest rates, security prices, and currency.","a":"True"},{"id":"15-TF-31","t":"TF","q":"Smaller banks rely more heavily on internally generated capital than larger banks.","a":"True"},{"id":"15-TF-32","t":"TF","q":"A well-capitalized institution has a ratio of capital to risk-weighted assets of at least 10 percent and faces no significant regulatory restrictions on its expansion.","a":"True"},{"id":"15-TF-33","t":"TF","q":"Regulatory capital focus on the market value of equity.","a":"False"},{"id":"15-MC-1","t":"MC","q":"According to the textbook the role of capital is to:","a":"E","o":[["A","Provide a cushion against failure risk."],["B","Provide funds needed to organize, open, and operate a bank."],["C","Promote public confidence"],["D","Support growth and the development of new services"],["E","All of the above."]]},{"id":"15-MC-2","t":"MC","q":"The textbook discusses several alternative defenses banks have against risk. These defenses include:","a":"E","o":[["A","Quality management"],["B","Portfolio diversification"],["C","Geographic diversification"],["D","Deposit insurance"],["E","All of the above."]]},{"id":"15-MC-3","t":"MC","q":"Measured by dollar volume the largest category of capital at U.S. banks is:","a":"C","o":[["A","Par value of common stock"],["B","Subordinated notes and debentures"],["C","Surplus"],["D","Undivided profits and capital reserves"],["E","None of the above."]]},{"id":"15-MC-4","t":"MC","q":"The fundamental purposes of regulating bank capital cited in the textbook include which of the following?","a":"D","o":[["A","To limit the risk of bank failures."],["B","To preserve public confidence in banks."],["C","To limit losses to the federal government arising from insurance claims."],["D","All of the above."],["E","A and B only."]]},{"id":"15-MC-5","t":"MC","q":"The Internal Capital Growth Rate for a bank is a function of which of the following factors?","a":"E","o":[["A","Profit margin."],["B","Asset utilization."],["C","Equity multiplier."],["D","Earnings retention ratio."],["E","All of the above."]]},{"id":"15-MC-6","t":"MC","q":"Possible breakdowns in quality control, inefficiencies in producing and delivering financial services, weather damage, aging or faulty computer systems and simple errors in judgment by bank management illustrate what form of risk faced by banks?","a":"D","o":[["A","Credit risk"],["B","Liquidity risk"],["C","Interest-rate risk"],["D","Operational risk"],["E","None of the above"]]},{"id":"15-MC-7","t":"MC","q":"The ratio of core capital to average assets is called the:","a":"B","o":[["A","Supplemental Capital ratio"],["B","Leverage ratio"],["C","Long-term capital ratio"],["D","GAAP capital ratio"],["E","None of the above."]]},{"id":"15-MC-8","t":"MC","q":"The risk that a customer the bank has entered into a contract with will fail to pay or to perform, forcing the bank to find a replacement contract that may be less satisfactory is what form of risk listed below?","a":"A","o":[["A","Counterparty risk"],["B","Interest-rate risk"],["C","Operating risk"],["D","Credit risk"],["E","Liquidity risk"]]},{"id":"15-MC-9","t":"MC","q":"If a bank benefits when a foreign currency declines in value, then the bank must be in a __________ position. The term below that correctly fills in the blank in the preceding sentence is:","a":"B","o":[["A","Long"],["B","Short"],["C","Negative"],["D","Credit risk"],["E","None of the above"]]},{"id":"15-MC-10","t":"MC","q":"In the United States a 'well capitalized' bank must have a ratio of capital to risk-weighted assets of at least:","a":"C","o":[["A","6 percent"],["B","8 percent"],["C","10 percent."],["D","5 percent."],["E","None of the above"]]},{"id":"15-MC-11","t":"MC","q":"In the United States a bank to be considered 'adequately capitalized' must have a ratio of Tier 1 (or core) capital to risk-weighted assets of at least:","a":"D","o":[["A","8 percent"],["B","6 percent"],["C","10 percent"],["D","4 percent"],["E","None of the above"]]},{"id":"15-MC-12","t":"MC","q":"A \"well capitalized\" bank in the United States must have a leverage ratio of at least:","a":"B","o":[["A","5 percent"],["B","4 percent"],["C","6 percent"],["D","8 percent"],["E","None of the above"]]},{"id":"15-MC-13","t":"MC","q":"Which of the following would be an example of Tier 1 capital?","a":"C","o":[["A","Subordinated debt capital instruments with an original maturity of at least 5 years"],["B","Allowance for loan and lease losses"],["C","Minority interest in the equity accounts of consolidated subsidiaries"],["D","Intermediate term preferred stock"],["E","All of the above"]]},{"id":"15-MC-14","t":"MC","q":"Which of the following would be an example of Tier 2 capital?","a":"A","o":[["A","Subordinated debt capital instruments with an original maturity of at least 5 years"],["B","Undivided profits"],["C","Minority interest in the equity accounts of consolidated subsidiaries"],["D","Qualifying noncumulative preferred stock"],["E","All of the above"]]},{"id":"15-MC-15","t":"MC","q":"Which of the following would be an example of crime risk?","a":"A","o":[["A","A bank manager that embezzles $1,000,000 from the bank"],["B","A bank that loses $500,000 from trading in foreign currencies"],["C","A $1,000,000 loan to a business on which no interest and principal has been collected in 2 years"],["D","A bank manager predicts that interest rates will rise. However interest rates fall causing the bank 's net income to fall by $250,000"],["E","All of the above are examples of crime risk"]]},{"id":"15-MC-16","t":"MC","q":"Which of the following assets fits into the 0 percent risk weight category?","a":"E","o":[["A","Cash"],["B","Deposits at the Federal Reserve"],["C","Treasury Bills"],["D","GNMA mortgage-backed securities"],["E","All of the above fit into the 0 percent risk weight category"]]},{"id":"15-MC-17","t":"MC","q":"A bank that is 'well-capitalized':","a":"A","o":[["A","Faces no significant regulatory restrictions"],["B","Cannot accept broker placed deposits without regulatory approval"],["C","Has limits on dividends and management fees it is allowed to pay and limits on the maximum asset growth rate among other restrictions"],["D","Will be placed into conservatorship or receivership if it its capital level is not increased within a certain time limit."],["E","None of the above"]]},{"id":"15-MC-18","t":"MC","q":"A bank that is 'critically undercapitalized':","a":"D","o":[["A","Faces no significant regulatory restrictions"],["B","Cannot accept broker-placed deposits without regulatory approval"],["C","Has limits on dividends and management fees it is allowed to pay and limits on the maximum asset growth rate among other restrictions"],["D","Will be placed into conservatorship or receivership if it its capital level is not increased within a certain time limit."],["E","None of the above"]]},{"id":"15-MC-19","t":"MC","q":"A bank that is adequately capitalized:","a":"B","o":[["A","Faces no significant regulatory restrictions"],["B","Cannot accept broker-placed deposits without regulatory approval"],["C","Has limits on dividends and management fees it is allowed to pay and limits on the maximum asset growth rate among other restrictions"],["D","Will be placed into conservatorship or receivership if it its capital level is not increased within a certain time limit."],["E","None of the above"]]},{"id":"15-MC-20","t":"MC","q":"Which of the following is in the 100 percent risk-weight category?","a":"D","o":[["A","Cash"],["B","General obligation municipal bonds"],["C","Residential mortgage loans"],["D","Credit card loans"],["E","None of the above"]]},{"id":"15-MC-21","t":"MC","q":"Which of the following is in the 50 percent risk-weight (moderate) category?","a":"C","o":[["A","Cash"],["B","General Obligation Municipal Bonds"],["C","Residential Mortgage Loans"],["D","Credit Card Loans"],["E","None of the above"]]},{"id":"15-MC-22","t":"MC","q":"Which of the following is in the 20 percent risk-weight (low) category?","a":"B","o":[["A","Cash"],["B","General obligation municipal bonds"],["C","Residential mortgage loans"],["D","Credit card loans"],["E","None of the above"]]},{"id":"15-MC-23","t":"MC","q":"The revised Basel I rules impose capital requirements for market risk on:","a":"A","o":[["A","Only the largest banks"],["B","Only the smallest banks"],["C","Only moderate size banks"],["D","All banks"],["E","No banks"]]},{"id":"15-MC-24","t":"MC","q":"Bank debt which appears to be highly sensitive to the market perception of the bank's risk is which of the following?","a":"D","o":[["A","Deposits"],["B","Fed funds"],["C","Repos"],["D","Subordinated debt capital"],["E","Preferred stock"]]},{"id":"15-MC-25","t":"MC","q":"Bank operational risk includes:","a":"E","o":[["A","Employee fraud"],["B","Account errors"],["C","Computer breakdowns"],["D","Natural disasters"],["E","All of the above"]]},{"id":"15-MC-26","t":"MC","q":"The issue of correctly adding up all of the different types of bank risk exposure is known as:","a":"C","o":[["A","Risk tallying"],["B","Summing risk"],["C","Risk aggregation"],["D","Risk accumulation"],["E","Risk totality"]]},{"id":"15-MC-27","t":"MC","q":"For a bank with deficient capital ratios, which of the following actions could be required by regulators to increase the capital ratios, all else constant?","a":"A","o":[["A","Cut the bank's dividend payment"],["B","Increase the bank's leverage"],["C","Reduce the bank’s holdings of cash"],["D","Increase the bank's growth rate by making additional commercial loans."],["E","Reduce the bank's holdings of Treasury securities."]]},{"id":"15-MC-28","t":"MC","q":"Basel II has a different set of rules for different bank size categories and the number of categories is:","a":"A","o":[["A","two"],["B","three"],["C","four"],["D","five"],["E","ten"]]},{"id":"15-MC-29","t":"MC","q":"Which of the following would be an example of exchange risk?","a":"B","o":[["A","A bank manager embezzles $1,000,000 from the bank"],["B","A bank that loses $500,000 from trading in foreign currencies"],["C","A $1,000,000 loan to a business on which no interest or principal has been collected in 2 years"],["D","A bank manager predicts interest rates will rise. However interest rates fall causing the bank’s net income to fall by $250,000"],["E","All of the above are examples of exchange risk"]]},{"id":"15-MC-30","t":"MC","q":"Which of the following would be an example of credit risk?","a":"C","o":[["A","A bank manager embezzles $1,000,000 from the bank"],["B","A bank that loses $500,000 from trading in foreign currencies"],["C","A $1,000,000 loan to a business on which no interest or principal has been collected in 2 years"],["D","A bank manager predicts interest rates will rise. However interest rates fall causing the bank’s net income to fall by $250,000"],["E","All of the above are examples of credit risk"]]},{"id":"15-MC-31","t":"MC","q":"Which of the following would be an example of interest rate risk?","a":"D","o":[["A","A bank manager embezzles $1,000,000 from the bank"],["B","A bank that loses $500,000 from trading in foreign currencies"],["C","A $1,000,000 loan to a business on which no interest or principal has been collected in 2 years"],["D","A bank manager predicts interest rates will rise. However interest rates fall causing the bank’s net income to fall by $250,000"],["E","All of the above are examples of interest rate risk?"]]},{"id":"15-MC-32","t":"MC","q":"Which of the following would be an example of operational risk?","a":"B","o":[["A","A bank teller manages to steal $250,000 over a period of several months"],["B","An out of date computer system causes the bank to lose $750,000"],["C","A bank is forced to sell $1,000,000 in loans at a loss in order to meet the needs of depositors"],["D","A $500,000 loan the bank has made has been deemed uncollectable"],["E","None of the above are examples of operational risk"]]},{"id":"15-MC-33","t":"MC","q":"Which of the following would be an example of liquidity risk?","a":"C","o":[["A","A bank teller manages to steal $250,000 over a period of several months"],["B","An out of date computer system causes the bank to lose $750,000"],["C","A bank is forced to sell $1,000,000 in loans at a loss in order to meet the needs of depositors"],["D","A $500,000 loan the bank has made has been deemed uncollectable"],["E","None of the above are examples of liquidity risk"]]},{"id":"15-MC-34","t":"MC","q":"Which of the following would not be an example of operational risk?","a":"D","o":[["A","A bank on the coast of Louisiana is hit by a hurricane and is flooded for 6 weeks"],["B","A bank employee acting as a derivatives trader is also the one who writes the reports on profits and losses in derivatives trading at the end of each day"],["C","The banks older computer system breaks down causing a loss of service to customers for 2 weeks"],["D","A bank robber robs a teller at gun point and gets away before police can get to the bank"],["E","All of the above are examples of operational risk"]]},{"id":"15-MC-35","t":"MC","q":"The Jennings Bank of Texas wants to protect itself from credit risk by making large loans to corporate customers, by making residential mortgages to families, by making agriculture loans to farmers and ranchers in the area, by making small business loans to business along main street and by making automobile loans for the car dealership across the street from the bank. What defense against risk is this bank making?","a":"A","o":[["A","Portfolio diversification"],["B","Geographic diversification"],["C","Quality management"],["D","Increasing owners’ capital"],["E","All of the above"]]},{"id":"15-MC-36","t":"MC","q":"The Michelson Bank of Stetson wants to protect itself from risk. It decides to make loans in Florida, Georgia, Texas and Oklahoma as well as invest in municipal bonds from California and Oregon. What defense against risk is this bank making?","a":"B","o":[["A","Portfolio diversification"],["B","Geographic diversification"],["C","Quality management"],["D","Increasing owners’ capital"],["E","All of the above"]]},{"id":"15-MC-37","t":"MC","q":"The Perdue Bank of Houston has just hired a new manager who has a reputation of anticipating potential problems and acting quickly to prevent those problems so that the bank stays healthy and profitable. What defense against risk is this bank making?","a":"C","o":[["A","Portfolio diversification"],["B","Geographic diversification"],["C","Quality management"],["D","Increasing owners’ capital"],["E","All of the above"]]},{"id":"15-MC-38","t":"MC","q":"The Norton Bank of Illinois has just issued trust preferred stock. What defense against risk is this bank making?","a":"D","o":[["A","Portfolio diversification"],["B","Geographic diversification"],["C","Quality management"],["D","Increasing owners’ capital"],["E","All of the above"]]},{"id":"15-MC-39","t":"MC","q":"What type of preferred stock has become popular among large banks in recent years, partly because dividends paid are tax deductible for the issuing institution?","a":"D","o":[["A","Cumulative preferred stock"],["B","Noncumulative preferred stock"],["C","Convertible preferred stock"],["D","Trust preferred stock"],["E","All of the above"]]},{"id":"15-MC-40","t":"MC","q":"Even if individual banks are good at forecasting risk using VAR models there may still be problems because losses may occur at several banks at the same time due to the interdependency of the financial system, magnifying each bank’s risk exposure and possibly causing a major problem for regulators. The book calls this:","a":"A","o":[["A","Systematic risk"],["B","Operational risk"],["C","Credit risk"],["D","Market risk"],["E","Liquidity risk"]]},{"id":"15-MC-41","t":"MC","q":"There are three pillars of Basel II. One of them wants to make market discipline a powerful force compelling risky banks to lower their risk exposure. What does Basel II want to do to make this happen?","a":"B","o":[["A","Require minimum capital requirement based on the bank’s own evaluation of its risk"],["B","Require greater public disclosure of each bank’s true financial condition"],["C","Expand the risks to be evaluated to include credit risk, market risk and operational risk"],["D","Require supervisory review of each bank’s risk evaluation procedures"],["E","All of the above"]]},{"id":"15-MC-42","t":"MC","q":"Which of the following is not a weakness of Basel I risk-based capital standards?","a":"D","o":[["A","They ignore interest rate risk"],["B","They ignore changes in value due to currency value changes"],["C","They ignore changes in value due to commodity price changes"],["D","They ignore credit risk"],["E","They ignore the market value"]]},{"id":"15-MC-43","t":"MC","q":"A bank has decided to retain more of their earnings, moving their retention ratio from 40% to 70%. What way of meeting their capital needs is the bank taking?","a":"A","o":[["A","Changing their dividend policy"],["B","Issuing common stock"],["C","Issuing preferred stock"],["D","Issuing subordinated notes and debentures"],["E","Selling assets and leasing facilities"]]},{"id":"15-MC-44","t":"MC","q":"The First National Bank of Tucson has determined that the value of their property in Tucson has tripled in the last three years. They decide that they would like to use this property to raise funds and will rent space from the new owners of the building. What way of meeting their capital needs is the bank taking?","a":"D","o":[["A","Issuing common stock"],["B","Issuing preferred stock"],["C","Issuing subordinated notes and debentures"],["D","Selling assets and leasing facilities"],["E","Swapping stock for debt instruments"]]},{"id":"15-MC-45","t":"MC","q":"The Second National Bank of Lincoln has decided that to raise funds it is going to issue new common equity through a pre-emptive rights offering so that current owners will not have that ownership diluted. What way of meeting their capital needs is the bank taking?","a":"A","o":[["A","Issuing common stock"],["B","Issuing preferred stock"],["C","Issuing subordinated notes and debentures"],["D","Selling assets and leasing facilities"],["E","Swapping stock for debt instruments"]]},{"id":"15-MC-46","t":"MC","q":"The Third State Bank of Denton has decided to issue stock through a trust company and borrow the funds from the trust company. This stock pays a fixed dividend and because of the way the stock has been issued it is tax deductible. What way of meeting their capital needs in the bank taking?","a":"B","o":[["A","Issuing common stock"],["B","Issuing preferred stock"],["C","Issuing subordinated notes and debentures"],["D","Selling assets and leasing facilities"],["E","Swapping stock for debt instruments"]]},{"id":"15-MC-47","t":"MC","q":"The Northwest Bank of Charlotte has decided to issue new securities that have five years to maturity that have claims to assets that follow the claims of depositors. What way of meeting their capital needs is the bank taking?","a":"C","o":[["A","Issuing common stock"],["B","Issuing preferred stock"],["C","Issuing subordinated notes and debentures"],["D","Selling assets and leasing facilities"],["E","Swapping stock for debt instruments"]]},{"id":"15-MC-48","t":"MC","q":"Why do regulators prefer higher capital requirements?","a":"B","o":[["A","It justifies the existence of regulatory agencies"],["B","It better protects the deposit insurance fund"],["C","It enhances bank asset quality"],["D","It decreases bank profitability"],["E","It increases bank leverage"]]},{"id":"15-MC-49","t":"MC","q":"Why do banks generally prefer lower capital requirements?","a":"C","o":[["A","To minimize the impact shareholders have on management decisions"],["B","To increase the influence of bank regulators"],["C","To increase a bank’s return on equity"],["D","To increase depositor protection"],["E","To maximize operating leverage"]]},{"id":"15-MC-50","t":"MC","q":"Which of the following are the reasons for having the government set capital standards for financial institutions as opposed to letting the private marketplace set those standards?","a":"D","o":[["A","To preserve public confidence"],["B","To alleviate market imperfections arising from the mispriced effect of systemic failures"],["C","To limit losses to the federal government arising from deposit insurance claims"],["D","All of the above"],["E","None of the above"]]},{"id":"15-MC-51","t":"MC","q":"The following are the advantages of Basel II over Basel I except:","a":"C","o":[["A","Uses “bifurcated” system that takes into consideration differences in risk exposures by bank size"],["B","Provides for greater sensitivity to arbitrage and financial innovations"],["C","Applies the same minimum capital requirements to all banks"],["D","Broadens the types of risk considered"],["E","All of the above are the advantages of using Basel II"]]}]},{"ch":16,"title":"Lending Policies and Procedures: Managing Credit Risk","items":[{"id":"16-TF-1","t":"TF","q":"The principal reason banks are chartered by federal and state governments is to make loans to their customers.","a":"True"},{"id":"16-TF-2","t":"TF","q":"Risk in banking tends to be concentrated in a bank’s loan portfolio.","a":"True"},{"id":"16-TF-3","t":"TF","q":"The largest banks have, on average, reduced their dependence on real estate loans relative to smaller banks.","a":"True"},{"id":"16-TF-4","t":"TF","q":"Real estate lending is popular with bank, in part, due to the growth of the secondary mortgage market.","a":"True"},{"id":"16-TF-5","t":"TF","q":"Banks in the United States are, on average, examined at least once every three years.","a":"True"},{"id":"16-TF-6","t":"TF","q":"Smaller banks tend to emphasize wholesale banking services.","a":"False"},{"id":"16-TF-7","t":"TF","q":"Retail credit in banking refers to such loans as residential mortgages and installment loans to individuals.","a":"True"},{"id":"16-TF-8","t":"TF","q":"Loans made by a particular bank secured by the bank’s own stock are not usually permitted except under special circumstance
