<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NHTM2 · Ôn thi Test Bank</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f6fc;--card:#fff;--ink:#242b45;--mut:#6b7494;--pri:#7466ee;--pri2:#ece9ff;--ok:#1f9d76;--ok2:#dcf6ec;--bad:#d9455f;--bad2:#fde3ea;--warn:#c77a2b;--warn2:#fff0e0;--line:#e4e8f4;--sh:0 6px 20px rgba(80,90,150,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15182a;--card:#1f2339;--ink:#e8ebf7;--mut:#99a1c4;--pri:#9c90ff;--pri2:#2b2a52;--ok:#4fd1a5;--ok2:#17352f;--bad:#ff7a93;--bad2:#3b1f2a;--warn:#ffb36b;--warn2:#3a2c1c;--line:#2d3250;--sh:0 6px 20px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#15182a;--card:#1f2339;--ink:#e8ebf7;--mut:#99a1c4;--pri:#9c90ff;--pri2:#2b2a52;--ok:#4fd1a5;--ok2:#17352f;--bad:#ff7a93;--bad2:#3b1f2a;--warn:#ffb36b;--warn2:#3a2c1c;--line:#2d3250;--sh:0 6px 20px rgba(0,0,0,.3)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:84px}
main{max-width:760px;margin:0 auto;padding:14px}
h1,h2,h3{margin:0;line-height:1.25}
h2{font-size:18px;margin:18px 0 10px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}
.bar{height:9px;background:var(--pri2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:9px;transition:width .4s}
.bar.g i{background:var(--ok)}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:9px 14px;background:var(--pri);color:#fff;cursor:pointer;min-height:40px}
.btn.s{background:var(--pri2);color:var(--pri)}
.btn.d{background:var(--bad2);color:var(--bad)}
.btn.sm{padding:6px 11px;min-height:34px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--pri2);color:var(--pri)}
.tag.ok{background:var(--ok2);color:var(--ok)}.tag.bad{background:var(--bad2);color:var(--bad)}.tag.w{background:var(--warn2);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;text-align:center}
.stats b{display:block;font-size:19px}
.hero{display:flex;gap:12px;align-items:center}
.mas{font-size:44px;line-height:1}
.opt{display:flex;gap:10px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 13px;margin-top:8px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--pri)}
.opt b{flex:none;width:26px;height:26px;border-radius:8px;background:var(--pri2);color:var(--pri);display:grid;place-items:center;font-size:13px}
.opt.sel{border-color:var(--pri);background:var(--pri2)}
.opt.ok{border-color:var(--ok);background:var(--ok2)}.opt.bad{border-color:var(--bad);background:var(--bad2)}
.q{font-size:17px;font-weight:500;margin:10px 0 4px}
.fb{margin-top:12px;padding:12px;border-radius:14px}
.fb.ok{background:var(--ok2)}.fb.bad{background:var(--bad2)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;max-width:120px;font:inherit;font-size:11px;font-weight:600;color:var(--mut);background:none;border:0;border-radius:12px;padding:5px 2px;cursor:pointer;position:relative}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--pri);background:var(--pri2)}
nav em{position:absolute;top:0;right:14%;background:var(--bad);color:#fff;font-style:normal;font-size:10px;border-radius:9px;padding:0 5px}
textarea{width:100%;min-height:130px;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink)}
select,input[type=number]{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;font-weight:600;border:2px solid var(--line);background:var(--card);color:var(--mut);border-radius:99px;padding:4px 12px;cursor:pointer}
.chip.on{border-color:var(--pri);background:var(--pri2);color:var(--pri)}
.day{padding:8px 10px;border-radius:12px;background:var(--bg);margin-top:6px;font-size:13px}
.day.now{outline:2px solid var(--pri)}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:13px;z-index:9;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92vw;text-align:center}
#toast.on{opacity:1}
.wi{border-top:1px solid var(--line);padding:12px 0}
.wi:first-child{border-top:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast"></div>
<nav id="nav"></nav>
<script>
const D={"chapters":[{"ch":1,"title":"An Overview of the Changing Financial-Services Sector","items":[{"id":"1-TF-1","t":"TF","q":"Nonbank banks can offer deposits to the public, but these deposits are not eligible for insurance coverage by the FDIC.","a":"False"},{"id":"1-TF-2","t":"TF","q":"The etymological roots of the word \"bank\" trace this word back to an Italian term referring to a \"money-changer's table\".","a":"True"},{"id":"1-TF-3","t":"TF","q":"According to the textbook, banks are those financial institutions that today offer the widest range of financial services of any business firm in the economy.","a":"True"},{"id":"1-TF-4","t":"TF","q":"According to the delegated monitoring theory banks are able to attract borrowing customers because they pledge confidentiality.","a":"True"},{"id":"1-TF-5","t":"TF","q":"Managing the financial affairs and property of individuals and business firms falls under the type of banking service line known as cash management services.","a":"False"},{"id":"1-TF-6","t":"TF","q":"The role performed by banks in the economy in which they transform savings into credit is known as the intermediation role.","a":"True"},{"id":"1-TF-7","t":"TF","q":"The role performed by banks in which they stand behind their customers when those customers are unable to pay a debt obligation is known as the guarantor role.","a":"True"},{"id":"1-TF-8","t":"TF","q":"When banks serve as conduits for government policy this is referred to as their agency role.","a":"False"},{"id":"1-TF-9","t":"TF","q":"According to the textbook, high-volume banking is required to make efficient use of automation and other technological innovations.","a":"True"},{"id":"1-TF-10","t":"TF","q":"The number of independently owned banks has risen in the United States over the last decade.","a":"False"},{"id":"1-TF-11","t":"TF","q":"Money-center banks usually service local communities, towns, and cities, offering a narrow menu of services to the public.","a":"False"},{"id":"1-TF-12","t":"TF","q":"A greater proportion of major corporations have deserted the banking system in recent years to raise borrowed funds directly from the open market.","a":"True"},{"id":"1-TF-13","t":"TF","q":"The recent erosion of the banking market share relative to other financial institutions means that banking is a dying industry.","a":"False"},{"id":"1-TF-14","t":"TF","q":"Lending institutions act as delegated monitors and can diversify and reduce their risk exposure, resulting in increased safety for savers’ funds.","a":"True"},{"id":"1-TF-15","t":"TF","q":"Current theory suggests that banks exist because of imperfections in our financial system.","a":"True"},{"id":"1-TF-16","t":"TF","q":"Today U.S. banks account for approximately fifty percent of the largest banks in the world.","a":"False"},{"id":"1-TF-17","t":"TF","q":"According to the textbook, traditional banking may be on the decline.","a":"True"},{"id":"1-TF-18","t":"TF","q":"Convergence refers to the fact that the number of bank mergers has increased in recent years.","a":"False"},{"id":"1-TF-19","t":"TF","q":"Banks which offer virtually all financial services are known as universal banks.","a":"True"},{"id":"1-TF-20","t":"TF","q":"Life insurance companies, securities firms, and mortgage companies all compete with the traditional bank.","a":"True"},{"id":"1-MC-1","t":"MC","q":"E. F. Hutton, J.C. Penney, and Sears Roebuck are among leading firms that in the1980’s organized competitors with banks that are known as:","a":"A","o":[["A","Nonbank Banks"],["B","Discount Security Brokerage Companies"],["C","Money Market Funds"],["D","Finance Companies"],["E","Investment Banking Units"]]},{"id":"1-MC-2","t":"MC","q":"A study of history shows that one of the first services offered by banks was:","a":"B","o":[["A","Equipment Leasing"],["B","Currency Exchange"],["C","Security Brokerage and Underwriting"],["D","Sale of Real Estate"],["E","None of the above"]]},{"id":"1-MC-3","t":"MC","q":"Banks perform the indispensable task of:","a":"C","o":[["A","Creating money without making loan."],["B","Absorbing the excess liquidity created by other financial institutions"],["C","Intermediating between surplus-spending individuals or institutions and deficit-spending individuals or institutions"],["D","Issuing risky deposits"],["E","None of the above"]]},{"id":"1-MC-4","t":"MC","q":"The view that depositors hire banks to analyze the financial condition of prospective borrowers and continually evaluate the condition of outstanding loans is referred to as:","a":"A","o":[["A","Delegated monitoring"],["B","The concept of financial intermediation"],["C","The liquidity function in banking"],["D","Market imperfection theory"],["E","The efficiency contribution of banking"]]},{"id":"1-MC-5","t":"MC","q":"Which of the following has been an important trend regarding consolidation and geographic expansion in banks?","a":"E","o":[["A","Increased bank branching activity"],["B","The formation of more holding companies to purchase smaller banks"],["C","Mergers among some of the largest banks in the industry"],["D","A and C above"],["E","All of the above."]]},{"id":"1-MC-6","t":"MC","q":"Included among leading structural trends in the U.S. banking industry in recent years are:","a":"E","o":[["A","The number of independently owned banks has declined"],["B","The average size of individual banking firms has increased"],["C","Entry across state lines from neighboring states has increased"],["D","A and B only"],["E","All of the above."]]},{"id":"1-MC-7","t":"MC","q":"Smaller, locally focused commercial and savings banks that offer narrower but more personalized menu of financial services are known as:","a":"B","o":[["A","Money center banks"],["B","Community banks"],["C","Mutual Funds"],["D","State banks"],["E","Fringe banks."]]},{"id":"1-MC-8","t":"MC","q":"The banking services that includes executing buy and sell orders for security trading customers and marketing new securities to raise funds for corporations and other institutions is referred to:","a":"C","o":[["A","Comprehensive Packaging"],["B","Wrap-around Accounts"],["C","Investment Banking"],["D","Professional Banking"],["E","None of the above."]]},{"id":"1-MC-9","t":"MC","q":"A bank that wires funds for the purchase of a beach house in South Carolina for a customer in Oklahoma is carrying out the __________ of banks.","a":"B","o":[["A","The intermediation role"],["B","The payment role"],["C","The guarantor role"],["D","The agency role"],["E","The policy role"]]},{"id":"1-MC-10","t":"MC","q":"Examples of imperfections in the financial system which allow banks to exist include which of the following?","a":"A","o":[["A","Informational asymmetry"],["B","Efficiency of markets"],["C","All individuals and businesses have full information about all investment opportunities."],["D","All individuals and businesses have no difficulty meeting their liquidity needs on their own."],["E","All of the above are examples of the imperfections that exist."]]},{"id":"1-MC-11","t":"MC","q":"A bank which manages the investment portfolio and pays the bills of an elderly customer who is unable to do it for him or herself is carrying out the __________ of banks.","a":"D","o":[["A","The intermediation role"],["B","The payment role"],["C","The guarantor role"],["D","The agency role"],["E","The policy role"]]},{"id":"1-MC-12","t":"MC","q":"Which of the following is a trend that has affected all banks today?","a":"D","o":[["A","Increased isolation of banks in the U.S."],["B","Decreased competition from other financial institutions"],["C","Decreased amount of services provided by modern banks"],["D","Rising funding costs"],["E","Increased regulations"]]},{"id":"1-MC-13","t":"MC","q":"Which of the following is not a current trend in the banking industry?","a":"B","o":[["A","The number of banks is declining"],["B","The number of bank branches is declining"],["C","The number of bank services is increasing"],["D","The number of bank competitors is increasing"],["E","Bank industry convergence"]]},{"id":"1-MC-14","t":"MC","q":"Which of the following types of banks would most likely offer the largest number of financial services?","a":"D","o":[["A","A retail bank"],["B","A community bank"],["C","A commercial bank"],["D","A universal bank"],["E","An international bank"]]},{"id":"1-MC-15","t":"MC","q":"The phenomenon of convergence refers to:","a":"A","o":[["A","Financial service firms expanding into other product lines"],["B","Firms reducing their product lines"],["C","Bank merger activity"],["D","Globalization in banking"],["E","Technological innovation in banking"]]},{"id":"1-MC-16","t":"MC","q":"Bank equipment leasing activity involves:","a":"B","o":[["A","A bank leasing its office facilities instead of buying"],["B","A bank buying equipment and then leasing the item to a customer"],["C","A customer buying equipment and then leasing it to a bank"],["D","A bank leasing computer equipment"],["E","None of the above"]]},{"id":"1-MC-17","t":"MC","q":"Wholesale banks are those banks that:","a":"D","o":[["A","Sell at a discount relative to all commercial banks"],["B","Only make loans to the wholesale industry"],["C","Lend almost exclusively to farmers"],["D","Are large banks which serve corporations and government"],["E","Have only retail customers"]]},{"id":"1-MC-18","t":"MC","q":"Jonathan Robbins has an account in a bank that does not have a physical branch. Jonathan does all of his banking business over the internet. What type of bank does Jonathan have his account at?","a":"A","o":[["A","Virtual Bank"],["B","Mortgage Bank"],["C","Community Bank"],["D","Affiliated Bank"],["E","None of the above"]]},{"id":"1-MC-19","t":"MC","q":"The Edmond National Bank serves only the City of Edmond, Oklahoma and concentrates on providing the best possible service to this city. What type of bank is this most likely to be?","a":"C","o":[["A","Virtual Bank"],["B","Mortgage Bank"],["C","Community Bank"],["D","Affiliated Bank"],["E","None of the above"]]},{"id":"1-MC-20","t":"MC","q":"The Charleston Southern Bank makes loans for families to purchase new and existing homes but does not take deposits. What type of bank is this most likely to be?","a":"B","o":[["A","Virtual Bank"],["B","Mortgage Bank"],["C","Community Bank"],["D","Affiliated Bank"],["E","None of the above"]]},{"id":"1-MC-21","t":"MC","q":"Which of the following is considered a fringe bank?","a":"D","o":[["A","Community Bank"],["B","Wholesale Bank"],["C","Merchant Bank"],["D","Payday Lender"],["E","None of the above"]]},{"id":"1-MC-22","t":"MC","q":"During the middle ages, banks encountered religious opposition because:","a":"A","o":[["A","Loans to the poor often carried high interest rates"],["B","Loans and deposits were primarily for wealthy customers"],["C","The Industrial Revolution demanded new methods of making payments and obtaining credit"],["D","Savings and wealth were lost due to war, theft and expropriation by governments"],["E","All of the above"]]},{"id":"1-MC-23","t":"MC","q":"Religious opposition decreased during the Renaissance because:","a":"B","o":[["A","Loans to the poor often carried high interest rates"],["B","Loans and deposits were primarily for wealthy customers"],["C","The Industrial Revolution demanded new methods of making payments and obtaining credit"],["D","Savings and wealth were lost due to war, theft and expropriation by governments"],["E","All of the above"]]},{"id":"1-MC-24","t":"MC","q":"Banks like the Medici Bank in Italy and the Hochstetter Bank in Germany were successful because and they responded well to these new needs.","a":"C","o":[["A","Loans to the poor often carried high interest rates"],["B","Loans and deposits were primarily for wealthy customers"],["C","The Industrial Revolution demanded new methods of making payments and obtaining credit"],["D","Savings and wealth were lost due to war, theft and expropriation by governments"],["E","All of the above"]]},{"id":"1-MC-25","t":"MC","q":"Early European banks were places for safekeeping of wealth because:","a":"D","o":[["A","Loans to the poor often carried high interest rates"],["B","Loans and deposits were primarily for wealthy customers"],["C","The industrial revolution demanded new methods of making payments and obtaining credit"],["D","Savings and wealth were lost due to war, theft and expropriation by governments"],["E","All of the above"]]},{"id":"1-MC-26","t":"MC","q":"The U.S. government wants to prevent money laundering by drug cartels. To promote this goal, they have asked banks to report any cash deposits greater than $10,000 to the government. Which of the following roles is the bank performing?","a":"E","o":[["A","The intermediation role"],["B","The payment role"],["C","The risk management role"],["D","The guarantor role"],["E","The policy role"]]},{"id":"1-MC-27","t":"MC","q":"The Edmond Wine and Cheese shop wants to buy 30 cases of French Champagne on credit. Bank of America writes a letter of credit stating that the Edmond Wine and Cheese shop is a good risk and that if they do not pay off the loan, Bank of America will. Which of the following roles is the bank performing?","a":"D","o":[["A","The intermediation role"],["B","The payment role"],["C","The risk management role"],["D","The guarantor role"],["E","The policy role"]]},{"id":"1-MC-28","t":"MC","q":"Alexander Phua goes to his local bank and gets an insurance policy that protects him against loss in case he is in a car accident. Which of the following roles is the bank performing?","a":"C","o":[["A","The intermediation role"],["B","The payment role"],["C","The risk management role"],["D","The guarantor role"],["E","The policy role"]]},{"id":"1-MC-29","t":"MC","q":"Chris Jones gets a cashier’s check from Wachovia Bank to make his down payment on a new home. Which of the following roles is the bank performing?","a":"B","o":[["A","The intermediation role"],["B","The payment role"],["C","The risk management role"],["D","The guarantor role"],["E","The policy role"]]},{"id":"1-MC-30","t":"MC","q":"The Bank, N.A. accepts deposits from thousands of individuals and lends that money to (among others) the Stillwater Body Shop to expand their work bays. Which of the following roles is the bank performing?","a":"A","o":[["A","The intermediation role"],["B","The payment role"],["C","The risk management role"],["D","The guarantor role"],["E","The policy role"]]},{"id":"1-MC-31","t":"MC","q":"Major trends affecting the performance of financial firms today include all of these except:","a":"B","o":[["A","Greater product-line diversification"],["B","Reduced branching"],["C","Geographic diversification"],["D","Convergence"],["E","Increasing automation"]]},{"id":"1-MC-32","t":"MC","q":"The First National Bank of Lakeland makes risky loans to business to expand and grow their businesses while at the same time accepting funds into checking accounts that are insured by the FDIC. Which of the following services is this bank offering to their customers?","a":"A","o":[["A","Risky arbitrage services"],["B","Liquidity services"],["C","Ability of the bank to evaluate information"],["D","Divisibility of money services"],["E","Credit services"]]},{"id":"1-MC-33","t":"MC","q":"Jonathan Wynn knows that if he wanted to purchase a Treasury Bill, the minimum amount he would spend would be close to $10,000. He also knows that he could deposit $1,000 in a money market deposit account at a bank and earn about the same rate of interest. Jonathan does not have $10,000 to invest in a Treasury Bill. If Jonathan puts his money in the bank, which service that a bank can provide is he taking advantage of?","a":"D","o":[["A","Risky arbitrage services"],["B","Liquidity services"],["C","Ability of the bank to evaluate information"],["D","Divisibility of money services"],["E","Credit services"]]},{"id":"1-MC-34","t":"MC","q":"Nick Rodr gets a loan from the First State Bank of Guthrie to purchase a new refrigerator for his condo. What service that a bank provides is he taking advantage of?","a":"E","o":[["A","Risky arbitrage services"],["B","Liquidity services"],["C","Ability of a bank to evaluate information"],["D","Divisibility of money services"],["E","Credit services"]]},{"id":"1-MC-35","t":"MC","q":"Drew Davis goes to his local bank to get help developing a financial plan and making investment decisions. Which of the more recent services banks offer is Drew taking advantage of?","a":"B","o":[["A","Getting a consumer loan"],["B","Getting financial advice"],["C","Managing cash"],["D","Getting venture capital services"],["E","Buying a retirement plan"]]},{"id":"1-MC-36","t":"MC","q":"The Bartholemew Bakery receives a lot of payments in cash. They deposit it in their local bank who invests the money in an interest bearing account until it is needed to pay bills. Which of the financial services banks offer is the Bartholemew bakery taking advantage of?","a":"C","o":[["A","Getting a consumer loan"],["B","Getting financial advice"],["C","Managing cash"],["D","Getting venture capital services"],["E","Buying a retirement plan"]]},{"id":"1-MC-37","t":"MC","q":"MyWebCast is a new company that makes it easy for individuals to create streaming videos on the internet to share with friends and family for a small fee. MyWebCast wants to expand their offerings of video streaming services but needs cash to be able to do this. The Second National Bank of Oklahoma City, through a subsidiary, gives them the cash they need for an ownership share in the company. Which of the more recent services that banks offer is MyWebCast taking advantange of?","a":"D","o":[["A","Getting a consumer loan"],["B","Getting financial advice"],["C","Managing cash"],["D","Getting venture capital services"],["E","Buying a retirement plan"]]},{"id":"1-MC-38","t":"MC","q":"Chandriga Suppiah has opened a Roth IRA with North Carolina State Bank and plans on making regular contributions to this account until she retires. Which of the financial services is Chandriga taking advantage of?","a":"E","o":[["A","Getting a consumer loan"],["B","Getting financial advice"],["C","Managing cash"],["D","Getting venture capital services"],["E","Buying a retirement plan"]]},{"id":"1-MC-39","t":"MC","q":"Banks with less than ___________in assets are generally called community banks.","a":"B","o":[["A","More than $1 billion"],["B","Less than $1 billion"],["C","More than $10 billion"],["D","Less than $1 trillion"],["E","More than $1 trillion"]]},{"id":"1-MC-40","t":"MC","q":"The principal functions and services offered by many financial-service firms today include:","a":"E","o":[["A","Lending and investing money"],["B","Making payments of behalf of customers to facilitate their purchases of goods and services"],["C","Managing and protecting customers’ cash and other property"],["D","Assisting customers in raising and investing funds profitably"],["E","All of the above"]]},{"id":"1-MC-41","t":"MC","q":"Which of the following is considered a depository financial institution?","a":"C","o":[["A","Mortgage company"],["B","Mutual fund"],["C","Savings and Loan associations"],["D","Federal Reserve"],["E","Insurance company"]]},{"id":"1-MC-42","t":"MC","q":"Which of the following is not a purpose of bank regulation:","a":"A","o":[["A","Guarantee minimal profitability of the banking system"],["B","Provide monetary stability"],["C","Ensure safety and soundness of banks"],["D","Provide competitive financial system"],["E","Protect consumers from abuses by banks"]]},{"id":"1-MC-43","t":"MC","q":"During the financial crisis of 2007-2009, the collapse of Lehman Brothers and the bailout of Bear Stearns reaffirmed the importance of the fundamental principle of:","a":"E","o":[["A","Superior management"],["B","Globalization"],["C","Government bailout"],["D","Regulatory arbitrage"],["E","Public trust and confidence in the system"]]}]},{"ch":3,"title":"The Organization and Structure of Banking and the Financial-Services Industry","items":[{"id":"3-TF-1","t":"TF","q":"Bank size is not considered a significant factor in determining how banks are organized.","a":"False"},{"id":"3-TF-2","t":"TF","q":"Nearly three quarters of all U.S. banks exceed $100 million in asset size apiece.","a":"False"},{"id":"3-TF-3","t":"TF","q":"Nearly all U.S. banks with federal or state charters have their deposits insured by the Federal Deposit Insurance Corporation.","a":"True"},{"id":"3-TF-4","t":"TF","q":"State-chartered banks in the United States represent about a quarter of all U.S.-chartered banks, while national banks account for approximately three quarters of all U.S. chartered banks.","a":"False"},{"id":"3-TF-5","t":"TF","q":"The majority of all U.S. banks are members of the Federal Reserve System.","a":"False"},{"id":"3-TF-6","t":"TF","q":"A banking corporation chartered by either federal or state governments that operates only one full-service office is called a unit bank.","a":"True"},{"id":"3-TF-7","t":"TF","q":"Over half of all U.S. states today limit branching activity.","a":"False"},{"id":"3-TF-8","t":"TF","q":"The average U.S. bank is larger in size (in terms of number of branch offices) than the average Canadian bank.","a":"False"},{"id":"3-TF-9","t":"TF","q":"Despite the rapid growth of automation in U.S. banking, there are more full-service branch banking offices than automated teller machines across the whole U.S.","a":"False"},{"id":"3-TF-10","t":"TF","q":"In the United States there are more one-bank holding companies than multi-bank holding companies.","a":"True"},{"id":"3-TF-11","t":"TF","q":"Bank holding companies hold more than 90 percent of the industry’s assets in the United States.","a":"True"},{"id":"3-TF-12","t":"TF","q":"Research evidence suggests that banks taken over by interstate banking organizations have generally increased their market shares over their competitors within the same state and generally are more profitable than their competitors.","a":"False"},{"id":"3-TF-13","t":"TF","q":"The concentration of bank deposits at the local level (that is in urban communities and rural counties) has displayed only moderate changes in recent years.","a":"True"},{"id":"3-TF-14","t":"TF","q":"There is evidence that branch banks charge higher fees for some banking services than do unit banks.","a":"True"},{"id":"3-TF-15","t":"TF","q":"Branch banks tend to offer a wider menu of services than unit banks.","a":"False"},{"id":"3-TF-16","t":"TF","q":"Recent research suggests that branch banks tend to be more profitable than either unit or holding company banks, while interstate banks tend to be the most profitable of all.","a":"False"},{"id":"3-TF-17","t":"TF","q":"Less than 10 percent of the largest banks in the U.S. control almost 90 percent of the industry assets.","a":"True"},{"id":"3-TF-18","t":"TF","q":"Agency theory suggests that bank management will always pursue the goal of maximizing the return of the bank's shareholders.","a":"False"},{"id":"3-TF-19","t":"TF","q":"Recent research suggests that the relationship between bank size and the cost of production per unit is roughly U shaped.","a":"True"},{"id":"3-TF-20","t":"TF","q":"Bank holding companies that want to achieve the goal of risk reduction in earnings risk through interstate banking can achieve the same level of risk reduction by entering any of the fifty states.","a":"False"},{"id":"3-TF-21","t":"TF","q":"Bank holding companies are allowed to own nonbank businesses as long as those businesses offer services closely related to banking.","a":"True"},{"id":"3-TF-22","t":"TF","q":"Banks tend to have a higher proportion of outside directors than a typical manufacturing firm.","a":"True"},{"id":"3-TF-23","t":"TF","q":"Banks which operate entirely on the web are known as invisible banks.","a":"False"},{"id":"3-TF-24","t":"TF","q":"Banks acquired by holding companies are referred to as affiliated banks.","a":"True"},{"id":"3-TF-25","t":"TF","q":"Bank organizational structure has become more complex in recent years.","a":"True"},{"id":"3-TF-26","t":"TF","q":"There are only a very small number of unit banks in the U.S. today.","a":"False"},{"id":"3-TF-27","t":"TF","q":"Traditional brick-and-mortar bank branch offices are on the decline in the U.S. today.","a":"False"},{"id":"3-TF-28","t":"TF","q":"Community banks are usually smaller banks that are devoted principally to the markets for smaller, locally based deposits and loans.","a":"True"},{"id":"3-TF-29","t":"TF","q":"The question of whether financial firms operate as efficiently as possible requires researchers to look into the issue of x-efficiency. The concept requires an assessment of the financial firm’s operating costs in relation to its cost-efficient frontier.","a":"True"},{"id":"3-MC-1","t":"MC","q":"In banking, organizational form follows __________ because banks usually are organized in such a way as to carry out the tasks and supply the services demanded of them. The term that correctly fills in the blank in the sentence above is:","a":"C","o":[["A","Bank size"],["B","Management's decision"],["C","Function"],["D","Regulation"],["E","Location"]]},{"id":"3-MC-2","t":"MC","q":"Which one of the following is charged with setting policy and overseeing a bank's performance?","a":"B","o":[["A","Stockholders"],["B","Board of directors"],["C","Regulators"],["D","Depositors"],["E","None of the above."]]},{"id":"3-MC-3","t":"MC","q":"The largest banks possess some potential advantages over small and medium-size banks, according to the textbook. What specific advantage of the largest banks over small and medium-sized banks is not mentioned in the text?","a":"E","o":[["A","Greater diversification geographically and by product line"],["B","Availability of financial capital at lower cost"],["C","Greater professional expertise to allocate capital to the most promising products and services"],["D","Better positioned to take advantage of the opportunities afforded by interstate banking."],["E","All of the above were mentioned in the text as advantages typically possessed by the largest banks."]]},{"id":"3-MC-4","t":"MC","q":"Before any financial services can be offered to anyone a bank in the United States must have a:","a":"B","o":[["A","Certificate of deposit insurance"],["B","Charter of incorporation"],["C","List of established customers"],["D","New building constructed to be the bank's permanent home"],["E","None of the above."]]},{"id":"3-MC-5","t":"MC","q":"In the United States there are close to __________ commercial banks in operation. Which number shown below is closest to the actual total number of U.S. banks operating in the U.S.?","a":"E","o":[["A","20,500"],["B","13,500"],["C","11,500"],["D","9,000"],["E","7,500"]]},{"id":"3-MC-6","t":"MC","q":"One of the few states that has opted out of interstate banking is:","a":"D","o":[["A","New York"],["B","Ohio"],["C","Texas"],["D","Montana"],["E","None of the above"]]},{"id":"3-MC-7","t":"MC","q":"The concentration of U.S. bank deposits in the hands of the largest banks has _________ during the most recent period,","a":"B","o":[["A","Declined"],["B","Increased"],["C","Remained essentially unchanged"],["D","Exhibited large fluctuations in both directions"],["E","None of above."]]},{"id":"3-MC-8","t":"MC","q":"Bank holding company organizations have several advantages over other types of banking organizations. Among the advantages mentioned in this chapter is:","a":"D","o":[["A","Greater ease of access to capital markets"],["B","Tax advantage"],["C","Product-line diversification"],["D","All of the above."],["E","None of the above."]]},{"id":"3-MC-9","t":"MC","q":"A company which owns the stock of three different banks is known as a(n):","a":"D","o":[["A","Unit Bank"],["B","Interstate Bank"],["C","One Bank Holding Company"],["D","Multi Bank Holding Company"],["E","None of the above"]]},{"id":"3-MC-10","t":"MC","q":"Which of the following is considered an advantage of branch banking?","a":"E","o":[["A","Increased availability and convenience of services"],["B","Decreased chance of failure"],["C","Reduced transaction costs"],["D","B and C above"],["E","All of the above"]]},{"id":"3-MC-11","t":"MC","q":"The types of nonbank businesses a bank holding company can own include which of the following?","a":"B","o":[["A","Retail Computer Store"],["B","Security Brokerage Firm"],["C","Retail Grocery Store"],["D","Wholesale Electronic Distribution Company"],["E","All of the above"]]},{"id":"3-MC-12","t":"MC","q":"A bank which offers its full range of services from only one office is known as a:","a":"A","o":[["A","Unit Bank"],["B","Branch Bank"],["C","Correspondent Bank"],["D","Bank Holding Company"],["E","None of the above"]]},{"id":"3-MC-13","t":"MC","q":"What is a bank holding company?","a":"C","o":[["A","It is a bank that offers all of its services out of one office"],["B","It is a bank that offers all its services out of several offices"],["C","It is a corporation formed to hold the stock of one or more banks"],["D","It is a merchant bank"],["E","None of the above"]]},{"id":"3-MC-14","t":"MC","q":"Which of the following is a type of service a bank holding company is not allowed to own?","a":"C","o":[["A","Merchant banking company"],["B","Savings and loan association"],["C","Retail electronics equipment sales company"],["D","Security brokerage firm"],["E","Insurance agency"]]},{"id":"3-MC-15","t":"MC","q":"In the last decade, the number of banks has __________ and the number of branches has _________.","a":"A","o":[["A","Declined; Increased"],["B","Grown; Increased"],["C","Grown; Decreased"],["D","Declined; Decreased"],["E","Stabilized; Stabilized"]]},{"id":"3-MC-16","t":"MC","q":"Websites known as electronic branches offer all of the following except:","a":"E","o":[["A","Internet banking services"],["B","ATMs"],["C","Point of sales terminals"],["D","Computer and phone services connecting customers"],["E","Traveler's checks"]]},{"id":"3-MC-17","t":"MC","q":"Relative to manufacturing firms, banks tend to have a (the) ___________ number of board members.","a":"B","o":[["A","Same"],["B","Larger"],["C","Smaller"],["D","Unknown"],["E","None of the above"]]},{"id":"3-MC-18","t":"MC","q":"The percentage of unit banks in the U.S. today is approximately:","a":"B","o":[["A","10%"],["B","30%"],["C","50%"],["D","75%"],["E","100%"]]},{"id":"3-MC-19","t":"MC","q":"The ‘typical’ community bank has:","a":"A","o":[["A","$300 million in assets and is located in a smaller city in the Midwest."],["B","$25 billion in assets and is located in a large city in the East"],["C","$100 million in assets and is located in a large city the South"],["D","$10 billion in assets and is located in a small city in the West"],["E","None of the above"]]},{"id":"3-MC-20","t":"MC","q":"The ‘typical’ money center bank has:","a":"B","o":[["A","$250 million in assets and is located in a smaller city in the Midwest"],["B","$25 billion in assets and is located in a large city in the East"],["C","$100 million in assets and is located in a large city in the South"],["D","$10 billion in assets and is located in a small city in the West"],["E","None of the above"]]},{"id":"3-MC-21","t":"MC","q":"The majority of banks today are:","a":"C","o":[["A","Federally chartered"],["B","Uninsured"],["C","State Chartered"],["D","National Banks"],["E","All of the above"]]},{"id":"3-MC-22","t":"MC","q":"‘Member’ banks are:","a":"D","o":[["A","Members of the FDIC"],["B","National Banks"],["C","Unit Banks"],["D","Members of the Federal Reserve"],["E","All of the above"]]},{"id":"3-MC-23","t":"MC","q":"and banks tend to be larger and hold more of the public’s deposits.","a":"A","o":[["A","National and Member"],["B","State and Nonmember"],["C","National and Uninsured"],["D","State and Insured"],["E","None of the above"]]},{"id":"3-MC-24","t":"MC","q":"Which of the following is a reason for the rapid growth in branch banks?","a":"A","o":[["A","Exodus of population from cities to suburban areas"],["B","Bank convergence"],["C","Business failures"],["D","Decreased costs of brick and mortar"],["E","All of the above"]]},{"id":"3-MC-25","t":"MC","q":"When a bank holding company acquires a nonbank business it must be approved by:","a":"C","o":[["A","The FDIC"],["B","The Comptroller of the Currency"],["C","The Federal Reserve"],["D","The President of the U.S."],["E","All of the above"]]},{"id":"3-MC-26","t":"MC","q":"Many financial experts believe that the customers most likely to be damaged by decreased competition include:","a":"B","o":[["A","Large corporations in large cities"],["B","Households and business in smaller cities and towns"],["C","Households that earn more than a billion dollars a year"],["D","Students away at college"],["E","None of the above"]]},{"id":"3-MC-27","t":"MC","q":"According to Levonian and Rose in order to achieve some reduction in earnings risk, interstate banks must expand into at least:","a":"B","o":[["A","2 states"],["B","4 states"],["C","6 states"],["D","10 states"],["E","25 states"]]},{"id":"3-MC-28","t":"MC","q":"The major competitors of banks have:","a":"A","o":[["A","Fewer but much larger service providers"],["B","Fewer but smaller service providers"],["C","More but smaller service providers"],["D","More but larger service providers"],["E","None of the above"]]},{"id":"3-MC-29","t":"MC","q":"Of the following countries in Europe, which has the largest number of banks?","a":"C","o":[["A","Belgium"],["B","France"],["C","Germany"],["D","Great Britain"],["E","None of the above"]]},{"id":"3-MC-30","t":"MC","q":"Which country’s banks were owned by the state until the 1990’s?","a":"D","o":[["A","Belgium"],["B","France"],["C","Germany"],["D","Italy"],["E","None of the above"]]},{"id":"3-MC-31","t":"MC","q":"When financial service providers offer a range of services including banking, insurance and securities services it is known as:","a":"B","o":[["A","Consolidation"],["B","Convergence"],["C","Economies of scale"],["D","E-Efficiencies"],["E","None of the above"]]},{"id":"3-MC-32","t":"MC","q":"The gradual evolution of markets and institutions such that geographic boundaries do not restrict financial transactions is known as:","a":"D","o":[["A","Deregulation"],["B","Integration"],["C","Re-regulation"],["D","Globalization"],["E","Moral suasion"]]},{"id":"3-MC-33","t":"MC","q":"Banks with less than _______ in assets are generally called community banks.","a":"B","o":[["A","More than $1 billion"],["B","Less than $1 billion"],["C","More than $5 million"],["D","Less than $1 trillion"],["E","More than $1 trillion"]]},{"id":"3-MC-34","t":"MC","q":"Nonbank financial firms that supply insurance coverage to customers borrowing money to guarantee repayment of a loan are referred to as:","a":"E","o":[["A","Merchant Bankers"],["B","Factoring Companies"],["C","Savings Associations"],["D","Investment Bankers"],["E","Credit Insurance Underwriters"]]}]},{"ch":4,"title":"Establishing New Banks, Branches, ATMs, Telephone Services, and Web Sites","items":[{"id":"4-TF-1","t":"TF","q":"One argument frequently presented for regulation and control over bank chartering activity is that banks can create more money than any other financial institution.","a":"True"},{"id":"4-TF-2","t":"TF","q":"State banking commissions, on average, impose tougher standards for chartering new banks than the federal chartering agency, the Comptroller of the Currency.","a":"False"},{"id":"4-TF-3","t":"TF","q":"One of the benefits of applying for a federal banking charter is that banks chartered there need not join the Federal Reserve System.","a":"False"},{"id":"4-TF-4","t":"TF","q":"Getting a bank charter from the Comptroller of the Currency means that the bank will simultaneously apply for FDIC insurance so no duplication of effort occurs.","a":"True"},{"id":"4-TF-5","t":"TF","q":"Most new banks are situated along major routes of travel for commuters going to work or to shopping areas and schools.","a":"True"},{"id":"4-TF-6","t":"TF","q":"\"Public need\" is usually established with federal or state chartering authorities by showing that existing banks in the area are adequately profitable and have satisfactory amounts of capital.","a":"False"},{"id":"4-TF-7","t":"TF","q":"Society pays a price if it restricts the number of bank charters below the number that the private sector normally would generate due to lessened competition.","a":"True"},{"id":"4-TF-8","t":"TF","q":"Most U.S. banks are chartered in urban areas.","a":"True"},{"id":"4-TF-9","t":"TF","q":"The total number of full-service branch offices has declined in the United States in recent years.","a":"False"},{"id":"4-TF-10","t":"TF","q":"Newly designed bank branch offices in recent years have emphasized more heavily effective communication of service options to the customer in an effort to promote service sales.","a":"True"},{"id":"4-TF-11","t":"TF","q":"More desirable bank branch office sites normally have residents who are above-average in age.","a":"True"},{"id":"4-TF-12","t":"TF","q":"Higher levels of savings deposits are usually to be found in those bank branch office locations where there is an above-average proportion of older heads of households and where there is a large proportion of residents who own their own homes.","a":"True"},{"id":"4-TF-13","t":"TF","q":"The optimal choice for a new branch site must be that site that offers the bank the highest expected rate of return on the capital invested in the project.","a":"False"},{"id":"4-TF-14","t":"TF","q":"To close a bank branch office in the United States a bank must give its customers 30 days advance notice.","a":"False"},{"id":"4-TF-15","t":"TF","q":"Bank branch offices are often specially configured today to maximize sales opportunities.","a":"True"},{"id":"4-TF-16","t":"TF","q":"One of the keys to branch office profitability is to apply the latest information technology and thereby lower personnel costs.","a":"True"},{"id":"4-TF-17","t":"TF","q":"Access to a P0S terminal is gained through the use of a credit card.","a":"False"},{"id":"4-TF-18","t":"TF","q":"On-line P0S terminals substantially out-number off-line P0S service systems.","a":"False"},{"id":"4-TF-19","t":"TF","q":"One half of all transactions through an ATM machine are deposits.","a":"False"},{"id":"4-TF-20","t":"TF","q":"The first ATM machine could only handle cash withdrawals.","a":"True"},{"id":"4-TF-21","t":"TF","q":"ATMs are profitable for all banks since they can eliminate tellers at branches that have ATMs.","a":"False"},{"id":"4-TF-22","t":"TF","q":"Research indicates that States with more liberal chartering standards experience a higher rate of bank failures.","a":"False"},{"id":"4-TF-23","t":"TF","q":"More recently the issue of public need has become an increasingly important factor in the granting of bank charters.","a":"False"},{"id":"4-TF-24","t":"TF","q":"In the short-term newly-chartered banks fail at a higher rate than established banks.","a":"False"},{"id":"4-TF-25","t":"TF","q":"The majority of new banks do not become profitable for at least a decade.","a":"False"},{"id":"4-TF-26","t":"TF","q":"The OCC does not charter internet-only banks.","a":"False"},{"id":"4-TF-27","t":"TF","q":"Payment by electronic direct deposit now comprises over 50 percent of all transactions.","a":"False"},{"id":"4-TF-28","t":"TF","q":"When considering possible location for new branches, the expected rate of return is the only decision that management should consider.","a":"False"},{"id":"4-TF-29","t":"TF","q":"The proposed new branch’s negative return correlation with existing branch offices and other assets can serve to lower the overall bank’s riskiness and is an important justification for branch establishment. This is referred to as geographic diversification effect.","a":"True"},{"id":"4-MC-1","t":"MC","q":"One of the benefits of securing a state bank charter instead of a federal bank charter is:","a":"C","o":[["A","It brings added prestige"],["B","It results in the automatic receipt of federal deposit insurance"],["C","It is often able to lend a higher percentage of its capital and surplus to a single borrower"],["D","A state bank must join the Federal Reserve System"],["E","None of the above."]]},{"id":"4-MC-2","t":"MC","q":"One of the benefits of securing a federal (national) bank charter instead of a state bank charter is:","a":"A","o":[["A","Federal rules can pre-empt state laws"],["B","It is generally easier and less costly to secure a federal charter"],["C","It is often able to lend a higher percentage of its capital and surplus to a single borrower"],["D","Lower supervisory fees"],["E","None of the above."]]},{"id":"4-MC-3","t":"MC","q":"The number of bank charters issued annually in the United States has averaged about:","a":"D","o":[["A","1000"],["B","2000"],["C","10"],["D","100"],["E","None of the above"]]},{"id":"4-MC-4","t":"MC","q":"The existence of branch banking in a given state:","a":"B","o":[["A","Encourages more new banks to be chartered"],["B","Discourages some new banks from being chartered"],["C","Results in more bank failures than normal"],["D","Results in lower operating cost per unit of service"],["E","None of the above."]]},{"id":"4-MC-5","t":"MC","q":"Most new banks:","a":"D","o":[["A","Become profitable in the first 3 years of their operation"],["B","Have pro-competitive effects on the markets they enter"],["C","Survive rather than fail"],["D","All of the above are correct"],["E","None of the above are correct."]]},{"id":"4-MC-6","t":"MC","q":"Most new U.S. banks are chartered in:","a":"B","o":[["A","Small communities where there is very little existing competition."],["B","Relatively large urban areas where organizers can earn higher expected rates of return on their investment."],["C","Rural areas where they will be more convenient for customers."],["D","All of the above."],["E","A and C, only."]]},{"id":"4-MC-7","t":"MC","q":"A charter of incorporation to start a new U.S. bank can be issued by:","a":"E","o":[["A","The Office of the Comptroller of the Currency."],["B","The state banking commissions of each state."],["C","The Federal Deposit Insurance Corporation (FDIC)."],["D","All of the above."],["E","A and B, only."]]},{"id":"4-MC-8","t":"MC","q":"Which factor(s) does OCC assess during the application process for a national bank charter?","a":"E","o":[["A","Market demand"],["B","Probably customer base"],["C","Competition and economic conditions"],["D","Risks inherent in the services to be offered to the public"],["E","All of the above"]]},{"id":"4-MC-9","t":"MC","q":"One of the benefits of applying for a federal (national) bank charter over a state charter is:","a":"D","o":[["A","It brings added prestige"],["B","It results in the automatic receipt of federal deposit insurance"],["C","There is better technical support in the event of problems"],["D","A and C above."],["E","All of the above."]]},{"id":"4-MC-10","t":"MC","q":"According to the textbook, the disadvantages of a federal charter include which of the following:","a":"D","o":[["A","Closer supervision of banking activities."],["B","Stricter standards for capital."],["C","More stringent limits on the offering of new services."],["D","All of the above."],["E","B and C only."]]},{"id":"4-MC-11","t":"MC","q":"Key factors that organizers of a proposed new bank use in evaluating their investment opportunity include which of the following?","a":"E","o":[["A","Expected return on bank stock."],["B","Risk to the shareholders."],["C","Demonstrated public need."],["D","Track record of existing banks that serve the same or a similar area."],["E","All of the above."]]},{"id":"4-MC-12","t":"MC","q":"The most desirable sites for full-service bank branch offices usually have which of the following characteristics?","a":"D","o":[["A","Heavy traffic volume"],["B","Large numbers of retail shops and stores"],["C","Above-average age populations"],["D","All of the above."],["E","None of the above."]]},{"id":"4-MC-13","t":"MC","q":"Typically much less costly to build and maintain, costing as little as one-fourth the expense incurred in constructing and operating as a stand-alone branch, and experiencing more traffic flow than conventional branches are:","a":"D","o":[["A","ATMs"],["B","P0S terminals"],["C","ACHs"],["D","In-Store branches"],["E","ALMs"]]},{"id":"4-MC-14","t":"MC","q":"Computer facilities in retail shops and stores that permit a customer to instantly pay for goods and services electronically by deducting the cost of each purchase directly from his or her deposit account are known as:","a":"B","o":[["A","ATMs"],["B","P0S terminals"],["C","ACHs"],["D","In-store branches."],["E","ALMs"]]},{"id":"4-MC-15","t":"MC","q":"A so-called PIN gives a bank customer access to his or her account through a(n):","a":"C","o":[["A","ACH"],["B","Bank-by-mail service"],["C","ATM"],["D","Electronic calculator"],["E","None of the above"]]},{"id":"4-MC-16","t":"MC","q":"Computer terminals which allow customers to make cash withdrawals, check deposit balances and make deposits without dealing with a teller are known as:","a":"A","o":[["A","ATMs"],["B","POS terminals"],["C","ACHs"],["D","In-store branches"],["E","ALMs"]]},{"id":"4-MC-17","t":"MC","q":"Which of the following is one of the common services provided by banks on the internet today?","a":"C","o":[["A","Applying for a loan"],["B","Opening an account"],["C","Making payments (especially recurring utility bills)"],["D","All of the above"],["E","None of the above"]]},{"id":"4-MC-18","t":"MC","q":"In the above problem, the proposed new branch will _______ overall risk exposure and produce a(an) ______ effect. Fill in the appropriate answers.","a":"D","o":[["A","increases; economies of scale"],["B","increases; economies of scope"],["C","reduces; convergence"],["D","reduces; geographic diversification"]]},{"id":"4-MC-19","t":"MC","q":"In the U.S, what is the average population per branch office?","a":"A","o":[["A","4000"],["B","8000"],["C","10,000"],["D","15,000"],["E","None of the above"]]},{"id":"4-MC-20","t":"MC","q":"Which of the following is true concerning branch offices?","a":"C","o":[["A","The number of full service offices in the U.S. have shrunk in recent years."],["B","An ideal location for a new branch bank is one with below average population density"],["C","Branch offices are generally cheaper to establish than chartering a whole new banking corporation"],["D","The decision about whether to establish a new branch is a cash management problem"],["E","All of the above are true"]]},{"id":"4-MC-21","t":"MC","q":"In what merger region of the country do the most newly-chartered banks occur?","a":"B","o":[["A","Northeast"],["B","Southeast"],["C","Midwest"],["D","Southwest"],["E","West"]]},{"id":"4-MC-22","t":"MC","q":"In the short-term newly-chartered banks fail at a (n) __________ rate than established banks.","a":"A","o":[["A","lower"],["B","same"],["C","higher"],["D","extremely higher"],["E","unknown"]]},{"id":"4-MC-23","t":"MC","q":"A group of six investors wants to open a new bank. In their application to the Comptroller of the Currency, they discuss that the community they want to do business in has a median income of $55,000, that there are approximately 75,000 homes in the community and that there is approximately $5.6 million in sales generated in the community on any given day. Which decision factor for seeking a new charter are the investors discussing?","a":"A","o":[["A","The level of economic activity in the community"],["B","The growth of economic activity in the community"],["C","The need for a new financial firm"],["D","The strength and character of the local competition"],["E","None of the above"]]},{"id":"4-MC-24","t":"MC","q":"A group of six investors wants to open a new bank. In their application to the Comptroller of the Currency, they discuss that new housing starts in the area are up 19% from a year ago with an additional 25 families moving into the community every month. School enrollment has also increased 14% from the previous year. Which decision factor for seeking a new charter are the investors discussing?","a":"B","o":[["A","The level of economic activity in the community"],["B","The growth of economic activity in the community"],["C","The need for a new financial firm"],["D","The strength and character of the local competition"],["E","None of the above"]]},{"id":"4-MC-25","t":"MC","q":"A group of six investors want to open a new bank. In their application to the Comptroller of the Currency, they discuss that the population per banking office is up to 6,000. In addition, growth in the community is to the west of town and there is only one bank serving that part of the community and a new housing subdivision has just started in this part of town that should include 350 new homes. Which decision factor for seeking a new charter are the investors discussing?","a":"C","o":[["A","The level of economic activity in the community"],["B","The growth of economic activity in the community"],["C","The need for a new financial firm"],["D","The strength and character of the local competition"],["E","None of the above"]]},{"id":"4-MC-26","t":"MC","q":"A group of six investors wants to open a new bank. In their application to the Comptroller of the Currency, they discuss that there are six banks already in the community and that the largest of these has just acquired one of the smaller banks. These six banks do a moderate amount of advertising in the community. There is also one credit union that has one office and a savings bank that has two branches on the east side of town. Growth in the community is to the west. Which decision factor for seeking a new charter are the investors discussing?","a":"D","o":[["A","The level of economic activity in the community"],["B","The growth of economic activity in the community"],["C","The need for a new financial firm"],["D","The strength and character of the local competition"],["E","None of the above"]]},{"id":"4-MC-27","t":"MC","q":"A group of six investors wants to open a new bank in the community of Edmond, Oklahoma. They have submitted their application to the Comptroller of the Currency. What type of bank would they be if their application is approved?","a":"C","o":[["A","A state, member bank"],["B","A state, insured bank"],["C","A national bank"],["D","A national bank without FDIC insurance"],["E","None of the above"]]},{"id":"4-MC-28","t":"MC","q":"Which of the following would not be a telephone service a customer could get from a bank call center?","a":"D","o":[["A","The current balance on their account"],["B","A fax copy of a loan application for the bank"],["C","A Verification of what transactions have passed through the account"],["D","Access to their safety deposit box"],["E","All of the above are telephone services a customer could get from a bank call center"]]},{"id":"4-MC-29","t":"MC","q":"What categories do authentication factors generally fall in?","a":"D","o":[["A","Something a customer knows"],["B","Something a customer has"],["C","Something a customer is"],["D","All of the above"],["E","None of the above"]]},{"id":"4-MC-30","t":"MC","q":"The Jones State Bank is thinking about adding a branch office on the west side of Edmond, Oklahoma. Growth of new homes in the area has averaged 15% per year over the last five years and is expected to continue at that rate in the future. Which factor would this address when considering whether to add a new branch?","a":"E","o":[["A","Traffic count"],["B","Number of retail shops"],["C","Average age of the local population"],["D","Population Density"],["E","Population Growth"]]},{"id":"4-MC-31","t":"MC","q":"The Jones State Bank is thinking about adding a branch office on the west side of Edmond, Oklahoma. Jones State Bank has done a study and found that the site where they want to build sees 35,000 cars pass in an average day. Which factor would this address when considering whether to add a new branch?","a":"A","o":[["A","Traffic count"],["B","Number of retail shops"],["C","Average age of the local population"],["D","Population Density"],["E","Population Growth"]]},{"id":"4-MC-32","t":"MC","q":"The Jones State Bank is thinking about adding a branch office on the west side of Edmond, Oklahoma. Jones State Bank has discovered that area surrounding the proposed site averages 4 houses per acre and has several subdivisions that each have 300 to 400 homes. Which factor would this address when considering whether to add a new branch?","a":"D","o":[["A","Traffic count"],["B","Number of retail shops"],["C","Average age of the local population"],["D","Population Density"],["E","Population Growth"]]},{"id":"4-MC-33","t":"MC","q":"The Jones State Bank is thinking about adding a branch office on the west side of Edmond, Oklahoma. Jones State Bank has done a survey of local residents near the area where they want to build and has discovered that most residents are in their 50’s and 60’s. Which factor would this address when considering whether to add a new branch?","a":"C","o":[["A","Traffic count"],["B","Number of retail shops"],["C","Average age of the local population"],["D","Population Density"],["E","Population Growth"]]},{"id":"4-MC-34","t":"MC","q":"The Fred National Bank is thinking about adding a branch office on the west side of town. The Fred National Bank has done a survey and has discovered that the mean household income in the area is $76,000 per year. Which factor would this address when considering to add a new branch?","a":"B","o":[["A","Number of retail shops"],["B","Average income level of households"],["C","Ratio of population to branches"],["D","Number of service facilities operated by financial service competitors"],["E","Population density"]]},{"id":"4-MC-35","t":"MC","q":"The First State Bank is proposing to acquire The Second National Bank, to form The First State MegaBank, which will be a state member bank (a member of the Federal Reserve System) and carry federal deposit insurance. Which regulatory agency must approve the merger?","a":"D","o":[["A","Office of the Comptroller of the Currency"],["B","Federal Deposit Insurance Corporation"],["C","The state banking board"],["D","Federal Reserve"],["E","U.S. Treasury"]]},{"id":"4-MC-36","t":"MC","q":"The First National Bank is proposing to take over The Second State Bank, to form The First National MegaBank, which will be a national bank. Which regulatory agency must approve the merger?","a":"A","o":[["A","Office of the Comptroller of the Currency"],["B","Federal Deposit Insurance Corporation"],["C","The state banking board"],["D","Federal Reserve"],["E","U.S. Treasury"]]},{"id":"4-MC-37","t":"MC","q":"Which of the following is not an advantage of ATMs?","a":"A","o":[["A","A limited commitment of resources"],["B","Lower cost per transaction"],["C","Personalized service"],["D","Lower staffing needs"],["E","Geographic accessibility"]]}]},{"ch":5,"title":"The Financial Statements of Banks and Their Principal Competitors","items":[{"id":"5-TF-1","t":"TF","q":"On a bank's income statement (Report of Income) deposit costs are financial inputs.","a":"True"},{"id":"5-TF-2","t":"TF","q":"Loans and leases are financial outputs on a financial institution's balance sheet or Report of Condition.","a":"True"},{"id":"5-TF-3","t":"TF","q":"Nondeposit borrowings are a financial input on a bank's balance sheet or Report of Condition.","a":"True"},{"id":"5-TF-4","t":"TF","q":"The cost of nondeposit borrowings is a financial input on a bank's income statement or Report of Income.","a":"True"},{"id":"5-TF-5","t":"TF","q":"Securities income is a financial output listed on a financial institution's Report of Condition.","a":"False"},{"id":"5-TF-6","t":"TF","q":"Net loans on a bank's balance sheet are derived by deducting the allowance for loan losses and unearned discounts from gross loans.","a":"True"},{"id":"5-TF-7","t":"TF","q":"When a loan is classified as nonperforming any accrued interest recorded on the bank's books, but not actually received, must be deducted from a bank's loan revenues.","a":"True"},{"id":"5-TF-8","t":"TF","q":"In U.S. banking, securities gains are treated as ordinary income.","a":"True"},{"id":"5-TF-9","t":"TF","q":"Most banks report securities gains as a component of their total noninterest income.","a":"False"},{"id":"5-TF-10","t":"TF","q":"A bank displaying trading account securities on its balance sheet is serving as a security dealer and plans to sell those securities before they reach maturity.","a":"True"},{"id":"5-TF-11","t":"TF","q":"Bad loans normally do not affect a bank's current income.","a":"True"},{"id":"5-TF-12","t":"TF","q":"The expensing of a worthless loan usually must occur in the year that loan become worthless.","a":"True"},{"id":"5-TF-13","t":"TF","q":"Recoveries on loans previously charged off are added to the Provision for Loan Losses (PLL) account on a bank's income statement.","a":"False"},{"id":"5-TF-14","t":"TF","q":"Loan-loss reserves set aside to cover a particular loan or loans expected to be a problem or present the bank with above-average risk are known as specific reserves.","a":"True"},{"id":"5-TF-15","t":"TF","q":"U.S. banks (especially those with $500 million or more in total assets) are required to file financial statements audited by an independent public accountant with their principal federal regulatory agency.","a":"True"},{"id":"5-TF-16","t":"TF","q":"Off-balance-sheet items for a bank are fee generating transactions which are not recorded on their balance sheet.","a":"True"},{"id":"5-TF-17","t":"TF","q":"The experience method of accounting for future loan loss reserves allows a bank to deduct from their income statement up to .6 percent of their eligible loans.","a":"False"},{"id":"5-TF-18","t":"TF","q":"The number one source of revenue for a bank based on dollar volume is loan income.","a":"True"},{"id":"5-TF-19","t":"TF","q":"In looking at comparative balance sheets, it can be seen that large banks rely more heavily on nondeposit borrowings while small banks rely more heavily on deposits.","a":"True"},{"id":"5-TF-20","t":"TF","q":"The Pension Fund industry is now larger than the Mutual Fund industry.","a":"False"},{"id":"5-TF-21","t":"TF","q":"Off-balance-sheet items for banks have declined in recent years.","a":"False"},{"id":"5-TF-22","t":"TF","q":"Except for banks, Savings & Loans and Savings Banks hold the most deposits.","a":"True"},{"id":"5-TF-23","t":"TF","q":"\"Painting the tape\" refers to the practice whereby banks understate their nonperforming loans.","a":"False"},{"id":"5-TF-24","t":"TF","q":"Financial statements issued by banks and nonblank financial service firms are looking increasingly similar today.","a":"True"},{"id":"5-MC-1","t":"MC","q":"Bank assets fall into each of the following categories except:","a":"C","o":[["A","Loans."],["B","Investment securities."],["C","Demand deposits."],["D","Noninterest cash and due from banks."],["E","Other assets."]]},{"id":"5-MC-2","t":"MC","q":"Banks generate their largest portion of income from:","a":"A","o":[["A","Loans."],["B","Short-term investment."],["C","Demand deposits."],["D","Long-term investments."],["E","Certificates of deposit."]]},{"id":"5-MC-3","t":"MC","q":"Loans typically fall into each of the following categories except:","a":"E","o":[["A","Real estate."],["B","Consumer."],["C","Commercial and Industrial (business)."],["D","Agricultural."],["E","Municipal."]]},{"id":"5-MC-4","t":"MC","q":"Which of the following adjustments are made to gross loans and leases to obtain net loans and leases?","a":"D","o":[["A","The loan and lease loss allowance is subtracted from gross loans"],["B","Unearned income is subtracted from gross interest received"],["C","Investment income is added to gross interest received"],["D","A and B."],["E","A. and C."]]},{"id":"5-MC-5","t":"MC","q":"An example of a contra-asset account is:","a":"A","o":[["A","The loan and lease loss allowance."],["B","Unearned income."],["C","Buildings and equipment."],["D","Revenue bonds."],["E","The provision for loan loss."]]},{"id":"5-MC-6","t":"MC","q":"The noncash expense item on a bank's Report of Income designed to shelter a bank's current earnings from taxes and to help prepare for bad loans is called:","a":"D","o":[["A","Short-term debt interest"],["B","Noninterest expense"],["C","Provision for taxes"],["D","Provision for possible loan losses"],["E","None of the above."]]},{"id":"5-MC-7","t":"MC","q":"A financial institution's bad-debt reserve, as reported on its balance sheet, is called:","a":"B","o":[["A","Unearned income or discount"],["B","Allowance for possible loan losses"],["C","Intangible assets"],["D","Customer liability on acceptances"],["E","None of the above"]]},{"id":"5-MC-8","t":"MC","q":"When a bank serves as a security dealer for certain kinds of securities (mainly federal, state, and local government obligations) the value of these securities is usually recorded in what account on a bank's Report of Condition?","a":"C","o":[["A","Investment Securities"],["B","Taxable and Tax-Exempt Securities"],["C","Trading Account Securities"],["D","Secondary Reserves"],["E","None of the above"]]},{"id":"5-MC-9","t":"MC","q":"The difference between noninterest income and noninterest expenses on a bank's Report of Income is called:","a":"E","o":[["A","Net Profit Margin"],["B","Net Interest Income"],["C","Net Income After Provision for Possible Loan Losses"],["D","Income or Loss Before Income Taxes"],["E","Net Noninterest Income"]]},{"id":"5-MC-10","t":"MC","q":"The account that is built up by annual noncash expense deductions and is subtracted from Gross Loans on the Report of Condition is:","a":"D","o":[["A","Unearned income"],["B","Nonperforming loans"],["C","Allocated loan risk deductions"],["D","Allowance for possible loan losses"],["E","None of the above."]]},{"id":"5-MC-11","t":"MC","q":"Nonperforming loans are credits on which any scheduled loan repayments and interest payments are past due for more than:","a":"C","o":[["A","30 days"],["B","60 days"],["C","90 days"],["D","180 days"],["E","None of the above."]]},{"id":"5-MC-12","t":"MC","q":"One-time only transactions that often involve financial assets or real property pledged as collateral behind a loan and upon which the bank has foreclosed affect a bank's account known as:","a":"B","o":[["A","Allowance for loan losses"],["B","Nonrecurring sales of assets"],["C","Asset gains or losses"],["D","Provision for loan and security losses"],["E","None of the above."]]},{"id":"5-MC-13","t":"MC","q":"The use of fixed assets, rather than financial assets, in order to increase earnings flowing to a bank's stockholders is known as:","a":"C","o":[["A","Plant and equipment investment"],["B","Financial leverage"],["C","Operating leverage"],["D","Nondeposit capital"],["E","None of the above."]]},{"id":"5-MC-14","t":"MC","q":"Banks depend heavily upon borrowed funds supplied by customers with little owners' capital invested. This means that banks make heavy use of:","a":"A","o":[["A","Financial leverage"],["B","Capital restructuring"],["C","Operating Leverage"],["D","Margin borrowing"],["E","None of the above."]]},{"id":"5-MC-15","t":"MC","q":"When a loan is considered uncollectible, the bank's accounting department will write (charge) it off the books by reducing the ______ and the accounts. Which choice below correctly fills in the blank in the preceding sentence?","a":"C","o":[["A","PLL and Gross Loans"],["B","ALL and Net Loans"],["C","ALL and Gross Loans"],["D","PLL and Net Loans"],["E","None of the above."]]},{"id":"5-MC-16","t":"MC","q":"The common banking practice of selling those investment securities that have appreciated in order to reap a capital gain and holding onto those securities whose prices have declined is known as:","a":"A","o":[["A","Gains trading"],["B","Performance banking"],["C","Loss control trading"],["D","Selective portfolio management"],["E","None of the above."]]},{"id":"5-MC-17","t":"MC","q":"Noninterest revenue sources for a bank are called:","a":"B","o":[["A","Commitment fees on loans"],["B","Fee income"],["C","Supplemental income"],["D","Noninterest margin"],["E","None of the above."]]},{"id":"5-MC-18","t":"MC","q":"Large U.S. banks must use which of the methods listed below to determine their provision for loan loss expense?","a":"C","o":[["A","Experience method"],["B","Reserve method"],["C","Specific charge-off method"],["D","Historical cost method"],["E","None of the above."]]},{"id":"5-MC-19","t":"MC","q":"A bank's temporary lending of excess reserves to other banks is labeled on the balance sheet as:","a":"B","o":[["A","Fed Funds Purchased"],["B","Fed Funds Sold"],["C","Money Market Deposits"],["D","Securities Purchased for Resale"],["E","None of the above"]]},{"id":"5-MC-20","t":"MC","q":"A bank sells shares of its common stock with a par value of $100 for $200 in the market. Which two accounts on the bank's balance sheet are going to be affected?","a":"D","o":[["A","Retained earnings and capital surplus accounts"],["B","Subordinated notes and debentures and commons stock outstanding accounts"],["C","Retained earnings and common stock outstanding accounts"],["D","Common stock outstanding and capital surplus accounts"],["E","Only the common stock outstanding account is affected"]]},{"id":"5-MC-21","t":"MC","q":"A type of letter of credit which is widely used in international trade is known as:","a":"A","o":[["A","Banker's acceptance"],["B","Commercial paper"],["C","Repurchase agreement"],["D","Fed funds purchased"],["E","None of the above"]]},{"id":"5-MC-22","t":"MC","q":"Which of the following financial statements shows the revenues and expense of a bank over a set period of time?","a":"D","o":[["A","The statement of stockholders equity"],["B","The funds-flow statement"],["C","The report of financial condition"],["D","The report of income"],["E","None of the above"]]},{"id":"5-MC-23","t":"MC","q":"Which of the following accounts is sometimes called the bank's primary reserves?","a":"A","o":[["A","Cash and deposits due from bank"],["B","Investment securities"],["C","Trading account securities"],["D","Fed funds sold"],["E","None of the above"]]},{"id":"5-MC-24","t":"MC","q":"Which of the following assets is the largest asset item on the bank's balance sheet?","a":"C","o":[["A","Securities"],["B","Cash"],["C","Loans"],["D","Bank Premises"],["E","None of the above"]]},{"id":"5-MC-25","t":"MC","q":"What financial service industry category is second to the banking industry in total assets held:","a":"A","o":[["A","Mutual funds"],["B","Thrifts"],["C","Investment banks"],["D","Insurance companies"],["E","Pension funds"]]},{"id":"5-MC-26","t":"MC","q":"FASB Rule 115 focuses primarily on bank:","a":"B","o":[["A","Deposit sources"],["B","Investments in marketable securities"],["C","Derivatives trading"],["D","Loan-loss reserves"],["E","Federal funds"]]},{"id":"5-MC-27","t":"MC","q":"Which of the following most accurately describes the principal type(s) of bank noninterest income:","a":"E","o":[["A","Fees from fiduciary transactions"],["B","Fees from deposit transactions"],["C","Fees from securities transactions"],["D","Fees from additional noninterest income"],["E","All of the above"]]},{"id":"5-MC-28","t":"MC","q":"Fee income arising from fiduciary transactions include all of the following except:","a":"A","o":[["A","Checking account maintenance fees"],["B","Fees for managing and protecting a customer’s property"],["C","Fees for recordkeeping for corporate security"],["D","Fees for dispersing interest and dividend payments for a corporation"],["E","Fees for managing corporate and individual retirement plans"]]}]},{"ch":6,"title":"Measuring and Evaluating the Performance of Banks and Their Principal Competitors","items":[{"id":"6-TF-1","t":"TF","q":"Financial institutions that pursue the \"quiet life\" as a goal are really pursuing risk minimization.","a":"True"},{"id":"6-TF-2","t":"TF","q":"Attempting to maximize a bank's stock value is the key objective for banks which should have priority over all other bank goals.","a":"True"},{"id":"6-TF-3","t":"TF","q":"If the expected stream of future bank shareholder dividends rises, a bank's stock price should also rise, other factors held constant.","a":"True"},{"id":"6-TF-4","t":"TF","q":"If the discount factor associated with the value of a bank's stock rises, the bank's stock price should rise, other factors held constant.","a":"False"},{"id":"6-TF-5","t":"TF","q":"A bank's ROA equals its ROE times the ratio of total assets divided by total equity capital.","a":"False"},{"id":"6-TF-6","t":"TF","q":"According to the textbook a bank's asset-utilization ratio reflects the mix and yield on the bank's portfolio of assets.","a":"True"},{"id":"6-TF-7","t":"TF","q":"The bank's profit margin or ratio of net after-tax income to total operating revenue is a measure of financial leverage for a bank.","a":"False"},{"id":"6-TF-8","t":"TF","q":"The ratio of a bank's net after-tax income to pre-tax net operating income is described in the text as a measure of tax management efficiency.","a":"True"},{"id":"6-TF-9","t":"TF","q":"In the textbook the ratio of pre tax net operating income to total operating revenues is described as a measure of the effectiveness of a financial institution’s expense-control efficiency.","a":"True"},{"id":"6-TF-10","t":"TF","q":"The ratio of non-performing assets to total loans and leases is a measure of credit risk in banking.","a":"True"},{"id":"6-TF-11","t":"TF","q":"The measure of a bank's efficiency and return known as the \"earnings spread\" subtracts total interest expenses from all the bank's interest income and these two items are then divided by total assets.","a":"False"},{"id":"6-TF-12","t":"TF","q":"In recent years the U.S. banking industry's equity multiplier has generally risen in response to regulatory pressure to raise more capital.","a":"False"},{"id":"6-TF-13","t":"TF","q":"If a bank adds more full-time employees and posts the same net operating income, its employee productivity ratio, as defined in the text, must fall.","a":"True"},{"id":"6-TF-14","t":"TF","q":"The most profitable U.S. banks in terms of both ROA and ROE are medium-size institutions in the asset size range of $100 million to $10 billion, according to the textbook.","a":"True"},{"id":"6-TF-15","t":"TF","q":"ROA measures how capably the management of a financial institution has been converting the institution's assets into net earnings.","a":"True"},{"id":"6-TF-16","t":"TF","q":"The noninterest margin is generally positive for most banks.","a":"False"},{"id":"6-TF-17","t":"TF","q":"The ratio of nonperforming assets to total loans and leases is considered to be a measure of a bank's market risk.","a":"False"},{"id":"6-TF-18","t":"TF","q":"Charge-offs represent securities a bank decides to sell because they have declined in value.","a":"False"},{"id":"6-TF-19","t":"TF","q":"Loans past due for 90 days or more are classified as nonperforming assets.","a":"True"},{"id":"6-TF-20","t":"TF","q":"The ratio of cash and government securities to total assets is considered to be a measure of liquidity risk in banking.","a":"True"},{"id":"6-TF-21","t":"TF","q":"The ratio of uninsured deposits to total deposits is considered to be a measure of credit risk in banking.","a":"False"},{"id":"6-TF-22","t":"TF","q":"The interest rate spread between market yields on bank debt issues (such as capital notes and CDs) and the market yields on government securities of the same maturity is considered to be a measure of market risk in banking.","a":"False"},{"id":"6-TF-23","t":"TF","q":"The ratio of a bank's net operating income to the number of a bank's full-time-equivalent employees is called the employee productivity ratio.","a":"True"},{"id":"6-TF-24","t":"TF","q":"Smaller banks usually have fewer liquid assets than larger banks.","a":"False"},{"id":"6-TF-25","t":"TF","q":"The bank's asset utilization ratio reflects the effectiveness of the bank's expense management.","a":"False"},{"id":"6-TF-26","t":"TF","q":"The FDIC is a private credit rating company which provides credit ratings on the short term and long term securities issued by banks.","a":"False"},{"id":"6-TF-27","t":"TF","q":"During the 1980's the Comptroller of the Currency, the Federal Reserve and the FDIC created a new tool to help them analyze the financial condition of banks. This new tool is called the Uniform Bank Performance Report.","a":"True"},{"id":"6-TF-28","t":"TF","q":"Liquidity risk for a bank examines the quality of the bank's assets and, in particular, the quality of the bank's loans.","a":"False"},{"id":"6-TF-29","t":"TF","q":"The bank's degree of asset utilization (AU) or ratio of total operating revenue to total assets is a measure of asset management efficiency, especially in terms of the mix and yield on assets.","a":"True"},{"id":"6-TF-30","t":"TF","q":"According the case study of the failure of Superior Bank of Chicago and the FDIC’s takeover of this institution in 2001, the main problem was attributed to misleading accounting practices of inflating asset values and revenues deflating liabilities and expenses. The Sarbanes-Oxley Accounting Standards Act of 2002 addresses this issue and expressly encourages combining auditing and consulting relationships in order to promote efficiency and profitability of financial institutions.","a":"False"},{"id":"6-MC-1","t":"MC","q":"The ratio of a bank's interest income from its loans and security investments less interest expenses on debt issued divided by total earning assets measures a bank's:","a":"C","o":[["A","Net operating margin"],["B","Net return before special transactions"],["C","Net interest margin"],["D","Return on assets"],["E","None of the above"]]},{"id":"6-MC-2","t":"MC","q":"ROE for a bank is calculated by:","a":"A","o":[["A","Dividing net after-tax income by total equity capital."],["B","Dividing total operating revenue less operating expenses by total assets."],[
